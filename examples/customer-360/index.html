<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer 360</title>
<style id="design-system">
/* Shared design system for the example Spaces (AI Control Tower, Sub4Me).
   Source of truth: examples/shared/design-system.css. Embedded into each Space by
   `npm run sync:design` (Spaces are single-file pages: no network, no external CSS).
   Light and dark follow prefers-color-scheme (or data-theme on <html>); colours only exist as tokens. */
:root{
  color-scheme:light dark;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:var(--font); /* one typeface everywhere; numbers use tabular figures */
  --canvas:#f6f5f8;--surface:#ffffff;--ink:#1b1a22;--ink-2:#46444f;--muted:#6c6a78;--faint:#c3c1cd;--hint:var(--muted);--red-ink:var(--red);--green-ink:#27755a;--purple-ink:#665b92;--amber-ink:#7a5f2f;--blue-ink:#476690;--line:#e6e4ec;--line-2:#f1f0f5;--wash:#faf9fc;
  --purple:#7B6FA6;--purple-mid:#62578A;--purple-deep:#3F3860;--purple-dim:rgba(123,111,166,.07);--purple-border:rgba(123,111,166,.20);--purple-light:#eeecf5;
  --green:#2F8A6B;--green-dim:rgba(47,138,107,.08);--green-border:rgba(47,138,107,.20);
  --amber:#8A6D3B;--amber-dim:rgba(138,109,59,.07);--amber-border:rgba(138,109,59,.20);
  --red:#B5483F;--red-dim:rgba(181,72,63,.07);--red-border:rgba(181,72,63,.20);
  --blue:#5B79A3;--blue-dim:rgba(91,121,163,.08);--blue-border:rgba(91,121,163,.22);
  --teal:#006b75;--teal-dim:rgba(0,107,117,.09);
  --radius:20px;--radius-s:12px;--shadow:0 1px 2px rgba(20,18,30,.04),0 6px 20px rgba(20,18,30,.05);--shadow-lg:0 24px 60px rgba(20,18,30,.22);
  --space:8px;
  /* Control Tower token names */
  --black:var(--surface);--white:var(--surface);
  --g900:var(--ink);--g700:var(--ink-2);--g500:var(--muted);--g300:var(--faint);--g200:var(--line);--g100:var(--line-2);--g50:var(--wash);
  --sh:var(--shadow);--p-dim:var(--purple-dim);--r-dim:var(--red-dim);--r-bd:var(--red-border);--a-bd:var(--amber-border);--g-bd:var(--green-border);
  /* Sub4Me token names */
  --bg:var(--canvas);--panel:var(--surface);--mut:var(--muted);--brand:var(--purple);--brand-dim:var(--purple-dim);
  --ok:var(--green);--ok-dim:var(--green-dim);--warn:var(--amber);--warn-dim:var(--amber-dim);--bad:var(--red);--bad-dim:var(--red-dim);
}
/* Dark follows the system unless the host pins a theme with data-theme on <html> (the app does, so Spaces follow its Appearance setting). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0f0e13;--surface:#18171d;--ink:#f4f3f8;--ink-2:#d3d1dc;--muted:#9e9cab;--faint:#5b5967;--hint:#8a8897;--red-ink:var(--red);--green-ink:var(--green);--purple-ink:var(--purple);--amber-ink:var(--amber);--blue-ink:var(--blue);--line:#2b2a33;--line-2:#222129;--wash:#1d1c24;
  --purple:#A599C8;--purple-mid:#BDB3DA;--purple-deep:#DAD4EC;--purple-dim:rgba(165,153,200,.10);--purple-border:rgba(165,153,200,.26);--purple-light:#26232f;
  --green:#6FBF9F;--green-dim:rgba(111,191,159,.10);--green-border:rgba(111,191,159,.24);
  --amber:#C9AE7C;--amber-dim:rgba(201,174,124,.09);--amber-border:rgba(201,174,124,.24);
  --red:#D98A82;--red-dim:rgba(217,138,130,.10);--red-border:rgba(217,138,130,.24);
  --blue:#93A9CB;--blue-dim:rgba(147,169,203,.10);--blue-border:rgba(147,169,203,.26);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0f0e13;--surface:#18171d;--ink:#f4f3f8;--ink-2:#d3d1dc;--muted:#9e9cab;--faint:#5b5967;--hint:#8a8897;--red-ink:var(--red);--green-ink:var(--green);--purple-ink:var(--purple);--amber-ink:var(--amber);--blue-ink:var(--blue);--line:#2b2a33;--line-2:#222129;--wash:#1d1c24;
  --purple:#A599C8;--purple-mid:#BDB3DA;--purple-deep:#DAD4EC;--purple-dim:rgba(165,153,200,.10);--purple-border:rgba(165,153,200,.26);--purple-light:#26232f;
  --green:#6FBF9F;--green-dim:rgba(111,191,159,.10);--green-border:rgba(111,191,159,.24);
  --amber:#C9AE7C;--amber-dim:rgba(201,174,124,.09);--amber-border:rgba(201,174,124,.24);
  --red:#D98A82;--red-dim:rgba(217,138,130,.10);--red-border:rgba(217,138,130,.24);
  --blue:#93A9CB;--blue-dim:rgba(147,169,203,.10);--blue-border:rgba(147,169,203,.26);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}
:root[data-theme="light"]{color-scheme:light}

/* ---- Base ---- */
body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* Calmer labels: no all-caps micro headings, also where pages style them inline. */
[style*="text-transform:uppercase"]{text-transform:none!important;letter-spacing:0!important}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}
.tag,.mv,.bv,.kval,.dv,.tbl td,.num,.hdr-stat-val{font-variant-numeric:tabular-nums}

/* ---- Cards and tiles (both Spaces) ---- */
.mc,.card,.ns,.dtier,.pc,.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mc{padding:20px 22px}
.card,.ns{padding:24px;margin-bottom:16px}
.dtier,.pc,.cc{padding:18px}
.ns{border-top:1px solid var(--line)}
.ml,.k{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.mv,.v{font-family:var(--font);font-size:30px;font-weight:650;letter-spacing:-.025em;color:var(--ink);line-height:1.15}
.md,.s{font-size:12px}
.sh{font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);margin:36px 0 14px}
.chd{font-size:15px;font-weight:650;color:var(--ink)}

/* Status tags */
.tag{font-family:var(--font);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;border-width:1px}
.src{border-radius:99px;font-weight:600}

/* Tables */
.tbl th,table th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 14px}
.tbl td,table td{padding:14px;border-bottom:1px solid var(--line-2)}
.tbl{border-collapse:collapse}

/* Bars */
.bt{height:6px;border-radius:99px;background:var(--line-2)}
.bf{border-radius:99px}
.bar{background:var(--line-2)}

/* Alerts, notes and callouts */
.ab{border-radius:var(--radius);border-width:1px;border-left-width:1px;padding:18px 20px}
.ab-w{border-color:var(--amber-border)}.ab-i{border-color:var(--purple-border)}.ab-s{border-color:var(--blue-border)}.ab-ok{border-color:var(--green-border)}

/* Forms and buttons */
input,select,textarea{font-family:var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px var(--purple-dim)}
/* Calm Bento buttons: one family. Primary = Accenture purple on white text, secondary = soft tint, quiet = neutral. */
button.primary,button.ghost,button.small{font:inherit;font-size:13px;font-weight:550;line-height:1.2;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
button.primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 1px 2px rgba(70,0,115,.18)}
button.small{padding:5px 11px;font-size:12px;background:var(--purple-dim);border-color:var(--purple-border);color:var(--purple-ink)}
button.ghost:hover:not(:disabled),button.small:hover:not(:disabled){border-color:var(--purple-border);background:var(--purple-dim);color:var(--purple-ink)}
button.primary:hover:not(:disabled){background:var(--purple-mid);border-color:var(--purple-mid)}
button.primary:disabled,button.ghost:disabled,button.small:disabled{opacity:.5;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}:root:not([data-theme="light"]) button.small,:root:not([data-theme="light"]) button.ghost:hover:not(:disabled){color:var(--purple-ink)}}
:root[data-theme="dark"] button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}
:root[data-theme="dark"] button.small,:root[data-theme="dark"] button.ghost:hover:not(:disabled){color:var(--purple-ink)}

/* Bento: the first tile of a KPI row carries the accent wash. */

/* Overlay (agent list) */
.ag-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 30px}
.ag-ov{background:rgba(14,12,20,.55);backdrop-filter:blur(4px);z-index:200}
.ag-x,.ag-tools input,.ag-tools button{border-radius:var(--radius-s)}
.ag-x{background:var(--surface);color:var(--ink);border-color:var(--line)}
.ag-tools button{background:var(--purple-dim);color:var(--purple-ink);border-color:var(--purple-border)}
.ag-tbl th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ag-tbl td{padding:10px 8px}

/* ---- Control Tower shell ---- */
.ct .hdr{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:60px;padding:0 32px}
.ct .hdr-title{color:var(--ink);font-size:15px;font-weight:650}
.ct .hdr-sub{font-family:var(--font);font-size:11px;letter-spacing:.01em;color:var(--muted)}
.ct .hdr-div{background:var(--line)}
.ct .acc-mark{color:var(--purple-ink)}
.ct .hdr-stat-val{color:var(--ink);font-family:var(--font);font-weight:600}
.ct .hdr-stat-lbl{color:var(--muted);letter-spacing:.02em;text-transform:none;font-size:11px}
.ct .live{color:var(--muted);font-family:var(--font)}
.ct .tbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.ct .tb{padding:16px 14px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.ct .tb:hover:not(.on){color:var(--ink)}
.ct .tb.on{color:var(--purple-ink);border-bottom:2px solid var(--purple);font-weight:600}
.ct .tnum{display:none}
.ct .pg{padding:40px 32px 64px;max-width:1320px;margin:0 auto}
.ct .mr{gap:16px;margin-bottom:32px}
.ct .g2,.ct .g3,.ct .g4{gap:20px}
.ct .br{margin-bottom:14px}
.ct .krow,.ct .srow,.ct .ci{padding:14px 0}
.ct .kdesc,.ct .sdesc,.ct .abod{line-height:1.65}
.ct .fn{border-radius:99px;font-family:var(--font)}
.ct .ns-fml{font-family:var(--font);border-radius:var(--radius-s)}
.ct .dm{font-family:var(--font);letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:500}

/* ---- Sub4Me shell ---- */
.s4m header{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 32px;min-height:60px;box-sizing:border-box}
.s4m .logo{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.5}
.s4m header .s{font-size:11px;letter-spacing:.01em;line-height:1.5;margin-top:1px;color:var(--muted)}
.s4m{font-size:13px}
.s4m .demo{padding:8px 32px}
.s4m nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.s4m nav button{padding:16px 14px 14px;font-size:13px;font-weight:500;line-height:normal;border-bottom:2px solid transparent}
.s4m nav button:hover:not([aria-selected=true]){color:var(--ink)}
.s4m nav button[aria-selected=true]{font-weight:600;border-bottom-color:var(--purple)}
.s4m main{padding:40px 32px 64px;max-width:1320px}
.s4m .grid{gap:16px;margin-bottom:28px}
.s4m h2{font-size:13px;font-weight:600;margin:36px 0 14px}
.s4m .row{gap:20px}
.s4m .months span{border-radius:8px 8px 0 0}
.s4m .bar{height:6px}
@media(max-width:640px){.ct .pg,.s4m main{padding:24px 16px 48px}.ct .hdr,.ct .tbar,.s4m header,.s4m nav{padding-left:16px;padding-right:16px}}
.s4m .months.stack div{cursor:default}
.s4m .months.stack .col{display:flex;flex-direction:column-reverse;width:100%;flex:1;justify-content:flex-start;gap:1px}
.s4m .months.stack .col i{display:block;width:100%;min-height:1px}
.s4m .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11px;color:var(--mut)}
.s4m .legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.s4m #products tbody tr{cursor:pointer}
.s4m #products tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #products tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m #contracts tbody tr,.s4m #offers tbody tr{cursor:pointer}
.s4m #contracts tbody tr[aria-selected="true"],.s4m #offers tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #contracts tbody tr:focus-visible,.s4m #offers tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .detail{margin-top:12px}
.s4m .detail .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
.s4m .detail .head .t{font-size:18px;font-weight:600}
.s4m .detail .hint{margin:0 0 4px}
.s4m .detail .secs{display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px}
.s4m .detail h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .detail dl{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:5px 12px;font-size:13px}
.s4m .detail dt{color:var(--muted)}
.s4m .detail dd{margin:0;overflow-wrap:anywhere}
.s4m .detail .lines{margin-top:16px;overflow-x:auto}
.s4m .detail .note{margin-top:14px;font-size:13px;color:var(--muted)}
.s4m #product-detail{margin-top:16px}
.s4m #product-detail .dgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0 18px}
.s4m #product-detail .dgrid .v{font-size:20px;font-weight:600}
.s4m #offers td:not(:nth-child(2)),.s4m #offers th,.s4m #contracts td:not(:nth-child(2)):not(:nth-child(3)){white-space:nowrap}

/* Skill Marketplace: impact, governance, gaps and the skill detail view */
.s4m .smx-kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:6px}
.s4m .smx-kpis .v{font-size:24px;font-weight:600}
.s4m tr[data-skill],.s4m article.sk[data-skill]{cursor:pointer}
.s4m tr[data-skill]:hover{background:var(--line-2)}
.s4m tr[data-skill]:focus-visible,.s4m article.sk[data-skill]:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .smx-spark{display:inline-flex;align-items:flex-end;gap:3px;height:28px;min-width:72px}
.s4m .smx-spark i{display:block;width:8px;border-radius:2px;background:var(--brand);opacity:.45}
.s4m .smx-spark i.cur{opacity:.2}
.s4m .smx-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.s4m .smx-title{font-size:20px;font-weight:600}
.s4m .smx-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.s4m .smx-grid h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .smx-dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:13px}
.s4m .smx-dl dt{color:var(--muted)}
.s4m .smx-dl dd{margin:0;overflow-wrap:anywhere}
.s4m .smx-list{margin:4px 0 0;padding-left:18px;font-size:13px}
.s4m .smx-list li{margin:3px 0}
.s4m #detail-back{margin-bottom:10px}
.s4m .smx-rate{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.s4m .smx-stars{display:inline-block;letter-spacing:1px;line-height:1;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--faint) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.s4m .smx-stars-sm{font-size:12px}
.s4m .smx-line{margin:2px 0 6px;font-size:13px}
.s4m .smx-big{font-size:32px;font-weight:600;line-height:1.1}
.s4m .smx-bars{display:grid;gap:5px;margin-top:10px;font-size:12px}
.s4m .smx-bar{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:8px;color:var(--muted)}
.s4m .smx-bar i{display:block;height:8px;border-radius:4px;background:var(--line)}
.s4m .smx-bar i b{display:block;height:100%;border-radius:4px;background:var(--amber)}
.s4m .smx-bar .num{text-align:right}
/* Collapsible "What is this page?" card (details element) */
details.intro>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
details.intro>summary::-webkit-details-marker{display:none}
details.intro>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
details.intro[open]>summary::before{transform:rotate(45deg)}
details.intro>summary h2{margin:0!important}
details.intro>summary .hint{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
details.intro>summary:focus-visible{outline:2px solid var(--purple);outline-offset:4px;border-radius:6px}
details.intro .body{margin-top:8px}
@media (prefers-reduced-motion:reduce){details.intro>summary::before{transition:none}}
</style>
<style>
body{margin:0}
.c3{max-width:1360px;margin:0 auto;padding:20px 28px 56px}
.c3 h1{font-size:20px;font-weight:650;letter-spacing:-.015em;margin:0}
.demo{font-size:12px;color:var(--muted);margin:0 0 10px}
.c3-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.c3-sub{font-size:12px;color:var(--muted);margin-top:3px}
.c3-modes{display:flex;gap:6px}
.c3-modes button[aria-pressed="true"]{background:var(--purple-dim);border-color:var(--purple-border);color:var(--purple-mid)}
.c3-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.c3-act{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);display:flex;flex-direction:column;gap:6px;transition:border-color .2s,background .2s,box-shadow .2s}
.c3-act:hover{border-color:var(--purple-border)}
.c3-act:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.c3-act .t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.c3-act .n{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:650;background:var(--line-2);color:var(--muted);flex:none}
.c3-act .d{display:flex;gap:4px}
.c3-act .d i{height:4px;flex:1;border-radius:99px;background:var(--line);transition:background .3s}
.c3-act .d i.on{background:var(--purple)}
.c3-act .d i.cur{background:var(--purple);box-shadow:0 0 0 2px var(--purple-dim)}
.c3-act.on{border-color:var(--purple-border);background:var(--purple-dim);box-shadow:var(--shadow)}
.c3-act.on .n{background:var(--purple);color:var(--surface)}
.c3-act.on .t{color:var(--ink)}

o","about":["nl-lo","O-7103","hallmann"],"text":"Subject: Delay prediction. Birgit Hallmann confirms interest in Joule delay prediction for transport orders. Procurement at Business Services objects to the 18 percent discount request and asks for a deal desk review before 15 December."},{"id":"S-07","kind":"Call","date":"2026-10-14","contact":"lindqvist","entity":"nl-se","about":["nl-se","O-7105","T-30470","C-2025-0310"],"text":"Call with Anja Lindqvist. Nordic is close to its BTP consumption quota (ticket T-30470) and is interested in Integrated Business Planning, provided data stays in the EU region. No budget decision before mid 2027."}],"story":"nordlicht","forecast":{"node":"pay:nl-ma","customer":"nordlicht","company":"Nordlicht Maschinenbau GmbH"},"presets":["Which invoices are overdue?","What did Katrin Brandt write?","Which contracts need a decision before the year ends?","Who is the blocker at Polska?","Which deals need the deal desk?","What should we do first for Nordlicht?"]}</script>

<script>
(function () {
  'use strict';
  // Two customers live in one page: Nordlicht (id "data") and Lindenau (id "data-lindenau"). boot() builds the page for one of them
  // and takes the previous one down first (loop stopped, listeners removed), so switching never leaves a second copy running.
  var DATASETS = { nordlicht: JSON.parse(document.getElementById('data').textContent), lindenau: JSON.parse(document.getElementById('data-lindenau').textContent) };
  var stopPage = null;
  // ---- Sales journey: the same rail in Sales, Customer 360 and E-mail (shared/journey.mjs, copied here by npm run sync:mockups)
  // @journey-start
function makeJourney() {
  var CUSTOMERS = {
    lindenau: { name: 'Lindenau Pharma AG', sales: true, c360: 'lindenau', mail: 'lindenau', renewals: true },
    muster: { name: 'Muster Industrie AG', sales: true, c360: null, mail: 'muster', renewals: true },
    hanse: { name: 'Hanse Handelsgruppe AG', sales: true, c360: null, mail: null, renewals: true },
    nordlicht: { name: 'Nordlicht Gruppe', sales: false, c360: 'nordlicht', mail: null, renewals: false },
  };
  var STEPS = [
    { id: 'today', label: 'Today', ask: 'What needs me now?' },
    { id: 'understand', label: 'Understand', ask: 'Who is the customer, what was said?' },
    { id: 'decide', label: 'Decide', ask: 'What do we do first?' },
    { id: 'act', label: 'Act', ask: 'Prepare it, get it approved' },
    { id: 'follow', label: 'Follow up', ask: 'Did it work?' },
  ];
  var STOPS = [
    { id: 'inbox', step: 'today', label: 'Inbox', space: 'sales', tab: 'inbox' },
    { id: 'meetings', step: 'today', label: 'Meetings', space: 'sales', tab: 'meetings' },
    { id: 'c360', step: 'understand', label: 'Customer 360', space: 'customer-360', needs: 'c360' },
    { id: 'mails', step: 'understand', label: 'E-mails', space: 'customer-emails', needs: 'mail' },
    { id: 'graph', step: 'understand', label: 'Deal graph', space: 'sales', tab: 'knowledge' },
    { id: 'pipeline', step: 'decide', label: 'Pipeline', space: 'sales', tab: 'pipeline' },
    { id: 'forecast', step: 'decide', label: 'Forecast', space: 'sales', tab: 'forecast' },
    { id: 'workflow', step: 'act', label: 'Skills', space: 'sales', tab: 'workflow' },
    { id: 'governance', step: 'act', label: 'Approvals', space: 'sales', tab: 'governance' },
    { id: 'payments', step: 'follow', label: 'Late payments', space: 'sales', tab: 'payments' },
  ];
  /** Which step a Sales tab belongs to (for the highlighted step of the rail). */
  var TAB_STEP = { inbox: 'today', meetings: 'today', knowledge: 'understand', pipeline: 'decide', forecast: 'decide', workflow: 'act', governance: 'act', rules: 'act', payments: 'follow' };
  var TAB = /^[a-z]{1,20}$/, DEAL = /^[A-Za-z0-9-]{1,30}$/, THREAD = /^T-[0-9]{1,4}$/, FOCUS = /^(group|entity|contact|contract|product|opportunity|order|invoice|pay|ticket|signal|rec):[A-Za-z0-9._-]{1,40}$/;

  function stop(id) { for (var i = 0; i < STOPS.length; i++) if (STOPS[i].id === id) return STOPS[i]; return null; }
  function customerOfAccount(name) { for (var k in CUSTOMERS) if (CUSTOMERS[k].name === name) return k; return null; }
  /** A stop is open for a customer when the Space has sample data for him. */
  function available(s, customer) {
    var c = CUSTOMERS[customer];
    if (!c || !s) return false;
    if (s.space === 'sales') return c.sales;
    return !!c[s.needs];
  }
  /** The hand-over for a stop in another Space. ctx: { customer, deal?, thread?, focus? }. */
  function handoff(s, ctx) {
    var j = { customer: ctx.customer, step: s.step };
    if (s.tab) j.tab = s.tab;
    if (ctx.deal && DEAL.test(ctx.deal)) j.deal = ctx.deal;
    if (ctx.thread && THREAD.test(ctx.thread)) j.thread = ctx.thread;
    if (ctx.focus && FOCUS.test(ctx.focus)) j.focus = ctx.focus;
    return { type: 'wb:handoff', to: s.space, payload: { journey: j }, open: true, notice: 'Journey: ' + s.label + ' for ' + CUSTOMERS[ctx.customer].name };
  }
  /** Reads a journey from a hand-over payload: only known values pass, everything else is dropped. */
  function parse(payload) {
    var raw = payload && typeof payload === 'object' ? payload.journey : null;
    if (!raw || typeof raw !== 'object' || typeof raw.customer !== 'string' || !CUSTOMERS[raw.customer]) return null;
    var out = { customer: raw.customer, step: 'today' };
    for (var i = 0; i < STEPS.length; i++) if (STEPS[i].id === raw.step) out.step = raw.step;
    if (typeof raw.tab === 'string' && TAB.test(raw.tab)) out.tab = raw.tab;
    if (typeof raw.deal === 'string' && DEAL.test(raw.deal)) out.deal = raw.deal;
    if (typeof raw.thread === 'string' && THREAD.test(raw.thread)) out.thread = raw.thread;
    if (typeof raw.focus === 'string' && FOCUS.test(raw.focus)) out.focus = raw.focus;
    return out;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var CSS = '.jr{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 14px;padding:10px 16px;margin:0;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)}' +
    '.jr-who{display:flex;flex-direction:column;justify-content:center;min-width:130px}.jr-who b{font-size:13px;color:var(--ink)}.jr-who span{color:var(--muted)}' +
    '.jr ol{display:flex;flex:1 1 420px;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}' +
    '.jr li{flex:1 1 130px;min-width:120px;border:1px solid var(--line);border-radius:12px;padding:6px 9px;background:var(--canvas)}' +
    '.jr li[aria-current="step"]{border-color:var(--purple);background:var(--purple-dim)}' +
    '.jr li{transition:background-color .12s ease,border-color .12s ease}.jr li:hover:not([aria-current="step"]){background:var(--purple-light);border-color:var(--purple-border)}' +
    '.jr .jr-h{display:flex;gap:6px;align-items:baseline;font-weight:600;color:var(--ink)}.jr .jr-n{color:var(--purple);font-variant-numeric:tabular-nums}' +
    '.jr .jr-a{color:var(--muted);margin:1px 0 4px;font-size:11px}' +
    '.jr .jr-s{display:flex;flex-wrap:wrap;gap:4px}' +
    '.jr button{font:inherit;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}' +
    '.jr button:hover:not(:disabled){border-color:var(--purple);color:var(--ink)}.jr button[aria-current="true"]{background:var(--purple);border-color:var(--purple);color:var(--surface)}' +
    '.jr button:disabled{opacity:.45;cursor:not-allowed}' +
    '.jr-val{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--canvas);font-size:12px;color:var(--muted)}' +
    '.jr-val b{color:var(--ink);font-variant-numeric:tabular-nums}.jr-val .jr-note{margin-left:auto}' +
    '@media (max-width:640px){.jr li{flex-basis:100%}}';
  function injectStyle(doc) {
    if (doc.getElementById('journey-style')) return;
    var st = doc.createElement('style'); st.id = 'journey-style'; st.textContent = CSS; doc.head.appendChild(st);
  }
  /**
   * The rail as HTML. cur: { space, step, stop?, customer }, values: [[label, value], ...] for the strip, note: optional text at the right.
   * The stop that is shown on this page gets aria-current="true"; a stop the customer has no sample data for is disabled.
   */
  function railHtml(cur, values, note) {
    var c = CUSTOMERS[cur.customer] || CUSTOMERS.lindenau;
    var steps = STEPS.map(function (st, i) {
      var stops = STOPS.filter(function (s) { return s.step === st.id; }).map(function (s) {
        var ok = available(s, cur.customer), here = cur.stop === s.id;
        return '<button type="button" data-jr-stop="' + esc(s.id) + '"' + (ok ? '' : ' disabled title="No sample data for ' + esc(c.name) + '"') + ' aria-current="' + here + '">' + esc(s.label) + '</button>';
      }).join('');
      return '<li' + (cur.step === st.id ? ' aria-current="step"' : '') + '><div class="jr-h"><span class="jr-n">' + (i + 1) + '</span>' + esc(st.label) + '</div><div class="jr-a">' + esc(st.ask) + '</div><div class="jr-s">' + stops + '</div></li>';
    }).join('');
    var strip = values && values.length ? '<div class="jr-val">' + values.map(function (v) { return '<span>' + esc(v[0]) + ' <b>' + esc(v[1]) + '</b></span>'; }).join('') + (note ? '<span class="jr-note">' + esc(note) + '</span>' : '') + '</div>' : '';
    return '<nav class="jr" aria-label="Sales journey"><div class="jr-who"><b>' + esc(c.name) + '</b><span>Sales journey</span></div><ol>' + steps + '</ol></nav>' + strip;
  }
  return { CUSTOMERS: CUSTOMERS, STEPS: STEPS, STOPS: STOPS, TAB_STEP: TAB_STEP, stop: stop, available: available, handoff: handoff, parse: parse, customerOfAccount: customerOfAccount, railHtml: railHtml, injectStyle: injectStyle };
}
// @journey-end
  var J = makeJourney(); J.injectStyle(document);
  var jrNote = '', jrFocus = null;
  function boot(key) {
  if (stopPage) stopPage();
  var D = DATASETS[key], alive = true, offs = [];
  function on(target, type, fn, opt) { target.addEventListener(type, fn, opt); offs.push(function () { target.removeEventListener(type, fn, opt); }); }
  stopPage = function () { alive = false; offs.forEach(function (f) { f(); }); };

  // @logic-start
function makeLogic(D) {
  var ASOF = D.asOf;
  var R = D.rules;
  function ms(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function daysBetween(a, b) { return Math.round((ms(b) - ms(a)) / 86400000); }
  function addDays(s, n) { return new Date(ms(s) + n * 86400000).toISOString().slice(0, 10); }
  function by(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function eur(n) { return Math.round(n).toLocaleString('en-US'); }
  function eurShort(n) { return n >= 1e6 ? (n / 1e6).toFixed(2) + ' M' : n >= 1e4 ? Math.round(n / 1000) + ' k' : eur(n); }
  function ent(id) { return by(D.entities, id); }
  function contract(id) { return by(D.contracts, id); }
  function product(id) { return by(D.products, id); }
  function sum(list, f) { var t = 0; list.forEach(function (x) { t += f(x); }); return t; }

  // ---- payment, renewal, pipeline, order-to-cash ---------------------------------------------------------------------------------
  /** How an entity pays: only invoices that are for this entity. Days late is negative when paid early. */
  function paymentOf(entityId) {
    var inv = D.invoices.filter(function (i) { return i.entity === entityId; });
    var paid = inv.filter(function (i) { return i.status === 'Paid'; });
    var overdue = inv.filter(function (i) { return i.status === 'Overdue'; });
    var open = inv.filter(function (i) { return i.status === 'Open'; });
    var late = paid.filter(function (i) { return i.daysLate > 0; });
    var avg = paid.length ? sum(paid, function (i) { return i.daysLate; }) / paid.length : 0;
    var oldest = 0;
    overdue.forEach(function (i) { oldest = Math.max(oldest, daysBetween(i.dueOn, ASOF)); });
    var P = R.payment;
    var risk = !paid.length ? 'none' : (avg >= P.highAvgDaysLate || oldest >= P.highOverdueDays) ? 'high' : avg >= P.mediumAvgDaysLate ? 'medium' : 'low';
    return {
      entity: entityId, invoices: inv.length, paid: paid.length, lateCount: late.length, avgDaysLate: Math.round(avg * 10) / 10,
      maxDaysLate: paid.length ? Math.max.apply(null, paid.map(function (i) { return i.daysLate; })) : 0,
      overdue: overdue, open: open, oldestOverdueDays: oldest,
      exposureGross: sum(overdue.concat(open), function (i) { return i.grossEur; }),
      overdueGross: sum(overdue, function (i) { return i.grossEur; }), risk: risk,
    };
  }
  /** Contract end, decision date (end minus notice) and how urgent it is. */
  function renewalOf(c) {
    var decision = addDays(c.end, -c.noticeDays);
    var toDecision = daysBetween(ASOF, decision), toEnd = daysBetween(ASOF, c.end);
    var U = R.urgencyDays, status;
    if (c.status === 'Lapsed' || toEnd < 0) status = 'lapsed';
    else if (c.autoRenew && toDecision < 0) status = 'auto-renews';
    else if (toDecision < 0) status = 'decision-passed';
    else if (toDecision <= U.near) status = 'near';
    else if (toDecision <= U.soon) status = 'soon';
    else status = 'later';
    return { contract: c.id, decisionDate: decision, daysToDecision: toDecision, daysToEnd: toEnd, status: status };
  }
  function prob(o) { return o.probability != null ? o.probability : R.stageProbability[o.stage]; }
  function weighted(o) { return o.acvEur * prob(o) / 100; }
  function pipeline(entityId) {
    var l = D.opportunities.filter(function (o) { return !entityId || o.entity === entityId; });
    return { count: l.length, acv: sum(l, function (o) { return o.acvEur; }), weighted: Math.round(sum(l, weighted)) };
  }
  function needsDealDesk(o) { return (o.discountPct || 0) > R.discountThresholdPct; }
  /** Order-to-cash gaps: delivered but not invoiced, invoice rejected, not yet provisioned. */
  function o2c() {
    var out = [];
    D.orders.forEach(function (o) {
      var inv = o.billed ? by(D.invoices, o.billed) : null;
      var c = contract(o.contract);
      if (o.source === 'sap-sandbox') {
        // A real sandbox order: the stage comes from the order-to-cash trace, not from the invoice list of the sample.
        var st = o.sap && o.sap.stage;
        if ((st === 'delivered_not_invoiced' || st === 'partly_invoiced') && o.sap.gapEur > 0) out.push({ order: o.id, entity: o.entity, kind: 'delivered-not-invoiced', netEur: o.sap.gapEur, text: o.title + ' is delivered and ' + (st === 'partly_invoiced' ? 'only partly' : 'not') + ' invoiced (SAP sandbox).' });
        return;
      }
      if (o.provisioned && !o.billed) out.push({ order: o.id, entity: o.entity, kind: 'delivered-not-invoiced', netEur: o.netEur, text: o.title + ' is delivered and not invoiced.' });
      else if (inv && inv.status === 'Overdue' && c && inv.billTo !== c.billTo) out.push({ order: o.id, entity: o.entity, kind: 'bill-to-mismatch', netEur: o.netEur, invoice: inv.id, text: inv.id + ' is addressed to ' + ent(inv.billTo).short + ', the contract names ' + ent(c.billTo).short + '.' });
      else if (!o.provisioned) out.push({ order: o.id, entity: o.entity, kind: 'not-provisioned', netEur: o.netEur, text: o.title + ' is signed and not yet provisioned.' });
    });
    return out;
  }
  function entityTickets(entityId) { return D.tickets.filter(function (t) { return t.entity === entityId && t.status !== 'Resolved'; }); }

  /** Per company: value, pipeline, money owed, renewal, tickets and the "heat" (stated rule, see data.rules.heat). */
  function summary(entityId) {
    var H = R.heat;

  renderJourney();
  cv.setAttribute('aria-label', 'Three-dimensional graph of ' + D.group.name + '. Use the story panel or the node list to read it.');
  var sb = D.orders.filter(function (o) { return o.source === 'sap-sandbox'; }).length;
  $('subline').textContent = (sb ? 'Fictional sample data plus ' + sb + ' SAP sandbox orders (marked as source in each order)' : 'Fictional sample data') + ' · as of ' + D.asOf + ' · ' + L.graph.nodes.length + ' nodes from ' + L.docs.length + ' documents · account team ' + D.group.accountTeam.join(', ');
  renderKpis(); renderLegend(); renderNodeList(); renderPresets();
  go(-1, { quiet: true }); route();
  list.forEach(function (o) { if (REDUCED) { o.vis = o.tvis; o.foc = o.tfoc; } });
  requestAnimationFrame(frame);
  if (jrFocus) { var want = jrFocus; jrFocus = null; if (L.node(want)) { explore(); select(want); } }
  }

  // ---- customer switch ---------------------------------------------------------------------------------------------------------------
  var pick = document.getElementById('custSel');
  pick.innerHTML = Object.keys(DATASETS).map(function (k) { return '<option value="' + k + '">' + DATASETS[k].group.name + '</option>'; }).join('');
  // A switch starts at the cover again: the position in the address (#beat=, #explore) belongs to the customer that was left.
  function switchTo(k) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
    pick.value = k; boot(k);
  }
  pick.addEventListener('change', function () { switchTo(pick.value); });
  // The app may ask for one customer ("ct:open-customer"); anything else is ignored.
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return;
    var d = e.data;
    if (!d || d.type !== 'ct:open-customer' || typeof d.customer !== 'string' || !DATASETS[d.customer]) return;
    switchTo(d.customer);
  });
  // A hand-over from another Space of the journey (wb:restore): choose the customer, optionally show one node.
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== 'wb:restore') return;
    (Array.isArray(e.data.handoffs) ? e.data.handoffs : []).forEach(function (h) {
      var j = J.parse(h && h.payload), k = j && J.CUSTOMERS[j.customer].c360;
      if (!k || !DATASETS[k]) return;
      jrFocus = j.focus || null; jrNote = ''; switchTo(k);
    });
  });
  boot(/customer=lindenau/.test(location.hash || '') ? 'lindenau' : 'nordlicht');
  pick.value = /customer=lindenau/.test(location.hash || '') ? 'lindenau' : 'nordlicht';
})();
</script>
