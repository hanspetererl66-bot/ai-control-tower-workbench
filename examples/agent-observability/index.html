<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Observability</title>
<style id="design-system">
/* Shared design system for the example Spaces (AI Control Tower, Sub4Me).
   Source of truth: examples/shared/design-system.css. Embedded into each Space by
   `npm run sync:design` (Spaces are single-file pages: no network, no external CSS).
   Light and dark follow prefers-color-scheme (or data-theme on <html>); colours only exist as tokens. */
:root{
  color-scheme:light dark;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:var(--font); /* one typeface everywhere; numbers use tabular figures */
  --canvas:#f6f5f8;--surface:#ffffff;--ink:#1b1a22;--ink-2:#46444f;--muted:#6c6a78;--faint:#c3c1cd;--hint:var(--muted);--red-ink:var(--red);--green-ink:#27755a;--purple-ink:#665b92;--amber-ink:#7a5f2f;--blue-ink:#476690;--line:#e6e4ec;--line-2:#f1f0f5;--wash:#faf9fc;
  --purple:#7B6FA6;--purple-mid:#62578A;--purple-deep:#3F3860;--purple-dim:rgba(123,111,166,.07);--purple-border:rgba(123,111,166,.20);--purple-light:#eeecf5;
  --green:#2F8A6B;--green-dim:rgba(47,138,107,.08);--green-border:rgba(47,138,107,.20);
  --amber:#8A6D3B;--amber-dim:rgba(138,109,59,.07);--amber-border:rgba(138,109,59,.20);
  --red:#B5483F;--red-dim:rgba(181,72,63,.07);--red-border:rgba(181,72,63,.20);
  --blue:#5B79A3;--blue-dim:rgba(91,121,163,.08);--blue-border:rgba(91,121,163,.22);
  --teal:#006b75;--teal-dim:rgba(0,107,117,.09);
  --radius:20px;--radius-s:12px;--shadow:0 1px 2px rgba(20,18,30,.04),0 6px 20px rgba(20,18,30,.05);--shadow-lg:0 24px 60px rgba(20,18,30,.22);
  --space:8px;
  /* Control Tower token names */
  --black:var(--surface);--white:var(--surface);
  --g900:var(--ink);--g700:var(--ink-2);--g500:var(--muted);--g300:var(--faint);--g200:var(--line);--g100:var(--line-2);--g50:var(--wash);
  --sh:var(--shadow);--p-dim:var(--purple-dim);--r-dim:var(--red-dim);--r-bd:var(--red-border);--a-bd:var(--amber-border);--g-bd:var(--green-border);
  /* Sub4Me token names */
  --bg:var(--canvas);--panel:var(--surface);--mut:var(--muted);--brand:var(--purple);--brand-dim:var(--purple-dim);
  --ok:var(--green);--ok-dim:var(--green-dim);--warn:var(--amber);--warn-dim:var(--amber-dim);--bad:var(--red);--bad-dim:var(--red-dim);
}
/* Dark follows the system unless the host pins a theme with data-theme on <html> (the app does, so Spaces follow its Appearance setting). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0f0e13;--surface:#18171d;--ink:#f4f3f8;--ink-2:#d3d1dc;--muted:#9e9cab;--faint:#5b5967;--hint:#8a8897;--red-ink:var(--red);--green-ink:var(--green);--purple-ink:var(--purple);--amber-ink:var(--amber);--blue-ink:var(--blue);--line:#2b2a33;--line-2:#222129;--wash:#1d1c24;
  --purple:#A599C8;--purple-mid:#BDB3DA;--purple-deep:#DAD4EC;--purple-dim:rgba(165,153,200,.10);--purple-border:rgba(165,153,200,.26);--purple-light:#26232f;
  --green:#6FBF9F;--green-dim:rgba(111,191,159,.10);--green-border:rgba(111,191,159,.24);
  --amber:#C9AE7C;--amber-dim:rgba(201,174,124,.09);--amber-border:rgba(201,174,124,.24);
  --red:#D98A82;--red-dim:rgba(217,138,130,.10);--red-border:rgba(217,138,130,.24);
  --blue:#93A9CB;--blue-dim:rgba(147,169,203,.10);--blue-border:rgba(147,169,203,.26);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0f0e13;--surface:#18171d;--ink:#f4f3f8;--ink-2:#d3d1dc;--muted:#9e9cab;--faint:#5b5967;--hint:#8a8897;--red-ink:var(--red);--green-ink:var(--green);--purple-ink:var(--purple);--amber-ink:var(--amber);--blue-ink:var(--blue);--line:#2b2a33;--line-2:#222129;--wash:#1d1c24;
  --purple:#A599C8;--purple-mid:#BDB3DA;--purple-deep:#DAD4EC;--purple-dim:rgba(165,153,200,.10);--purple-border:rgba(165,153,200,.26);--purple-light:#26232f;
  --green:#6FBF9F;--green-dim:rgba(111,191,159,.10);--green-border:rgba(111,191,159,.24);
  --amber:#C9AE7C;--amber-dim:rgba(201,174,124,.09);--amber-border:rgba(201,174,124,.24);
  --red:#D98A82;--red-dim:rgba(217,138,130,.10);--red-border:rgba(217,138,130,.24);
  --blue:#93A9CB;--blue-dim:rgba(147,169,203,.10);--blue-border:rgba(147,169,203,.26);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}
:root[data-theme="light"]{color-scheme:light}

/* ---- Base ---- */
body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* Calmer labels: no all-caps micro headings, also where pages style them inline. */
[style*="text-transform:uppercase"]{text-transform:none!important;letter-spacing:0!important}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}
.tag,.mv,.bv,.kval,.dv,.tbl td,.num,.hdr-stat-val{font-variant-numeric:tabular-nums}

/* ---- Cards and tiles (both Spaces) ---- */
.mc,.card,.ns,.dtier,.pc,.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mc{padding:20px 22px}
.card,.ns{padding:24px;margin-bottom:16px}
.dtier,.pc,.cc{padding:18px}
.ns{border-top:1px solid var(--line)}
.ml,.k{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.mv,.v{font-family:var(--font);font-size:30px;font-weight:650;letter-spacing:-.025em;color:var(--ink);line-height:1.15}
.md,.s{font-size:12px}
.sh{font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);margin:36px 0 14px}
.chd{font-size:15px;font-weight:650;color:var(--ink)}

/* Status tags */
.tag{font-family:var(--font);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;border-width:1px}
.src{border-radius:99px;font-weight:600}

/* Tables */
.tbl th,table th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 14px}
.tbl td,table td{padding:14px;border-bottom:1px solid var(--line-2)}
.tbl{border-collapse:collapse}

/* Bars */
.bt{height:6px;border-radius:99px;background:var(--line-2)}
.bf{border-radius:99px}
.bar{background:var(--line-2)}

/* Alerts, notes and callouts */
.ab{border-radius:var(--radius);border-width:1px;border-left-width:1px;padding:18px 20px}
.ab-w{border-color:var(--amber-border)}.ab-i{border-color:var(--purple-border)}.ab-s{border-color:var(--blue-border)}.ab-ok{border-color:var(--green-border)}

/* Forms and buttons */
input,select,textarea{font-family:var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px var(--purple-dim)}
/* Calm Bento buttons: one family. Primary = Accenture purple on white text, secondary = soft tint, quiet = neutral. */
button.primary,button.ghost,button.small{font:inherit;font-size:13px;font-weight:550;line-height:1.2;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
button.primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 1px 2px rgba(70,0,115,.18)}
button.small{padding:5px 11px;font-size:12px;background:var(--purple-dim);border-color:var(--purple-border);color:var(--purple-ink)}
button.ghost:hover:not(:disabled),button.small:hover:not(:disabled){border-color:var(--purple-border);background:var(--purple-dim);color:var(--purple-ink)}
button.primary:hover:not(:disabled){background:var(--purple-mid);border-color:var(--purple-mid)}
button.primary:disabled,button.ghost:disabled,button.small:disabled{opacity:.5;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}:root:not([data-theme="light"]) button.small,:root:not([data-theme="light"]) button.ghost:hover:not(:disabled){color:var(--purple-ink)}}
:root[data-theme="dark"] button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}
:root[data-theme="dark"] button.small,:root[data-theme="dark"] button.ghost:hover:not(:disabled){color:var(--purple-ink)}

/* Bento: the first tile of a KPI row carries the accent wash. */

/* Overlay (agent list) */
.ag-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 30px}
.ag-ov{background:rgba(14,12,20,.55);backdrop-filter:blur(4px);z-index:200}
.ag-x,.ag-tools input,.ag-tools button{border-radius:var(--radius-s)}
.ag-x{background:var(--surface);color:var(--ink);border-color:var(--line)}
.ag-tools button{background:var(--purple-dim);color:var(--purple-ink);border-color:var(--purple-border)}
.ag-tbl th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ag-tbl td{padding:10px 8px}

/* ---- Control Tower shell ---- */
.ct .hdr{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:60px;padding:0 32px}
.ct .hdr-title{color:var(--ink);font-size:15px;font-weight:650}
.ct .hdr-sub{font-family:var(--font);font-size:11px;letter-spacing:.01em;color:var(--muted)}
.ct .hdr-div{background:var(--line)}
.ct .acc-mark{color:var(--purple-ink)}
.ct .hdr-stat-val{color:var(--ink);font-family:var(--font);font-weight:600}
.ct .hdr-stat-lbl{color:var(--muted);letter-spacing:.02em;text-transform:none;font-size:11px}
.ct .live{color:var(--muted);font-family:var(--font)}
.ct .tbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.ct .tb{padding:16px 14px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.ct .tb:hover:not(.on){color:var(--ink)}
.ct .tb.on{color:var(--purple-ink);border-bottom:2px solid var(--purple);font-weight:600}
.ct .tnum{display:none}
.ct .pg{padding:40px 32px 64px;max-width:1320px;margin:0 auto}
.ct .mr{gap:16px;margin-bottom:32px}
.ct .g2,.ct .g3,.ct .g4{gap:20px}
.ct .br{margin-bottom:14px}
.ct .krow,.ct .srow,.ct .ci{padding:14px 0}
.ct .kdesc,.ct .sdesc,.ct .abod{line-height:1.65}
.ct .fn{border-radius:99px;font-family:var(--font)}
.ct .ns-fml{font-family:var(--font);border-radius:var(--radius-s)}
.ct .dm{font-family:var(--font);letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:500}

/* ---- Sub4Me shell ---- */
.s4m header{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 32px;min-height:60px;box-sizing:border-box}
.s4m .logo{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.5}
.s4m header .s{font-size:11px;letter-spacing:.01em;line-height:1.5;margin-top:1px;color:var(--muted)}
.s4m{font-size:13px}
.s4m .demo{padding:8px 32px}
.s4m nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.s4m nav button{padding:16px 14px 14px;font-size:13px;font-weight:500;line-height:normal;border-bottom:2px solid transparent}
.s4m nav button:hover:not([aria-selected=true]){color:var(--ink)}
.s4m nav button[aria-selected=true]{font-weight:600;border-bottom-color:var(--purple)}
.s4m main{padding:40px 32px 64px;max-width:1320px}
.s4m .grid{gap:16px;margin-bottom:28px}
.s4m h2{font-size:13px;font-weight:600;margin:36px 0 14px}
.s4m .row{gap:20px}
.s4m .months span{border-radius:8px 8px 0 0}
.s4m .bar{height:6px}
@media(max-width:640px){.ct .pg,.s4m main{padding:24px 16px 48px}.ct .hdr,.ct .tbar,.s4m header,.s4m nav{padding-left:16px;padding-right:16px}}
.s4m .months.stack div{cursor:default}
.s4m .months.stack .col{display:flex;flex-direction:column-reverse;width:100%;flex:1;justify-content:flex-start;gap:1px}
.s4m .months.stack .col i{display:block;width:100%;min-height:1px}
.s4m .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11px;color:var(--mut)}
.s4m .legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.s4m #products tbody tr{cursor:pointer}
.s4m #products tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #products tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m #contracts tbody tr,.s4m #offers tbody tr{cursor:pointer}
.s4m #contracts tbody tr[aria-selected="true"],.s4m #offers tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #contracts tbody tr:focus-visible,.s4m #offers tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .detail{margin-top:12px}
.s4m .detail .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
.s4m .detail .head .t{font-size:18px;font-weight:600}
.s4m .detail .hint{margin:0 0 4px}
.s4m .detail .secs{display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px}
.s4m .detail h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .detail dl{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:5px 12px;font-size:13px}
.s4m .detail dt{color:var(--muted)}
.s4m .detail dd{margin:0;overflow-wrap:anywhere}
.s4m .detail .lines{margin-top:16px;overflow-x:auto}
.s4m .detail .note{margin-top:14px;font-size:13px;color:var(--muted)}
.s4m #product-detail{margin-top:16px}
.s4m #product-detail .dgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0 18px}
.s4m #product-detail .dgrid .v{font-size:20px;font-weight:600}
.s4m #offers td:not(:nth-child(2)),.s4m #offers th,.s4m #contracts td:not(:nth-child(2)):not(:nth-child(3)){white-space:nowrap}

/* Skill Marketplace: impact, governance, gaps and the skill detail view */
.s4m .smx-kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:6px}
.s4m .smx-kpis .v{font-size:24px;font-weight:600}
.s4m tr[data-skill],.s4m article.sk[data-skill]{cursor:pointer}
.s4m tr[data-skill]:hover{background:var(--line-2)}
.s4m tr[data-skill]:focus-visible,.s4m article.sk[data-skill]:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .smx-spark{display:inline-flex;align-items:flex-end;gap:3px;height:28px;min-width:72px}
.s4m .smx-spark i{display:block;width:8px;border-radius:2px;background:var(--brand);opacity:.45}
.s4m .smx-spark i.cur{opacity:.2}
.s4m .smx-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.s4m .smx-title{font-size:20px;font-weight:600}
.s4m .smx-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.s4m .smx-grid h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .smx-dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:13px}
.s4m .smx-dl dt{color:var(--muted)}
.s4m .smx-dl dd{margin:0;overflow-wrap:anywhere}
.s4m .smx-list{margin:4px 0 0;padding-left:18px;font-size:13px}
.s4m .smx-list li{margin:3px 0}
.s4m #detail-back{margin-bottom:10px}
.s4m .smx-rate{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.s4m .smx-stars{display:inline-block;letter-spacing:1px;line-height:1;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--faint) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.s4m .smx-stars-sm{font-size:12px}
.s4m .smx-line{margin:2px 0 6px;font-size:13px}
.s4m .smx-big{font-size:32px;font-weight:600;line-height:1.1}
.s4m .smx-bars{display:grid;gap:5px;margin-top:10px;font-size:12px}
.s4m .smx-bar{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:8px;color:var(--muted)}
.s4m .smx-bar i{display:block;height:8px;border-radius:4px;background:var(--line)}
.s4m .smx-bar i b{display:block;height:100%;border-radius:4px;background:var(--amber)}
.s4m .smx-bar .num{text-align:right}
/* Collapsible "What is this page?" card (details element) */
details.intro>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
details.intro>summary::-webkit-details-marker{display:none}
details.intro>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
details.intro[open]>summary::before{transform:rotate(45deg)}
details.intro>summary h2{margin:0!important}
details.intro>summary .hint{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
details.intro>summary:focus-visible{outline:2px solid var(--purple);outline-offset:4px;border-radius:6px}
details.intro .body{margin-top:8px}
@media (prefers-reduced-motion:reduce){details.intro>summary::before{transition:none}}
</style>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.page{max-width:1320px;margin:0 auto;padding:28px 28px 64px}
h1{font-size:24px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:15px;font-weight:650;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;max-width:880px}
.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;background:var(--surface);padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:5px 14px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--purple);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--purple)}
.badge{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--red-dim);color:var(--red);border:1px solid var(--red-border)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.kpi .d{font-size:12px;font-weight:600}
.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}.mut{color:var(--muted)}
.two{grid-template-columns:2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:980px){.two,.three{grid-template-columns:1fr}.page{padding:20px 16px 48px}}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--wash)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.ok{background:var(--green)}.dot.error{background:var(--red)}.dot.blocked{background:var(--amber)}.dot.escalated{background:var(--blue)}.dot.waiting{background:var(--faint)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);background:var(--wash)}
.tag.red{color:var(--red);border-color:var(--red-border);background:var(--red-dim)}
.tag.amber{color:var(--amber);border-color:var(--amber-border);background:var(--amber-dim)}
.tag.green{color:var(--green);border-color:var(--green-border);background:var(--green-dim)}
.tag.blue{color:var(--blue);border-color:var(--blue-border);background:var(--blue-dim)}
.tag.purple{color:var(--purple-mid);border-color:var(--purple-border);background:var(--purple-dim)}
.hint{font-size:12px;color:var(--muted)}
.note{border:1px solid var(--purple-border);background:var(--purple-dim);border-radius:var(--radius-s);padding:10px 14px;margin:0 0 16px;font-size:13px}
.err{border:1px solid var(--red-border);background:var(--red-dim);border-radius:var(--radius-s);padding:14px 16px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.load{padding:36px;text-align:center;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px}
.bars .b{flex:1;min-width:2px;display:flex;flex-direction:column-reverse;border-radius:2px 2px 0 0;overflow:hidden;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:10px;color:var(--muted)}
.heat .c{height:18px;border-radius:3px;background:var(--line-2)}
.heat .h{text-align:center;line-height:14px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.btn:hover{border-color:var(--purple-border);color:var(--purple-mid)}
.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible,tr.click:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sel{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px}
.wf{position:relative}
.wf .line{display:grid;grid-template-columns:230px 1fr 90px;gap:10px;align-items:center;padding:3px 0;font-size:13px}
.wf .track{position:relative;height:18px;background:var(--line-2);border-radius:5px}
.wf .span{position:absolute;top:2px;bottom:2px;border-radius:4px;min-width:3px}
.wf .span.chat{background:var(--purple)}.wf .span.execute_tool{background:var(--blue)}.wf .span.retrieval{background:var(--teal)}
.wf .span.guardrail{background:var(--faint)}.wf .span.approval{background:var(--amber)}.wf .span.invoke_agent{background:var(--ink-2);opacity:.35}
.wf .span.s-error{background:var(--red)}.wf .span.s-blocked{background:var(--amber);outline:2px solid var(--red)}
.wf .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf .nm .k{color:var(--muted);font-size:11px;margin-left:6px}
.wf .tm{text-align:right;color:var(--muted)}
.wf .why{grid-column:2/4;font-size:12px;color:var(--red);margin:-2px 0 4px}
.pair{display:grid;grid-template-columns:150px 1fr 54px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.pair .t{height:8px;background:var(--line-2);border-radius:99px;position:relative}
.pair .f{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.al{display:grid;grid-template-columns:auto 1fr auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2);align-items:start}
.al:last-child{border-bottom:0}
.sev{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:3px 8px}
.sev.page{background:var(--red);color:#fff}.sev.ticket{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-border)}.sev.info{background:var(--line-2);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bars .b{transition:opacity .15s}.bars:hover .b{opacity:.55}.bars .b:hover{opacity:1}}
</style>
</head>
<body>
<div class="page" id="app"><div class="load">Reading the run history…</div></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var state = { tab: 'fleet', days: 30, cache: {}, trace: null, runs: { agent: '', status: '', minCost: 0 }, agentFilter: '' };
  var TABS = [['fleet', 'Fleet'], ['runs', 'Traces'], ['quality', 'Quality'], ['cost', 'Cost'], ['safety', 'Safety'], ['alerts', 'Alerts']];
  var pending = {};

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n, d) { if (n == null || isNaN(n)) return '–'; return Number(n).toLocaleString('en-GB', { maximumFractionDigits: d == null ? 0 : d, minimumFractionDigits: d == null ? 0 : d }); }
  function eur(n, d) { return n == null ? '–' : '€' + fmt(n, d == null ? (n < 10 ? 2 : 0) : d); }
  function dur(ms) { if (ms == null) return '–'; if (ms < 1000) return fmt(ms) + ' ms'; if (ms < 60000) return fmt(ms / 1000, 1) + ' s'; if (ms < 3600000) return fmt(ms / 60000, 1) + ' min'; return fmt(ms / 3600000, 1) + ' h'; }
  function when(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  function day(iso) { var d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : '')); return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }); }
  function delta(now, prev, lowerIsBetter, unit, d) {
    if (now == null || prev == null || prev === 0) return '<span class="d mut">no earlier period</span>';
    var diff = now - prev, pct = (diff / Math.abs(prev)) * 100;
    var good = lowerIsBetter ? diff < 0 : diff > 0;
    var cls = Math.abs(pct) < 3 ? 'mut' : good ? 'good' : 'bad';
    var txt = unit === 'pt' ? (diff >= 0 ? '+' : '') + fmt(diff, 1) + ' pt' : (pct >= 0 ? '+' : '') + fmt(pct, d || 0) + ' %';
    return '<span class="d ' + cls + '">' + txt + ' vs. the period before</span>';
  }

  // ---- bridge ----
  function request(view, params) {
    return new Promise(function (resolve, reject) {
      if (window.parent === window) { reject(new Error('Agent observability needs the desktop app and the shared database.')); return; }
      var id = 'r' + Math.random().toString(36).slice(2, 10);
      pending[id] = { resolve: resolve, reject: reject };
      window.parent.postMessage({ type: 'ob:get-request', requestId: id, view: view, params: params || {} }, '*');
      setTimeout(function () { if (pending[id]) { delete pending[id]; reject(new Error('No answer from the app.')); } }, 20000);
    });
  }
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return;
    var m = e.data;
    if (!m || typeof m.requestId !== 'string' || !pending[m.requestId]) return;
    var p = pending[m.requestId]; delete pending[m.requestId];
    if (m.type === 'ob:data') p.resolve(m.data); else p.reject(new Error(m.message || 'Request failed.'));
  });

  // ---- small drawing helpers ----
  function spark(values, color, w, h) {
    w = w || 84; h = h || 22;
    if (!values || !values.length) return '';
    var max = Math.max.apply(null, values.concat([1])), step = values.length > 1 ? w / (values.length - 1) : w;
    var pts = values.map(function (v, i) { return (i * step).toFixed(1) + ',' + (h - 2 - (v / max) * (h - 4)).toFixed(1); }).join(' ');
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><polyline fill="none" stroke="' + (color || 'var(--purple)') + '" stroke-width="1.6" stroke-linejoin="round" points="' + pts + '"/></svg>';
  }
  function stacked(daily) {
    var max = Math.max.apply(null, daily.map(function (d) { return d.runs; }).concat([1]));
    var html = '<div class="bars" role="img" aria-label="Runs per day by result">';
    daily.forEach(function (d) {
      var other = Math.max(0, d.runs - d.ok - d.error - d.blocked - d.escalated);
      var parts = [['ok', 'var(--green)'], ['escalated', 'var(--blue)'], ['blocked', 'var(--amber)'], ['error', 'var(--red)']];
      var inner = parts.map(function (p) { var v = d[p[0]]; return v ? '<div style="height:' + (v / max * 100).toFixed(2) + '%;background:' + p[1] + '"></div>' : ''; }).join('');
      html += '<div class="b" title="' + esc(day(d.d) + ': ' + d.runs + ' runs, ' + d.ok + ' ok, ' + d.error + ' errors, ' + d.blocked + ' blocked, ' + d.escalated + ' escalated') + '" style="height:100%">' + inner + (other ? '' : '') + '</div>';
    });
    return html + '</div><div class="legend"><span><i style="background:var(--green)"></i>ok</span><span><i style="background:var(--blue)"></i>escalated</span><span><i style="background:var(--amber)"></i>blocked</span><span><i style="background:var(--red)"></i>error</span></div>';
  }
  function simpleBars(rows, valKey, label, color, mark) {
    var max = Math.max.apply(null, rows.map(function (r) { return r[valKey]; }).concat([0.0001]));
    var html = '<div class="bars" role="img" aria-label="' + esc(label) + '">';
    rows.forEach(function (r) {
      var hot = mark && mark(r);
      html += '<div class="b" title="' + esc(day(r.d) + ': ' + (valKey === 'cost' ? eur(r[valKey], 2) : fmt(r[valKey]))) + '" style="height:100%"><div style="height:' + (r[valKey] / max * 100).toFixed(2) + '%;background:' + (hot ? 'var(--red)' : color) + '"></div></div>';
    });
    return html + '</div>';
  }
  function heat(cells) {
    var grid = {}, max = 1;
    cells.forEach(function (c) { grid[c.dow + ':' + c.hour] = c.runs; if (c.runs > max) max = c.runs; });
    var names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    var html = '<div class="heat" role="img" aria-label="Runs by weekday and hour"><span></span>';
    for (var h = 0; h < 24; h++) html += '<span class="h">' + (h % 3 === 0 ? h : '') + '</span>';
    for (var d = 1; d <= 7; d++) {
      html += '<span>' + names[d - 1] + '</span>';
      for (h = 0; h < 24; h++) {
        var v = grid[d + ':' + h] || 0;
        html += '<span class="c" title="' + names[d - 1] + ' ' + h + ':00, ' + v + ' runs" style="background:' + (v ? 'color-mix(in srgb,var(--purple) ' + Math.round(12 + v / max * 88) + '%,var(--surface))' : '') + '"></span>';
      }
    }
    return html + '</div>';
  }
  function pair(name, value, pct, color, text) {
    return '<div class="pair"><span title="' + esc(name) + '" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(name) + '</span><span class="t"><span class="f" style="width:' + Math.max(1, Math.min(100, pct)).toFixed(1) + '%;background:' + color + '"></span></span><span style="text-align:right">' + esc(text) + '</span></div>';
  }
  function modeTag(m) {
    var cls = m === 'autonomous' ? 'red' : m === 'act-after-approval' ? 'amber' : m === 'draft' ? 'blue' : 'green';
    return '<span class="tag ' + cls + '">' + esc(m) + '</span>';
  }

  // ---- views ----
  function fleetView(d) {
    var k = d.kpis, a = d.agents.filter(function (x) { return !state.agentFilter || x.department === state.agentFilter; });
    var depts = d.departments.map(function (x) { return x.department; });
    var html = '<div class="grid kpis">'
      + kpi('Runs', fmt(k.runs), delta(k.runs, k.prevRuns, false), spark(d.daily.map(function (x) { return x.runs; })))
      + kpi('Finished green', fmt(k.okPct, 1) + ' %', delta(k.okPct, k.prevOkPct, false, 'pt'), '')
      + kpi('Outcome met', k.goalPct == null ? '–' : fmt(k.goalPct, 1) + ' %', '<span class="d mut">of ' + fmt(k.sampled) + ' sampled runs</span>', '')
      + kpi('Green but wrong', fmt(k.greenButWrong), '<span class="d ' + (k.greenButWrong > 20 ? 'bad' : 'mut') + '">of ' + fmt(k.greenSampled) + ' sampled green runs</span>', '')
      + kpi('Cost', eur(k.costEur), delta(k.costEur, k.prevCostEur, true), spark(d.daily.map(function (x) { return x.cost; }), 'var(--amber)'))
      + kpi('Speed p95', dur(k.p95ms), '<span class="d mut">median ' + dur(k.p50ms) + ' (waiting for people not counted)</span>', '')
      + kpi('Blocked by policy', fmt(k.blocked), delta(k.blocked, k.prevBlocked, true), '')
      + kpi('People reached', fmt(k.callers), '<span class="d mut">' + fmt(k.agentsActive) + ' agents active</span>', '')
      + '</div>';
    html += '<div class="grid two"><div class="card"><h2>Runs per day</h2><p class="hint" style="margin:0 0 10px">Every run of every agent, workflow and skill. Colour is the status the run ended with.</p>' + stacked(d.daily) + '</div>'
      + '<div class="card"><h2>When the work happens</h2><p class="hint" style="margin:0 0 10px">Runs by weekday and hour (Berlin time).</p>' + heat(d.heat) + '</div></div>';
    html += '<div class="card" style="margin-top:16px;overflow-x:auto"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div><h2>Every agent</h2><p class="hint" style="margin:0">Click a row to see its runs. Rights come from the registered policy: what the agent is allowed to do.</p></div>'
      + '<select class="sel" id="dept" aria-label="Department"><option value="">All departments</option>' + depts.map(function (x) { return '<option' + (x === state.agentFilter ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select></div>'
      + '<table><thead><tr><th>Agent</th><th>Rights</th><th class="n">Runs</th><th>14 days</th><th class="n">Green</th><th class="n">Outcome</th><th class="n">Escalated</th><th class="n">p95</th><th class="n">Cost</th><th class="n">Blocked</th><th>Version</th></tr></thead><tbody>';
    a.forEach(function (x) {
      var okd = x.okPct != null && x.prevOkPct != null ? x.okPct - x.prevOkPct : null;
      var gap = x.goalPct != null && x.okPct != null ? x.okPct - x.goalPct : null;
      html += '<tr class="click" tabindex="0" data-agent="' + esc(x.id) + '"><td><b>' + esc(x.name) + '</b>' + (x.retired ? ' <span class="tag">retired</span>' : '') + '<div class="hint">' + esc(x.kind + ' · ' + x.department + ' · ' + x.model) + '</div></td>'
        + '<td>' + modeTag(x.mode) + (x.unattended ? ' <span class="tag red">unattended</span>' : '') + '</td>'
        + '<td class="n">' + fmt(x.runs) + '</td><td>' + spark(x.spark, x.runs ? 'var(--purple)' : 'var(--faint)') + '</td>'
        + '<td class="n">' + (x.okPct == null ? '–' : fmt(x.okPct, 1) + ' %') + (okd != null && Math.abs(okd) >= 3 ? ' <span class="' + (okd < 0 ? 'bad' : 'good') + '">' + (okd > 0 ? '▲' : '▼') + '</span>' : '') + '</td>'
        + '<td class="n">' + (x.goalPct == null ? '–' : fmt(x.goalPct, 0) + ' %') + (gap != null && gap > 12 ? ' <span class="tag red" title="Green runs whose outcome check failed">gap ' + fmt(gap, 0) + '</span>' : '') + '</td>'
        + '<td class="n">' + (x.escalatedPct == null ? '–' : fmt(x.escalatedPct, 1) + ' %') + '</td><td class="n">' + dur(x.p95ms) + '</td><td class="n">' + eur(x.costEur) + '</td>'
        + '<td class="n">' + (x.blocked ? '<span class="tag amber">' + x.blocked + '</span>' : '0') + '</td><td>' + esc(x.version) + '</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="grid two" style="margin-top:16px"><div class="card"><h2>Slowest and most failing tools</h2><p class="hint" style="margin:0 0 8px">Tools called at least 30 times in the window, worst error rate first.</p><table><thead><tr><th>Tool</th><th>System</th><th class="n">Calls</th><th class="n">Errors</th><th class="n">p95</th></tr></thead><tbody>'
      + d.tools.map(function (t) { return '<tr><td>' + esc(t.tool) + '</td><td>' + esc(t.system) + '</td><td class="n">' + fmt(t.calls) + '</td><td class="n ' + (t.errPct > 5 ? 'bad' : '') + '">' + fmt(t.errPct, 1) + ' %</td><td class="n">' + dur(t.p95ms) + '</td></tr>'; }).join('')
      + '</tbody></table></div><div class="card"><h2>By model</h2><p class="hint" style="margin:0 0 8px">Cost and volume per model in the window.</p>'
      + d.models.map(function (m) { var mx = d.models[0].costEur || 1; return pair(m.model, m.costEur, m.costEur / mx * 100, 'var(--purple)', eur(m.costEur)); }).join('')
      + '<h2 style="margin-top:18px">By department</h2>'
      + d.departments.map(function (m) { var mx = d.departments[0].costEur || 1; return pair(m.department, m.costEur, m.costEur / mx * 100, 'var(--blue)', eur(m.costEur)); }).join('')
      + '</div></div>';
    return html;
  }
  function kpi(label, value, deltaHtml, sparkHtml) {
    return '<div class="card kpi"><div class="l">' + esc(label) + '</div><div class="v">' + value + '</div><div class="row" style="justify-content:space-between;flex-wrap:nowrap">' + deltaHtml + sparkHtml + '</div></div>';
  }

  function runsView(d, agents) {
    var f = state.runs;
    var html = '<div class="note">A run is one pass of an agent, workflow or skill. Open one to see its steps as a tree: the agent call, the guardrail, every model call, tool call and the wait for approval. The text of prompts and answers is not stored.</div>'
      + '<div class="row" style="margin-bottom:12px"><select class="sel" id="fa" aria-label="Agent"><option value="">All agents</option>' + agents.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === f.agent ? ' selected' : '') + '>' + esc(a.name) + '</option>'; }).join('') + '</select>'
      + '<select class="sel" id="fs" aria-label="Status"><option value="">Any status</option>' + ['ok', 'error', 'blocked', 'escalated'].map(function (s) { return '<option' + (s === f.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>'
      + '<select class="sel" id="fc" aria-label="Cost"><option value="0">Any cost</option><option value="0.5"' + (f.minCost === 0.5 ? ' selected' : '') + '>Above €0.50</option><option value="2"' + (f.minCost === 2 ? ' selected' : '') + '>Above €2</option></select>'
      + '<span class="hint">' + fmt(d.total) + ' runs match, newest first</span></div>';
    html += '<div class="card" style="overflow-x:auto"><table><thead><tr><th>Run</th><th>Agent</th><th>When</th><th>Status</th><th class="n">Steps</th><th class="n">Time</th><th class="n">Tokens</th><th class="n">Cost</th><th>Check</th></tr></thead><tbody>';
    d.runs.forEach(function (r) {
      html += '<tr class="click" tabindex="0" data-run="' + r.id + '"><td>#' + r.id + '</td><td><b>' + esc(r.name) + '</b> <span class="hint">' + esc(r.version) + '</span></td><td>' + esc(when(r.at)) + '</td>'
        + '<td><span class="dot ' + esc(r.status) + '"></span>' + esc(r.status) + (r.error ? ' <span class="hint">' + esc(r.error) + '</span>' : '') + '</td>'
        + '<td class="n">' + fmt(r.steps) + '</td><td class="n">' + dur(r.ms) + (r.waitMs ? ' <span class="hint">+' + dur(r.waitMs) + ' wait</span>' : '') + '</td><td class="n">' + fmt(r.tokens) + '</td><td class="n">' + eur(r.costEur, 3) + '</td>'
        + '<td>' + (r.goalMet == null ? '<span class="hint">not sampled</span>' : r.goalMet ? '<span class="tag green">outcome met</span>' : '<span class="tag red">outcome missed</span>') + '</td></tr>';
    });
    if (!d.runs.length) html += '<tr><td colspan="9" class="empty">No runs match.</td></tr>';
    return html + '</tbody></table></div>';
  }
  function traceView(t) {
    var r = t.run, total = r.ms + (r.waitMs || 0) || 1;
    var depth = {};
    t.spans.forEach(function (s) { depth[s.ord] = s.parent == null ? 0 : (depth[s.parent] || 0) + 1; });
    var html = '<button class="btn" id="back">← All runs</button>'
      + '<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><div><h2>' + esc(r.name) + ' <span class="hint">run #' + r.id + ' · version ' + esc(r.version) + '</span></h2><p class="hint" style="margin:0">' + esc(when(r.at)) + ' · ' + esc(r.trigger) + (r.caller !== 'system' ? ' by ' + esc(r.caller) : '') + ' · ' + esc(r.model) + ' · ' + modeTag(r.mode) + '</p></div>'
      + '<div class="row"><span class="tag"><span class="dot ' + esc(r.status) + '"></span>' + esc(r.status) + '</span>' + (r.goalMet == null ? '' : r.goalMet ? '<span class="tag green">outcome met</span>' : '<span class="tag red">outcome missed</span>') + (r.quality != null ? '<span class="tag">judge ' + fmt(r.quality, 2) + '</span>' : '') + '</div></div>'
      + '<div class="grid kpis" style="margin:14px 0 6px"><div><div class="hint">Working time</div><b>' + dur(r.ms) + '</b></div><div><div class="hint">Waiting for a person</div><b>' + dur(r.waitMs || 0) + '</b></div><div><div class="hint">Tokens in / out</div><b>' + fmt(r.inTokens) + ' / ' + fmt(r.outTokens) + '</b></div><div><div class="hint">Cost</div><b>' + eur(r.costEur, 3) + '</b></div><div><div class="hint">Steps</div><b>' + fmt(r.steps) + '</b></div></div>';
    if (t.review) html += '<p class="hint">Human review: ' + esc(t.review.status) + (t.review.verdict ? ', judged ' + esc(t.review.verdict) : '') + '</p>';
    html += '<div class="wf" role="list">';
    t.spans.forEach(function (s) {
      var left = s.offset / total * 100, width = Math.max(0.4, s.ms / total * 100);
      var cls = s.kind + (s.status === 'error' ? ' s-error' : s.status === 'blocked' ? ' s-blocked' : '');
      html += '<div class="line" role="listitem"><div class="nm" style="padding-left:' + (depth[s.ord] * 16) + 'px" title="' + esc(s.name) + '"><span class="dot ' + esc(s.status) + '"></span>' + esc(s.name) + '<span class="k">' + esc(s.kind) + (s.system ? ' · ' + esc(s.system) : '') + '</span></div>'
        + '<div class="track"><div class="span ' + cls + '" style="left:' + left.toFixed(2) + '%;width:' + Math.min(100 - left, width).toFixed(2) + '%"></div></div><div class="tm">' + dur(s.ms) + (s.costEur ? ' · ' + eur(s.costEur, 4) : '') + '</div>'
        + (s.note ? '<div class="why" style="' + (s.status === 'ok' ? 'color:var(--muted)' : '') + '">' + esc(s.note) + '</div>' : '') + '</div>';
    });
    html += '</div><div class="legend"><span><i style="background:var(--purple)"></i>model call</span><span><i style="background:var(--blue)"></i>tool call</span><span><i style="background:var(--teal)"></i>retrieval</span><span><i style="background:var(--amber)"></i>approval wait</span><span><i style="background:var(--faint)"></i>guardrail</span><span><i style="background:var(--red)"></i>error</span></div>'
      + '<p class="hint" style="margin-top:12px">Steps follow the OpenTelemetry GenAI naming (invoke_agent, chat, execute_tool). A long trace is cut to the first eight working steps; the run totals include all of them.</p></div>';
    return html;
  }

  function qualityView(q) {
    var latest = q.trend.length ? q.trend[q.trend.length - 1] : null, first = q.trend.length ? q.trend[0] : null;
    var html = '<div class="note"><b>A green run is not a right answer.</b> Status only says the run did not crash. Quality is measured next to it: the outcome check compares the state after a run with the goal; every night a fixed set of cases runs three times, and a case only counts when it passed all three (pass^3).</div>'
      + '<div class="grid kpis">'
      + kpi('Cases passing (single try)', latest ? fmt(latest.passRate, 1) + ' %' : '–', first && latest ? '<span class="d mut">' + fmt(first.passRate, 1) + ' % a month ago</span>' : '', spark(q.trend.map(function (x) { return x.passRate; }), 'var(--green)'))
      + kpi('Cases passing all 3 tries', latest ? fmt(latest.passK, 1) + ' %' : '–', '<span class="d mut">pass^3, reliability</span>', spark(q.trend.map(function (x) { return x.passK; }), 'var(--purple)'))
      + kpi('Failing now', fmt(q.failing.length), '<span class="d mut">cases in the latest batch</span>', '')
      + kpi('Waiting for human review', fmt(q.review.pending), '<span class="d mut">humans agree with the check in ' + (q.review.agreePct == null ? '–' : fmt(q.review.agreePct, 0) + ' %') + '</span>', '')
      + '</div>';
    html += '<div class="grid two"><div class="card"><h2>Looks fine, was wrong</h2><p class="hint" style="margin:0 0 10px">Share of runs that finished green against share whose outcome check passed (last 30 days, agents with at least 10 sampled runs).</p>';
    q.gap.slice(0, 6).forEach(function (g) {
      html += '<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><b>' + esc(g.name) + '</b><span class="' + (g.gap > 12 ? 'bad' : 'mut') + '">gap ' + fmt(g.gap, 1) + ' pt · ' + g.greenButWrong + ' green but wrong</span></div>'
        + pair('finished green', g.okPct, g.okPct, 'var(--green)', fmt(g.okPct, 0) + ' %') + pair('outcome met', g.goalPct, g.goalPct || 0, g.gap > 12 ? 'var(--red)' : 'var(--purple)', g.goalPct == null ? '–' : fmt(g.goalPct, 0) + ' %') + '</div>';
    });
    html += '</div><div class="card"><h2>Human review queue</h2><p class="hint" style="margin:0 0 10px">Green runs whose outcome check failed, waiting for a person to look.</p>';
    q.queue.slice(0, 8).forEach(function (r) { html += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-2)"><span><a href="#" data-run="' + r.id + '" style="color:var(--purple-mid)">#' + r.id + '</a> ' + esc(r.agent) + '</span><span class="hint">' + esc(when(r.at)) + '</span></div>'; });
    if (!q.queue.length) html += '<div class="empty">Nothing waiting.</div>';
    html += '</div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2>Nightly cases per version</h2><p class="hint" style="margin:0 0 10px">A new version that is worse than the one before shows up here, even when its runs look green.</p><table><thead><tr><th>Agent</th><th>Version</th><th class="n">Nights</th><th class="n">Single try</th><th class="n">All 3 tries</th></tr></thead><tbody>';
    var byAgent = {};
    q.versions.forEach(function (v) { (byAgent[v.agent] = byAgent[v.agent] || []).push(v); });
    q.versions.filter(function (v) { return byAgent[v.agent].length > 1; }).forEach(function (v) {
      html += '<tr><td>' + esc(v.name) + '</td><td>' + esc(v.version) + '</td><td class="n">' + v.batches + '</td><td class="n">' + fmt(v.passRate, 1) + ' %</td><td class="n ' + (v.passK < 80 ? 'bad' : '') + '">' + fmt(v.passK, 1) + ' %</td></tr>';
    });
    html += '</tbody></table><p class="hint" style="margin-top:8px">Only agents that changed version in the last 30 days are listed.</p></div><div class="card"><h2>Failing in the latest batch</h2><p class="hint" style="margin:0 0 10px">' + esc(q.latestBatch || '') + '</p>';
    q.failing.forEach(function (f) { html += '<div class="row" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line-2)"><span><b>' + esc(f.name) + '</b><div class="hint">' + esc(f.case) + '</div></span><span class="tag ' + (f.kind === 'safety' ? 'red' : 'amber') + '">' + f.passed + '/' + f.attempts + ' · ' + esc(f.kind) + '</span></div>'; });
    if (!q.failing.length) html += '<div class="empty">All cases passed.</div>';
    return html + '</div></div>';
  }

  function costView(c) {
    var html = '<div class="grid kpis">'
      + kpi('Cost, last ' + c.days + ' days', eur(c.daily.reduce(function (a, x) { return a + x.cost; }, 0)), '<span class="d mut">median day ' + eur(c.medianDay, 2) + '</span>', spark(c.daily.map(function (x) { return x.cost; }), 'var(--amber)'))
      + kpi('Month to date', eur(c.monthToDate), '<span class="d mut">' + c.daysLeft + ' days left</span>', '')
      + kpi('Estimate for the month end', eur(c.estimateMonthEnd), '<span class="d mut">this month plus the last 7 days as a daily rate (rule of thumb, not a model)</span>', '')
      + kpi('Days that stand out', fmt(c.spikes.length), c.spikes.length ? '<span class="d bad">' + c.spikes.map(function (s) { return day(s.d) + ' ' + fmt(s.times, 0) + '×'; }).join(', ') + ' the median day</span>' : '<span class="d mut">more than twice the median day</span>', '')
      + '</div>';
    var spikeDays = {}; c.spikes.forEach(function (s) { spikeDays[s.d] = true; });
    html += '<div class="card"><h2>Cost per day</h2><p class="hint" style="margin:0 0 10px">Days above twice the median are red. Hover a bar for the day.</p>' + simpleBars(c.daily, 'cost', 'Cost per day', 'var(--amber)', function (r) { return spikeDays[r.d]; }) + '</div>';
    html += '<div class="grid two" style="margin-top:16px"><div class="card" style="overflow-x:auto"><h2>Per agent</h2><p class="hint" style="margin:0 0 8px">Cost per successful run counts what failed runs burned as well. Waste is the cost of runs that ended in an error.</p><table><thead><tr><th>Agent</th><th>Department</th><th class="n">Runs</th><th class="n">Cost</th><th class="n">Per run</th><th class="n">Per green run</th><th class="n">Waste</th></tr></thead><tbody>';
    c.agents.forEach(function (a) { html += '<tr><td><b>' + esc(a.name) + '</b><div class="hint">' + esc(a.model) + '</div></td><td>' + esc(a.department) + '</td><td class="n">' + fmt(a.runs) + '</td><td class="n">' + eur(a.costEur) + '</td><td class="n">' + eur(a.perRun, 3) + '</td><td class="n">' + eur(a.perOkRun, 3) + '</td><td class="n ' + (a.wasteEur > 20 ? 'bad' : '') + '">' + eur(a.wasteEur) + '</td></tr>'; });
    html += '</tbody></table></div><div class="card"><h2>Most expensive runs</h2><p class="hint" style="margin:0 0 8px">Open one to see where it went.</p>';
    c.topRuns.forEach(function (r) { html += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-2)"><span><a href="#" data-run="' + r.id + '" style="color:var(--purple-mid)">#' + r.id + '</a> ' + esc(r.agent) + '<div class="hint">' + esc(when(r.at)) + ' · ' + fmt(r.steps) + ' steps' + (r.error ? ' · ' + esc(r.error) : '') + '</div></span><b>' + eur(r.costEur, 2) + '</b></div>'; });
    return html + '</div></div>';
  }

  function safetyView(s) {
    var html = '<div class="note">Every agent has a declared policy. This view shows where reality touched its edge: actions that were stopped, agents that may act on their own, and how long people take to approve.</div>'
      + '<div class="grid kpis">'
      + kpi('Blocked actions', fmt(s.blocked.length), '<span class="d mut">in ' + s.days + ' days, stopped before they happened</span>', spark(s.blockedDaily.map(function (x) { return x.blocked; }), 'var(--amber)'))
      + kpi('Approvals', fmt(s.approvals.approvals), '<span class="d mut">' + fmt(s.approvals.waiting) + ' waiting now</span>', '')
      + kpi('Average wait for a person', dur((s.approvals.waitingMin || 0) * 60000), '<span class="d mut">p95 ' + dur((s.approvals.p95Min || 0) * 60000) + '</span>', '')
      + kpi('May act without a person', fmt(s.autonomy.filter(function (a) { return a.mode === 'autonomous'; }).length), '<span class="d bad">agents in autonomous mode</span>', '')
      + '</div>';
    html += '<div class="grid two"><div class="card" style="overflow-x:auto"><h2>Agents that can change things</h2><p class="hint" style="margin:0 0 8px">Agents that write, run unattended or act after approval.</p><table><thead><tr><th>Agent</th><th>Mode</th><th>Criticality</th><th class="n">Runs</th><th class="n">Blocked</th><th class="n">Escalated</th></tr></thead><tbody>';
    s.autonomy.forEach(function (a) { html += '<tr><td><b>' + esc(a.name) + '</b>' + (a.unattended ? ' <span class="tag red">unattended</span>' : '') + '</td><td>' + modeTag(a.mode) + '</td><td>' + esc(a.criticality) + '</td><td class="n">' + fmt(a.runs) + '</td><td class="n">' + (a.blocked ? '<span class="tag amber">' + a.blocked + '</span>' : '0') + '</td><td class="n">' + fmt(a.escalated) + '</td></tr>'; });
    html += '</tbody></table></div><div class="card"><h2>Guardrail hits</h2><p class="hint" style="margin:0 0 8px">What the input check noticed.</p>';
    s.guardrails.forEach(function (g) { html += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-2)"><span>' + esc(g.agent) + '<div class="hint">' + esc(g.note) + '</div></span><b>' + fmt(g.hits) + '</b></div>'; });
    if (!s.guardrails.length) html += '<div class="empty">No hits.</div>';
    html += '</div></div><div class="card" style="margin-top:16px;overflow-x:auto"><h2>Blocked actions</h2><p class="hint" style="margin:0 0 8px">Newest first.</p><table><thead><tr><th>When</th><th>Agent</th><th>Tool</th><th>Why</th><th>Run</th></tr></thead><tbody>';
    s.blocked.slice(0, 40).forEach(function (b) { html += '<tr class="click" tabindex="0" data-run="' + b.run + '"><td>' + esc(when(b.at)) + '</td><td><b>' + esc(b.agent) + '</b> ' + modeTag(b.mode) + '</td><td>' + esc(b.system) + ' · ' + esc(b.tool) + '</td><td>' + esc(b.note) + '</td><td>#' + b.run + '</td></tr>'; });
    if (!s.blocked.length) html += '<tr><td colspan="5" class="empty">Nothing was blocked.</td></tr>';
    return html + '</tbody></table></div>';
  }

  function alertsView(a) {
    var c = a.counts;
    var html = '<div class="note">Three tiers: <b>page</b> means somebody looks now, <b>ticket</b> means it goes into the queue, <b>info</b> only shows here. Rules look at the run history; an alert never changes an agent.</div>'
      + '<div class="grid kpis">' + kpi('Open', fmt(c.open), '<span class="d mut">' + fmt(c.acknowledged) + ' acknowledged</span>', '') + kpi('Pages', fmt(c.page), '<span class="d mut">not resolved</span>', '') + kpi('Tickets', fmt(c.ticket), '<span class="d mut">not resolved</span>', '') + kpi('Resolved', fmt(c.resolved), '', '') + '</div>'
      + '<div class="card">';
    a.alerts.forEach(function (x) {
      html += '<div class="al"><span class="sev ' + esc(x.severity) + '">' + esc(x.severity) + '</span><div><b>' + esc(x.agent || 'Several agents') + '</b> <span class="hint">· ' + esc(x.rule) + ' · ' + esc(when(x.at)) + '</span><div>' + esc(x.message) + '</div></div>'
        + '<span class="tag ' + (x.status === 'open' ? 'red' : x.status === 'acknowledged' ? 'amber' : 'green') + '">' + esc(x.status) + '</span></div>';
    });
    return html + '</div>';
  }

  // ---- loading and drawing ----
  function head() {
    var h = '<div class="top"><div><h1>Agent Observability</h1><p class="sub">What the agents, workflows and skills of the Werkbank actually did: every run as a trace, whether the outcome was right, what it cost, and where it touched the edge of its rights. Generated sample history in the shared database, no prompt or answer text.</p></div>'
      + '<div class="seg" role="group" aria-label="Time window">' + [7, 30, 90].map(function (n) { return '<button data-days="' + n + '" aria-pressed="' + (state.days === n) + '">' + n + ' days</button>'; }).join('') + '</div></div>';
    h += '<div class="tabs" role="tablist">' + TABS.map(function (t) {
      var badge = t[0] === 'alerts' && state.cache.openAlerts ? '<span class="badge">' + (state.cache.openAlerts.page + state.cache.openAlerts.ticket) + '</span>' : '';
      return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + badge + '</button>';
    }).join('') + '</div>';
    return h;
  }
  function draw(body) { app.innerHTML = head() + '<div id="body">' + body + '</div>'; bind(); }
  function fail(e) { draw('<div class="err"><b>Nothing to show.</b><div>' + esc(e && e.message ? e.message : e) + '</div><p class="hint">This Space reads the shared database through the desktop app. Apply migrations 036 and 037 in the Supabase SQL editor first.</p></div>'); }

  function show() {
    draw('<div class="load">Reading the run history…</div>');
    var tab = state.tab;
    if (tab === 'fleet') request('fleet', { days: state.days }).then(function (d) { state.cache.openAlerts = d.openAlerts; if (state.tab === tab) draw(fleetView(d)); }).catch(fail);
    else if (tab === 'runs') {
      if (state.trace) { request('trace', { runId: state.trace }).then(function (t) { draw(traceView(t)); }).catch(fail); return; }
      var p = { days: state.days, limit: 60 };
      if (state.runs.agent) p.agent = state.runs.agent; if (state.runs.status) p.status = state.runs.status; if (state.runs.minCost) p.minCost = state.runs.minCost;
      var agents = state.cache.agents ? Promise.resolve(state.cache.agents) : request('fleet', { days: 30 }).then(function (d) { state.cache.agents = d.agents.map(function (a) { return { id: a.id, name: a.name }; }).sort(function (a, b) { return a.name < b.name ? -1 : 1; }); return state.cache.agents; });
      Promise.all([request('runs', p), agents]).then(function (r) { draw(runsView(r[0], r[1])); }).catch(fail);
    }
    else if (tab === 'quality') request('quality', {}).then(function (d) { draw(qualityView(d)); }).catch(fail);
    else if (tab === 'cost') request('cost', { days: state.days }).then(function (d) { draw(costView(d)); }).catch(fail);
    else if (tab === 'safety') request('safety', { days: state.days }).then(function (d) { draw(safetyView(d)); }).catch(fail);
    else request('alerts', {}).then(function (d) { draw(alertsView(d)); }).catch(fail);
  }
  function openRun(id) { state.tab = 'runs'; state.trace = id; show(); }
  function bind() {
    Array.prototype.forEach.call(app.querySelectorAll('[data-tab]'), function (b) { b.addEventListener('click', function () { state.tab = b.getAttribute('data-tab'); state.trace = null; show(); }); });
    Array.prototype.forEach.call(app.querySelectorAll('[data-days]'), function (b) { b.addEventListener('click', function () { state.days = Number(b.getAttribute('data-days')); show(); }); });
    Array.prototype.forEach.call(app.querySelectorAll('[data-run]'), function (r) {
      var go = function (e) { e.preventDefault(); openRun(Number(r.getAttribute('data-run'))); };
      r.addEventListener('click', go);
      r.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') go(e); });
    });
    Array.prototype.forEach.call(app.querySelectorAll('tr[data-agent]'), function (r) {
      var go = function () { state.runs = { agent: r.getAttribute('data-agent'), status: '', minCost: 0 }; state.tab = 'runs'; state.trace = null; show(); };
      r.addEventListener('click', go);
      r.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    var b = document.getElementById('back'); if (b) b.addEventListener('click', function () { state.trace = null; show(); });
    var dept = document.getElementById('dept'); if (dept) dept.addEventListener('change', function () { state.agentFilter = dept.value; request('fleet', { days: state.days }).then(function (d) { draw(fleetView(d)); }); });
    var fa = document.getElementById('fa'), fs = document.getElementById('fs'), fc = document.getElementById('fc');
    function apply() { state.runs = { agent: fa.value, status: fs.value, minCost: Number(fc.value) }; show(); }
    if (fa) { fa.addEventListener('change', apply); fs.addEventListener('change', apply); fc.addEventListener('change', apply); }
  }
  show();
})();
</script>
</body>
</html>
