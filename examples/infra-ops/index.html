<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infrastructure Operations</title>
<style id="design-system">
/* Shared design system for the example Spaces (AI Control Tower, Sub4Me).
   Source of truth: examples/shared/design-system.css. Embedded into each Space by
   `npm run sync:design` (Spaces are single-file pages: no network, no external CSS).
   Light and dark follow prefers-color-scheme (or data-theme on <html>); colours only exist as tokens. */
:root{
  color-scheme:light dark;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:var(--font); /* one typeface everywhere; numbers use tabular figures */
  --canvas:#f6f1fc;--surface:#ffffff;--ink:#22093a;--ink-2:#4b3a66;--muted:#6f6388;--faint:#bcb0d2;--line:#e8def6;--line-2:#f2ebfa;--wash:#faf6ff;
  --purple:#A100FF;--purple-mid:#7500C0;--purple-deep:#460073;--purple-dim:rgba(161,0,255,.07);--purple-border:rgba(161,0,255,.22);--purple-light:#E6DCFF;
  --green:#00875A;--green-dim:rgba(0,135,90,.09);--green-border:rgba(0,135,90,.22);
  --amber:#a85c00;--amber-dim:rgba(176,94,0,.09);--amber-border:rgba(176,94,0,.24);
  --red:#c9190b;--red-dim:rgba(201,25,11,.08);--red-border:rgba(201,25,11,.22);
  --blue:#0041F0;--blue-dim:rgba(0,65,240,.08);--blue-border:rgba(0,65,240,.22);
  --teal:#006b75;--teal-dim:rgba(0,107,117,.09);
  --radius:20px;--radius-s:12px;--shadow:0 1px 2px rgba(70,0,115,.05),0 8px 24px rgba(70,0,115,.06);--shadow-lg:0 24px 60px rgba(70,0,115,.25);
  --space:8px;
  /* Control Tower token names */
  --black:var(--surface);--white:var(--surface);
  --g900:var(--ink);--g700:var(--ink-2);--g500:var(--muted);--g300:var(--faint);--g200:var(--line);--g100:var(--line-2);--g50:var(--wash);
  --sh:var(--shadow);--p-dim:var(--purple-dim);--r-dim:var(--red-dim);--r-bd:var(--red-border);--a-bd:var(--amber-border);--g-bd:var(--green-border);
  /* Sub4Me token names */
  --bg:var(--canvas);--panel:var(--surface);--mut:var(--muted);--brand:var(--purple);--brand-dim:var(--purple-dim);
  --ok:var(--green);--ok-dim:var(--green-dim);--warn:var(--amber);--warn-dim:var(--amber-dim);--bad:var(--red);--bad-dim:var(--red-dim);
}
/* Dark follows the system unless the host pins a theme with data-theme on <html> (the app does, so Spaces follow its Appearance setting). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#120820;--surface:#1c1030;--ink:#f5efff;--ink-2:#d6c9ec;--muted:#a597c2;--faint:#62517f;--line:#312247;--line-2:#25193a;--wash:#201437;
  --purple:#BE82FF;--purple-mid:#DCAFFF;--purple-deep:#E6DCFF;--purple-dim:rgba(190,130,255,.14);--purple-border:rgba(190,130,255,.34);--purple-light:#2e1650;
  --green:#3ddc97;--green-dim:rgba(61,220,151,.13);--green-border:rgba(61,220,151,.3);
  --amber:#ffb454;--amber-dim:rgba(255,180,84,.13);--amber-border:rgba(255,180,84,.3);
  --red:#ff7a70;--red-dim:rgba(255,122,112,.13);--red-border:rgba(255,122,112,.3);
  --blue:#7fa2ff;--blue-dim:rgba(127,162,255,.14);--blue-border:rgba(127,162,255,.32);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#120820;--surface:#1c1030;--ink:#f5efff;--ink-2:#d6c9ec;--muted:#a597c2;--faint:#62517f;--line:#312247;--line-2:#25193a;--wash:#201437;
  --purple:#BE82FF;--purple-mid:#DCAFFF;--purple-deep:#E6DCFF;--purple-dim:rgba(190,130,255,.14);--purple-border:rgba(190,130,255,.34);--purple-light:#2e1650;
  --green:#3ddc97;--green-dim:rgba(61,220,151,.13);--green-border:rgba(61,220,151,.3);
  --amber:#ffb454;--amber-dim:rgba(255,180,84,.13);--amber-border:rgba(255,180,84,.3);
  --red:#ff7a70;--red-dim:rgba(255,122,112,.13);--red-border:rgba(255,122,112,.3);
  --blue:#7fa2ff;--blue-dim:rgba(127,162,255,.14);--blue-border:rgba(127,162,255,.32);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}
:root[data-theme="light"]{color-scheme:light}

/* ---- Base ---- */
body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* Calmer labels: no all-caps micro headings, also where pages style them inline. */
[style*="text-transform:uppercase"]{text-transform:none!important;letter-spacing:0!important}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}
.tag,.mv,.bv,.kval,.dv,.tbl td,.num,.hdr-stat-val{font-variant-numeric:tabular-nums}

/* ---- Cards and tiles (both Spaces) ---- */
.mc,.card,.ns,.dtier,.pc,.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mc{padding:20px 22px}
.card,.ns{padding:24px;margin-bottom:16px}
.dtier,.pc,.cc{padding:18px}
.ns{border-top:1px solid var(--line)}
.ml,.k{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.mv,.v{font-family:var(--font);font-size:30px;font-weight:650;letter-spacing:-.025em;color:var(--ink);line-height:1.15}
.md,.s{font-size:12px}
.sh{font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);margin:36px 0 14px}
.chd{font-size:15px;font-weight:650;color:var(--ink)}

/* Status tags */
.tag{font-family:var(--font);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;border-width:1px}
.src{border-radius:99px;font-weight:600}

/* Tables */
.tbl th,table th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 14px}
.tbl td,table td{padding:14px;border-bottom:1px solid var(--line-2)}
.tbl{border-collapse:collapse}

/* Bars */
.bt{height:6px;border-radius:99px;background:var(--line-2)}
.bf{border-radius:99px}
.bar{background:var(--line-2)}

/* Alerts, notes and callouts */
.ab{border-radius:var(--radius);border-width:1px;border-left-width:1px;padding:18px 20px}
.ab-w{border-color:var(--amber-border)}.ab-i{border-color:var(--purple-border)}.ab-s{border-color:var(--blue-border)}.ab-ok{border-color:var(--green-border)}

/* Forms and buttons */
input,select,textarea{font-family:var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px var(--purple-dim)}
/* Calm Bento buttons: one family. Primary = Accenture purple on white text, secondary = soft tint, quiet = neutral. */
button.primary,button.ghost,button.small{font:inherit;font-size:13px;font-weight:550;line-height:1.2;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
button.primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 1px 2px rgba(70,0,115,.18)}
button.small{padding:5px 11px;font-size:12px;background:var(--purple-dim);border-color:var(--purple-border);color:var(--purple-mid)}
button.ghost:hover:not(:disabled),button.small:hover:not(:disabled){border-color:var(--purple-border);background:var(--purple-dim);color:var(--purple-mid)}
button.primary:hover:not(:disabled){background:var(--purple-mid);border-color:var(--purple-mid)}
button.primary:disabled,button.ghost:disabled,button.small:disabled{opacity:.5;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}:root:not([data-theme="light"]) button.small,:root:not([data-theme="light"]) button.ghost:hover:not(:disabled){color:var(--purple)}}
:root[data-theme="dark"] button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}
:root[data-theme="dark"] button.small,:root[data-theme="dark"] button.ghost:hover:not(:disabled){color:var(--purple)}

/* Bento: the first tile of a KPI row carries the accent wash. */
.mr>.mc:first-child,.s4m .grid>.card:first-child{background:linear-gradient(135deg,var(--purple-light),var(--surface) 78%)}

/* Overlay (agent list) */
.ag-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 30px}
.ag-ov{background:rgba(14,12,20,.55);backdrop-filter:blur(4px);z-index:200}
.ag-x,.ag-tools input,.ag-tools button{border-radius:var(--radius-s)}
.ag-x{background:var(--surface);color:var(--ink);border-color:var(--line)}
.ag-tools button{background:var(--purple-dim);color:var(--purple);border-color:var(--purple-border)}
.ag-tbl th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ag-tbl td{padding:10px 8px}

/* ---- Control Tower shell ---- */
.ct .hdr{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:60px;padding:0 32px}
.ct .hdr-title{color:var(--ink);font-size:15px;font-weight:650}
.ct .hdr-sub{font-family:var(--font);font-size:11px;letter-spacing:.01em;color:var(--muted)}
.ct .hdr-div{background:var(--line)}
.ct .acc-mark{color:var(--purple)}
.ct .hdr-stat-val{color:var(--ink);font-family:var(--font);font-weight:600}
.ct .hdr-stat-lbl{color:var(--muted);letter-spacing:.02em;text-transform:none;font-size:11px}
.ct .live{color:var(--muted);font-family:var(--font)}
.ct .tbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.ct .tb{padding:16px 14px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.ct .tb:hover:not(.on){color:var(--ink)}
.ct .tb.on{color:var(--purple);border-bottom:2px solid var(--purple);font-weight:600}
.ct .tnum{display:none}
.ct .pg{padding:40px 32px 64px;max-width:1320px;margin:0 auto}
.ct .mr{gap:16px;margin-bottom:32px}
.ct .g2,.ct .g3,.ct .g4{gap:20px}
.ct .br{margin-bottom:14px}
.ct .krow,.ct .srow,.ct .ci{padding:14px 0}
.ct .kdesc,.ct .sdesc,.ct .abod{line-height:1.65}
.ct .fn{border-radius:99px;font-family:var(--font)}
.ct .ns-fml{font-family:var(--font);border-radius:var(--radius-s)}
.ct .dm{font-family:var(--font);letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:500}

/* ---- Sub4Me shell ---- */
.s4m header{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 32px;min-height:60px;box-sizing:border-box}
.s4m .logo{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.5}
.s4m header .s{font-size:11px;letter-spacing:.01em;line-height:1.5;margin-top:1px;color:var(--muted)}
.s4m{font-size:13px}
.s4m .demo{padding:8px 32px}
.s4m nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.s4m nav button{padding:16px 14px 14px;font-size:13px;font-weight:500;line-height:normal;border-bottom:2px solid transparent}
.s4m nav button:hover:not([aria-selected=true]){color:var(--ink)}
.s4m nav button[aria-selected=true]{font-weight:600;border-bottom-color:var(--purple)}
.s4m main{padding:40px 32px 64px;max-width:1320px}
.s4m .grid{gap:16px;margin-bottom:28px}
.s4m h2{font-size:13px;font-weight:600;margin:36px 0 14px}
.s4m .row{gap:20px}
.s4m .months span{border-radius:8px 8px 0 0}
.s4m .bar{height:6px}
@media(max-width:640px){.ct .pg,.s4m main{padding:24px 16px 48px}.ct .hdr,.ct .tbar,.s4m header,.s4m nav{padding-left:16px;padding-right:16px}}
.s4m .months.stack div{cursor:default}
.s4m .months.stack .col{display:flex;flex-direction:column-reverse;width:100%;flex:1;justify-content:flex-start;gap:1px}
.s4m .months.stack .col i{display:block;width:100%;min-height:1px}
.s4m .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11px;color:var(--mut)}
.s4m .legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.s4m #products tbody tr{cursor:pointer}
.s4m #products tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #products tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m #contracts tbody tr,.s4m #offers tbody tr{cursor:pointer}
.s4m #contracts tbody tr[aria-selected="true"],.s4m #offers tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #contracts tbody tr:focus-visible,.s4m #offers tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .detail{margin-top:12px}
.s4m .detail .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
.s4m .detail .head .t{font-size:18px;font-weight:600}
.s4m .detail .hint{margin:0 0 4px}
.s4m .detail .secs{display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px}
.s4m .detail h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .detail dl{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:5px 12px;font-size:13px}
.s4m .detail dt{color:var(--muted)}
.s4m .detail dd{margin:0;overflow-wrap:anywhere}
.s4m .detail .lines{margin-top:16px;overflow-x:auto}
.s4m .detail .note{margin-top:14px;font-size:13px;color:var(--muted)}
.s4m #product-detail{margin-top:16px}
.s4m #product-detail .dgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0 18px}
.s4m #product-detail .dgrid .v{font-size:20px;font-weight:600}
.s4m #offers td:not(:nth-child(2)),.s4m #offers th,.s4m #contracts td:not(:nth-child(2)):not(:nth-child(3)){white-space:nowrap}

/* Skill Marketplace: impact, governance, gaps and the skill detail view */
.s4m .smx-kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:6px}
.s4m .smx-kpis .v{font-size:24px;font-weight:600}
.s4m tr[data-skill],.s4m article.sk[data-skill]{cursor:pointer}
.s4m tr[data-skill]:hover{background:var(--line-2)}
.s4m tr[data-skill]:focus-visible,.s4m article.sk[data-skill]:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .smx-spark{display:inline-flex;align-items:flex-end;gap:3px;height:28px;min-width:72px}
.s4m .smx-spark i{display:block;width:8px;border-radius:2px;background:var(--brand);opacity:.45}
.s4m .smx-spark i.cur{opacity:.2}
.s4m .smx-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.s4m .smx-title{font-size:20px;font-weight:600}
.s4m .smx-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.s4m .smx-grid h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .smx-dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:13px}
.s4m .smx-dl dt{color:var(--muted)}
.s4m .smx-dl dd{margin:0;overflow-wrap:anywhere}
.s4m .smx-list{margin:4px 0 0;padding-left:18px;font-size:13px}
.s4m .smx-list li{margin:3px 0}
.s4m #detail-back{margin-bottom:10px}
.s4m .smx-rate{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.s4m .smx-stars{display:inline-block;letter-spacing:1px;line-height:1;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--faint) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.s4m .smx-stars-sm{font-size:12px}
.s4m .smx-line{margin:2px 0 6px;font-size:13px}
.s4m .smx-big{font-size:32px;font-weight:600;line-height:1.1}
.s4m .smx-bars{display:grid;gap:5px;margin-top:10px;font-size:12px}
.s4m .smx-bar{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:8px;color:var(--muted)}
.s4m .smx-bar i{display:block;height:8px;border-radius:4px;background:var(--line)}
.s4m .smx-bar i b{display:block;height:100%;border-radius:4px;background:var(--amber)}
.s4m .smx-bar .num{text-align:right}
/* Collapsible "What is this page?" card (details element) */
details.intro>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
details.intro>summary::-webkit-details-marker{display:none}
details.intro>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
details.intro[open]>summary::before{transform:rotate(45deg)}
details.intro>summary h2{margin:0!important}
details.intro>summary .hint{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
details.intro>summary:focus-visible{outline:2px solid var(--purple);outline-offset:4px;border-radius:6px}
details.intro .body{margin-top:8px}
@media (prefers-reduced-motion:reduce){details.intro>summary::before{transition:none}}
</style>
<style>
*{box-sizing:border-box}
body{margin:0;font-size:13px;line-height:1.5}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em}.logo b{color:var(--purple)}
.sub{color:var(--muted);font-size:12px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.who select{padding:5px 8px;width:auto}
.demo{padding:7px 22px;background:var(--amber-dim);color:var(--amber);border-bottom:1px solid var(--line);font-size:12px}
nav{display:flex;gap:4px;padding:8px 22px 0;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--purple);border-bottom-color:var(--purple)}
main{max-width:1320px;margin:0 auto;padding:20px 22px 60px}
button.btn,.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:var(--radius-s);font:inherit;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--purple)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--purple);border-color:var(--purple);color:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}.kpi span{color:var(--muted);font-size:12px}
.kpi.red{border-color:var(--red-border)}.kpi.red b{color:var(--red)}.kpi.amber{border-color:var(--amber-border)}.kpi.amber b{color:var(--amber)}
h2{font-size:15px;margin:0 0 4px;letter-spacing:-.01em}h3{font-size:12px;margin:14px 0 6px;color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin:0 0 12px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.todo{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.todo:last-child{border-bottom:0}.todo small{display:block;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--faint)}.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}.dot.ok{background:var(--green)}
.tl{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:5px 0}
.tl .bar{height:10px;border-radius:99px;background:var(--line-2);position:relative}.tl .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--green)}
.tl .bar i.soon{background:var(--amber)}.tl .bar i.critical,.tl .bar i.expired{background:var(--red)}.tl .bar i.watch{background:var(--blue)}
.tl .d{text-align:right;font-variant-numeric:tabular-nums}.tl .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--wash);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:160px}
.col h3{margin:0 0 8px;display:flex;justify-content:space-between;color:var(--ink-2)}
.tcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer}
.tcard:hover{border-color:var(--purple)}.tcard b{display:block}.tcard small{display:block;color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--ink-2);background:var(--line-2)}
.tag.red,.tag.high,.tag.expired,.tag.fail{color:var(--red);background:var(--red-dim);border-color:var(--red-border)}
.tag.amber,.tag.medium,.tag.soon,.tag.critical,.tag.warn{color:var(--amber);background:var(--amber-dim);border-color:var(--amber-border)}
.tag.ok,.tag.low{color:var(--green);background:var(--green-dim);border-color:var(--green-border)}
.tag.watch,.tag.blue{color:var(--blue);background:var(--blue-dim);border-color:var(--blue-border)}
.tag.tool{color:var(--purple);background:var(--purple-dim);border-color:var(--purple-border)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{max-width:300px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--purple-dim);color:var(--purple)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}th{text-align:left}
.pbs{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.pblist{display:flex;flex-direction:column;gap:6px}
.pblist button{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:12px;font:inherit;cursor:pointer}
.pblist button[aria-pressed=true]{border-color:var(--purple);background:var(--purple-dim)}.pblist small{display:block;color:var(--muted)}
pre.code{background:var(--wash);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px;overflow:auto;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;margin:6px 0;color:var(--ink)}
.diff .p{color:var(--green)}.diff .m{color:var(--red)}
.flow{display:flex;gap:0;overflow-x:auto;padding:8px 0}
.node{flex:0 0 150px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;position:relative;margin-right:22px}
.node:not(:last-child)::after{content:"→";position:absolute;right:-19px;top:50%;transform:translateY(-50%);color:var(--muted)}
.node.done{border-color:var(--green-border);background:var(--green-dim)}.node.cur{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple-dim)}
.node b{display:block;font-size:12px;margin:4px 0 2px}.node small{color:var(--muted);font-size:11px;display:block}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.drawer.open{display:block}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:18px 20px 40px;box-shadow:var(--shadow-lg)}
.drawer .close{float:right}
.chk{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.chk small{grid-column:2;color:var(--muted)}
.errs{border:1px solid var(--red-border);background:var(--red-dim);border-radius:var(--radius-s);padding:8px 12px;color:var(--red);margin:8px 0}
.errs ul{margin:4px 0 0;padding-left:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:block;font-size:12px;color:var(--muted)}.form .full{grid-column:1 / 3}
.form input,.form select{width:100%;margin-top:3px}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:6px 0;align-items:start}
.step i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:block;margin-top:2px}
.step.done i{background:var(--green);border-color:var(--green)}.step.cur i{border-color:var(--purple)}
.step small{display:block;color:var(--muted)}
.steps2{margin:6px 0 0;padding-left:20px;line-height:1.6}.steps2 code,.note code{background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:0 5px;font:12px ui-monospace,Menlo,monospace}
.run{background:var(--wash);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;margin:8px 0}
.log{font-size:12px;color:var(--ink-2)}.log div{padding:3px 0;border-bottom:1px solid var(--line-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.trk{list-style:none;margin:10px 0 4px;padding:0;display:grid;gap:0}
.trk li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:7px 0;position:relative}
.trk li:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:-4px;width:2px;background:var(--line)}
.trk .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);background:var(--surface)}
.trk li.done .n{background:var(--green);border-color:var(--green);color:var(--surface)}.trk li.done::before{background:var(--green)}
.trk li.cur .n{border-color:var(--purple);color:var(--purple);box-shadow:0 0 0 3px var(--purple-dim)}
.trk li.fail .n{background:var(--red);border-color:var(--red);color:var(--surface)}
.trk li.todo{opacity:.6}.trk b{display:block;font-size:13px}.trk small{display:block;color:var(--muted);font-size:12px}
.trk .sub-steps{list-style:none;margin:6px 0 2px;padding:0;display:grid;gap:3px}.trk .sub-steps li{display:flex;gap:8px;align-items:center;padding:0;font-size:12px;color:var(--muted)}.trk .sub-steps li::before{display:none}.trk .sub-steps i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font:700 9px/1 var(--font,inherit);font-style:normal;color:var(--surface)}.trk .sub-steps li.done{color:var(--ink)}.trk .sub-steps li.done i{background:var(--green);border-color:var(--green)}.trk .sub-steps li.cur{color:var(--purple);font-weight:700}.trk .sub-steps li.cur i{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple-dim)}
.pbar{height:6px;border-radius:99px;background:var(--line-2);margin-top:5px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--purple);transition:width .35s linear}
.tq{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}.tq:last-child{border-bottom:0}.tq small{display:block;color:var(--muted)}
.speedctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.speedctl select{padding:4px 6px;width:auto}
@media (max-width:900px){.two,.pbs{grid-template-columns:1fr}.tl{grid-template-columns:110px 1fr 56px}}
</style>

<script id="io-model">
const DAY_MS = 86400000;
const PLAYBOOKS = {
  'renew-certificate': { title: 'Renew and deploy a certificate', status: 'approved', kind: 'cert', base: 1 },
  'update-dns-record': { title: 'Change a DNS record', status: 'approved', kind: 'dns', base: 1 },
  'patch-vm': { title: 'Patch and restart a VM', status: 'approved', kind: 'vm', base: 2 },
  'move-vm': { title: 'Move a VM to another region', status: 'approved', kind: 'vm', base: 3 },
  'rotate-secret': { title: 'Rotate a secret', status: 'draft', kind: 'vm', base: 2 },
};
const STATES = ['planned', 'in_review', 'approved', 'in_window', 'done'];
const ORCHESTRATION = [
  { id: 'trigger', title: 'Trigger', tool: 'n8n', detail: 'Webhook or schedule (for example: certificate expires in 30 days)' },
  { id: 'ticket', title: 'Create task and ticket', tool: 'n8n', detail: 'Change ticket in the ITSM, task in the Space' },
  { id: 'check', title: 'Pre-check in check mode', tool: 'AWX', detail: 'Playbook with --check --diff, dependencies, conflicts' },
  { id: 'approve', title: 'Approval (four eyes)', tool: 'n8n', detail: 'Request to the approvers in Teams; the answer starts the next step' },
  { id: 'window', title: 'Wait for the downtime window', tool: 'n8n', detail: 'Start only inside the approved window' },
  { id: 'run', title: 'Run the playbook', tool: 'AWX', detail: 'Job template with checked parameters, snapshot first' },
  { id: 'verify', title: 'Verification', tool: 'AWX', detail: 'Health and certificate checks, rollback on failure' },
  { id: 'evidence', title: 'Evidence and notification', tool: 'n8n', detail: 'File the log, inform customer and team' },
];
/** How many orchestration steps are done in each task state. */
const STEPS_DONE = { planned: 2, in_review: 3, approved: 5, in_window: 6, done: 8 };

const toDay = (iso) => String(iso).slice(0, 10);
const daysBetween = (a, b) => Math.round((Date.parse(toDay(b)) - Date.parse(toDay(a))) / DAY_MS);
const hoursOf = (win) => (Date.parse(win[1] + ':00Z') - Date.parse(win[0] + ':00Z')) / 3600000;
const by = (list) => new Map(list.map((x) => [x.id, x]));

function certStatus(cert, asOf) {
  const left = daysBetween(asOf, cert.notAfter);
  const status = left < 0 ? 'expired' : left <= 7 ? 'critical' : left <= 30 ? 'soon' : left <= 90 ? 'watch' : 'ok';
  return { daysLeft: left, status };
}

/** Everything that runs on top of a VM (reverse dependencies, transitive). */
function dependents(data, vmId) {
  const out = [];
  const seen = new Set([vmId]);
  const queue = [vmId];
  while (queue.length) {
    const cur = queue.shift();
    for (const v of data.vms) if (v.dependsOn === cur && !seen.has(v.id)) { seen.add(v.id); out.push(v.id); queue.push(v.id); }
  }
  return out;
}

function findings(data) {
  const out = [];
  for (const c of data.certs) {
    const s = certStatus(c, data.asOf);
    if (s.status === 'expired') out.push({ severity: 'red', kind: 'cert', target: c.id, template: 'renew-certificate', title: `${c.name} has expired`, detail: `Invalid for ${-s.daysLeft} days (${c.notAfter}).` });
    else if (s.status === 'critical' || s.status === 'soon') out.push({ severity: s.status === 'critical' ? 'red' : 'amber', kind: 'cert', target: c.id, template: 'renew-certificate', title: `${c.name} expires in ${s.daysLeft} days`, detail: `Valid until ${c.notAfter}.` });
  }
  for (const v of data.vms) {
    if (v.criticalPatches > 0) out.push({ severity: 'red', kind: 'vm', target: v.id, template: 'patch-vm', title: `${v.id}: ${v.criticalPatches} critical patches open`, detail: `${v.pendingPatches} patches in total, last patch ${v.lastPatch}.` });
    if (daysBetween(v.lastBackup, data.asOf) >= 2) out.push({ severity: 'amber', kind: 'vm', target: v.id, template: null, title: `${v.id}: backup is ${daysBetween(v.lastBackup, data.asOf)} days old`, detail: 'Make sure there is a fresh backup before any change.' });
  }
  const rank = { red: 0, amber: 1 };
  return out.sort((a, b) => rank[a.severity] - rank[b.severity]);
}

function overlaps(a, b) { return a[0] < b[1] && b[0] < a[1]; }

/** Validate a change request and plan it. Returns { ok, errors, ... }. */
function planTask(data, req) {
  const errors = [];
  const pb = PLAYBOOKS[req.template];
  if (!pb) return { ok: false, errors: ['Unknown task template.'] };
  if (pb.status !== 'approved') errors.push(`The playbook "${req.template}" is a draft and not approved for production.`);
  const inventory = { cert: data.certs, dns: data.dns, vm: data.vms }[pb.kind];
  const target = by(inventory).get(req.target);
  if (!target) return { ok: false, errors: [...errors, `Target "${req.target}" is not in the inventory (only known targets are allowed).`] };
  const vmMap = by(data.vms);
  const customer = by(data.customers).get(target.customer);
  const win = req.window;
  if (!win || !win[0] || !win[1] || win[0] >= win[1]) errors.push('The downtime window is invalid.');
  else {
    if (toDay(win[0]) <= data.asOf && !['in_window', 'done'].includes(req.state)) errors.push('The window must be in the future.');
    if (hoursOf(win) > 8) errors.push('A downtime window may last 8 hours at most.');
    for (const f of data.freezes) {
      if ((f.customer === null || f.customer === target.customer) && toDay(win[0]) <= f.to && toDay(win[1]) >= f.from) errors.push(`The window falls into a freeze: ${f.reason} (${f.from} to ${f.to}).`);
    }
  }
  const affectedVmIds = pb.kind === 'cert' ? [...target.vmIds] : pb.kind === 'dns' ? (target.vmId ? [target.vmId] : []) : [target.id];
  const primaryVm = vmMap.get(affectedVmIds[0]);
  const env = primaryVm ? primaryVm.env : 'PRD';
  const checks = [];
  const diff = [];
  const downtime = { minutes: 0, note: '' };
  const extraSteps = [];
  let risk = pb.base + (env === 'PRD' ? 1 : 0) + (primaryVm && primaryVm.role === 'HANA database' ? 1 : 0);

  if (pb.kind === 'cert') {
    const s = certStatus(target, data.asOf);
    checks.push({ label: 'Remaining validity', status: s.status === 'ok' ? 'warn' : 'ok', detail: s.daysLeft < 0 ? `Expired ${-s.daysLeft} days ago.` : `${s.daysLeft} days left, renewal ${s.status === 'ok' ? 'not needed yet' : 'makes sense'}.` });
    checks.push({ label: 'Certificate chain', status: 'ok', detail: `Issuer ${target.issuer}, intermediate certificates complete.` });
    checks.push({ label: 'Key', status: 'ok', detail: `New key ${target.key}, fits the purpose.` });
    const names = data.dns.filter((d) => affectedVmIds.includes(d.vmId)).map((d) => d.name);
    checks.push({ label: 'Names in the certificate', status: 'ok', detail: names.length ? `Covers ${names.join(', ')}.` : 'No DNS names linked.' });
    diff.push({ sign: ' ', text: `certificate: ${target.name}` }, { sign: '-', text: `not_after: ${target.notAfter}` }, { sign: '+', text: `not_after: ${new Date(Date.parse(toDay(win && win[0] ? win[0] : data.asOf) + 'T00:00:00Z') + 365 * DAY_MS).toISOString().slice(0, 10)}` }, { sign: ' ', text: `deploy_to: ${affectedVmIds.join(', ')}` }, { sign: '+', text: 'reload: web dispatcher / application server (no restart)' });
    downtime.minutes = 0; downtime.note = 'No outage: the services reload the certificate.';
  } else if (pb.kind === 'dns') {
    const nv = req.newValue || (req.params && req.params.newValue) || '';
    const ttl = Number(req.ttl ?? (req.params && req.params.ttl) ?? target.ttl);
    if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(nv) && target.type === 'A') errors.push('The new value must be a valid IPv4 address.');
    if (!Number.isFinite(ttl) || ttl < 60 || ttl > 86400) errors.push('The TTL must be between 60 and 86400 seconds.');
    const users = data.dns.filter((d) => d.type === 'CNAME' && d.value === target.name);
    checks.push({ label: 'Users of the name', status: users.length ? 'warn' : 'ok', detail: users.length ? `${users.length} alias records point to ${target.name}: ${users.map((u) => u.name).join(', ')}.` : 'No alias records.' });
    checks.push({ label: 'TTL before the switch', status: target.ttl > 300 ? 'warn' : 'ok', detail: target.ttl > 300 ? `Current TTL ${target.ttl} s: lower it to 300 s first, otherwise the old address stays visible for up to ${Math.round(target.ttl / 60)} minutes.` : 'The TTL is already low.' });
    diff.push({ sign: ' ', text: `record: ${target.name} (${target.type})` }, { sign: '-', text: `value: ${target.value}   ttl: ${target.ttl}` }, { sign: '+', text: `value: ${nv || '(new)'}   ttl: ${ttl}` });
    downtime.minutes = 0; downtime.note = `Name resolution switches within up to ${Math.round(target.ttl / 60)} minutes (TTL).`;

    $('#log').innerHTML = S.logs[t.id].map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('');
    document.querySelectorAll('[data-ask]').forEach(function (b) { b.onclick = function () { askJoule(promptFor(b.dataset.ask, t, p), b); }; });
    if (S.runs[t.id]) showRun(t, p, S.runs[t.id].lines.length);
  }
  function renderActions(t, p) {
    var box = $('#actions'); if (!box) return;
    var h = '<div class="row">';
    var ph = phaseOf(t);
    if (t.flow && (ph === 'created' || ph === 'precheck')) h += '<button class="btn primary" data-do="precheck" type="button">' + (ph === 'precheck' ? 'Run the pre-check again' : 'Run pre-check now') + '</button>';
    if (t.flow && ph === 'post') h += '<button class="btn" data-do="postcheck" type="button">Run the post-check again</button>';
    if (t.flow && ph === 'blocked') h += '<span class="sub" role="status">The pre-check blocked this change. Fix the request (window, backup) and create a new task.</span>';
    if (t.flow && ph === 'window') h += '<button class="btn" data-do="skip" type="button">Skip the waiting (open the downtime window now)</button>';
    if (t.flow && ph === 'post_failed') h += '<span class="sub" role="status">The post-check failed: the rollback would start now (simulated).</span>';
    if (t.state === 'planned' && !(t.flow && t.flow.auto && ph !== 'precheck_done')) h += '<button class="btn primary" data-do="submit" type="button"' + (p.ok ? '' : ' disabled') + '>Submit for review</button>';
    if (t.state === 'in_review') {
      var ok = canApprove(t, S.who, D);
      h += '<button class="btn primary" data-do="approve" type="button"' + (ok.ok ? '' : ' disabled') + '>Approve as ' + esc((person(S.who) || {}).name) + '</button>' + '<span class="sub" role="status">' + esc(ok.ok ? approvalHint(t, D) : ok.reason) + '</span>';
    }
    if ((t.state === 'approved' || t.state === 'in_window') && !t.flow) h += '<button class="btn primary" data-do="run" type="button"' + (p.ok ? '' : ' disabled') + '>' + (t.state === 'in_window' ? 'Continue execution' : 'Start in window') + ' (simulation)</button>';
    h += '</div>';
    box.innerHTML = h;
    var b;
    if ((b = box.querySelector('[data-do=precheck]'))) b.onclick = function () { sendCheck(t, 'pre'); };
    if ((b = box.querySelector('[data-do=postcheck]'))) b.onclick = function () { sendCheck(t, 'post'); };
    if ((b = box.querySelector('[data-do=skip]'))) b.onclick = function () { openWindow(t); };
    if ((b = box.querySelector('[data-do=submit]'))) b.onclick = function () { if (t.flow) { submitForReview(t); return; } t.state = 'in_review'; addLog(t, 'submitted for review by ' + pname(S.who)); refresh(t); };
    if ((b = box.querySelector('[data-do=approve]'))) b.onclick = function () { approveBy(t, S.who); };
    if ((b = box.querySelector('[data-do=run]'))) b.onclick = function () { startRun(t); };
  }
  function refresh(t) { render(); openTask(t.id); }
  function finish(t) {
    if (t.flow) { t.flow.upg = 6; addLog(t, 'playbook finished, post-check requested'); render(); if (S.openTask === t.id) openTask(t.id); sendCheck(t, 'post'); return; }
    t.state = 'done'; addLog(t, 'verification successful, evidence created'); render(); if (S.openTask === t.id) openTask(t.id);
  }
  function startRun(t) {
    var p = planOf(t), run = simulateRun(p);
    t.state = 'in_window'; addLog(t, 'execution started (simulation) by ' + pname(S.who));
    S.runs[t.id] = run; render(); openTask(t.id);
    var shown = 0;
    function next() {
      shown++; showRun(t, p, shown);
      if (t.flow) { t.flow.upg = Math.min(6, Math.floor(shown / run.lines.length * 6)); var tb = $('#tracker'); if (tb && S.openTask === t.id) tb.innerHTML = trackerHtml(t, p); }
      if (shown < run.lines.length) S.timers.push(setTimeout(next, reduced ? 0 : Math.round(380 * (S.speed === 'fast' ? 0.3 : 1)))); else finish(t);
    }
    if (reduced) { showRun(t, p, run.lines.length); finish(t); } else next();
  }
  function showRun(t, p, n) {
    var box = $('#runbox'); if (!box) return;
    var run = S.runs[t.id];
    box.innerHTML = '<h3>Execution (simulated)</h3><div class="run" aria-live="polite">' + esc(run.lines.slice(0, n).join('\n')) + '</div>';
    if (t.state === 'done' && n >= run.lines.length) {
      $('#evidence').innerHTML = '<h3>Audit evidence</h3><pre class="code">' + esc([
        'Task:         ' + t.id + ' (' + p.playbook.id + ')', 'Target:       ' + t.target + ' / ' + p.customer, 'Window:       ' + t.window[0] + ' to ' + t.window[1],
        'Requested by: ' + pname(t.requester), 'Approvals:    ' + (t.approvals || []).map(pname).join('; '),
        'Pre-check:    ' + p.checks.filter(function (c) { return c.status === 'ok'; }).length + ' ok, ' + p.checks.filter(function (c) { return c.status !== 'ok'; }).length + ' notes' + (t.precheck ? ' (Pre-Checks and Post-Checks: ' + t.precheck.verdict + ')' : ''),
        'Post-check:   ' + (t.postcheck ? t.postcheck.verdict : 'not run') + (t.ticket ? '\nTicket:       ' + t.ticket + ' closed' : ''),
        'Result:       ok=' + run.recap.ok + ' changed=' + run.recap.changed + ' failed=' + run.recap.failed, 'Rollback:     not needed',
      ].join('\n')) + '</pre>';
    }
  }

  /* ---------- new task ---------- */
  function openNew(pre) {
    var f = { auto: S.auto, template: pre.template || 'renew-certificate', target: pre.target || '', date: addDays(D.asOf, 10), time: '22:00', hours: 2, newValue: '', ttl: 300, targetRegion: 'europe-west1' };
    openDrawer('<h2>New task</h2><p class="note">The request is checked against the inventory and the rules before it can be created.' + (pre.ticket ? ' From ticket <b>' + esc(pre.ticket) + '</b>.' : '') + '</p><div class="form" id="form"></div><div id="preview"></div>');
    function targetsFor(tpl) { var k = PLAYBOOKS[tpl].kind; return k === 'cert' ? D.certs.map(function (c) { return [c.id, c.id + ' · ' + c.name]; }) : k === 'dns' ? D.dns.map(function (d) { return [d.id, d.name]; }) : D.vms.map(function (v) { return [v.id, v.id + ' · ' + v.role]; }); }
    function req() {
      var start = f.date + 'T' + f.time, end = new Date(Date.parse(start + ':00Z') + f.hours * 3600000).toISOString().slice(0, 16);
      return { template: f.template, target: f.target, window: [start, end], newValue: f.newValue, ttl: f.ttl, targetRegion: f.targetRegion, requester: S.who, state: 'planned' };
    }
    function paint(full) {
      var list = targetsFor(f.template); if (!list.some(function (x) { return x[0] === f.target; })) f.target = list[0][0];
      if (full) {
        $('#form').innerHTML = '<label class="full">Playbook<select id="f-tpl">' + Object.keys(PLAYBOOKS).map(function (id) { return '<option value="' + id + '"' + (id === f.template ? ' selected' : '') + '>' + esc(PLAYBOOKS[id].title + (PLAYBOOKS[id].status === 'draft' ? ' (draft)' : '')) + '</option>'; }).join('') + '</select></label>' +
          '<label class="full">Target<select id="f-target">' + list.map(function (x) { return '<option value="' + esc(x[0]) + '"' + (x[0] === f.target ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; }).join('') + '</select></label>' +
          '<label>Date<input id="f-date" type="date" value="' + f.date + '"></label><label>Start<input id="f-time" type="time" value="' + f.time + '"></label>' +
          '<label>Duration<select id="f-hours">' + [2, 4, 8, 10].map(function (h) { return '<option' + (h === f.hours ? ' selected' : '') + ' value="' + h + '">' + h + ' hours</option>'; }).join('') + '</select></label>' +
          (f.template === 'update-dns-record' ? '<label>New value<input id="f-val" value="' + esc(f.newValue) + '" placeholder="203.0.113.99"></label><label>TTL (seconds)<input id="f-ttl" type="number" value="' + f.ttl + '"></label>' : '') +
          (f.template === 'move-vm' ? '<label>Target region<select id="f-reg">' + D.regions.map(function (r) { return '<option value="' + r.id + '"' + (r.id === f.targetRegion ? ' selected' : '') + '>' + esc(r.label + ' (' + r.freePct + ' % free)') + '</option>'; }).join('') + '</select></label>' : '');
        var on = function (id, key, num) { var el = $(id); if (el) el.oninput = el.onchange = function () { f[key] = num ? Number(el.value) : el.value; if (key === 'template') { f.target = ''; paint(true); } else paint(false); }; };
        $('#form').insertAdjacentHTML('beforeend', '<label class="full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-auto" style="width:auto;margin:0"' + (f.auto ? ' checked' : '') + '> Run the whole process automatically (demo): pre-check, approval, downtime window, upgrade, post-check, close ticket</label>');
        $('#f-auto').onchange = function (e) { f.auto = e.target.checked; S.auto = f.auto; };
        on('#f-tpl', 'template'); on('#f-target', 'target'); on('#f-date', 'date'); on('#f-time', 'time'); on('#f-hours', 'hours', true); on('#f-val', 'newValue'); on('#f-ttl', 'ttl', true); on('#f-reg', 'targetRegion');
      }
      var p = planTask(D, req());
      $('#preview').innerHTML = (p.errors.length ? errsHtml(p) : '') + (p.checks ? '<h3>Pre-check</h3>' + checksHtml(p) + '<h3>Planned change</h3>' + diffHtml(p) + '<p class="note">Risk ' + esc(p.risk) + '. ' + esc(p.approvalReason) + '</p>' : '') + '<div class="row"><button class="btn primary" id="create" type="button"' + (p.ok ? '' : ' disabled') + '>Create task</button></div>';
      var c = $('#create');
      if (c) c.onclick = function () {
        var r = req(), id = 'CHG-' + (1044 + S.tasks.length - D.tasks.length), t = { id: id, template: r.template, target: r.target, customer: p.customer ? D.customers.filter(function (x) { return x.name === p.customer; })[0].id : '', window: r.window, state: 'planned', requester: S.who, approvals: [], params: { newValue: r.newValue, ttl: r.ttl, targetRegion: r.targetRegion } };
        S.tasks.push(t); S.logs[id] = ['created by ' + pname(S.who)]; S.tab = 'tasks';
        if (pre.ticket) { t.ticket = pre.ticket; var tk = S.tickets.filter(function (x) { return x.id === pre.ticket; })[0]; if (tk) { tk.status = 'change'; tk.chg = id; S.logs[id][0] += ' from ticket ' + tk.id; } }
        t.flow = { auto: f.auto, phase: 'created' };
        render(); openTask(id); if (f.auto) beginFlow(t);
      };
    }
    paint(true);
  }
  function addDays(iso, n) { return new Date(Date.parse(iso) + n * 86400000).toISOString().slice(0, 10); }

  /* ---------- ask Joule ---------- */
  function askJoule(prompt, btn) {
    if (window.parent === window) return;
    window.parent.postMessage({ type: 'wb:ask', prompt: prompt.slice(0, 600) }, '*');
    if (btn) { var old = btn.textContent; btn.textContent = 'Sent to Joule'; btn.disabled = true; setTimeout(function () { btn.textContent = old; btn.disabled = false; }, 3500); }
  }
  function promptFor(kind, t, p) {
    var head = 'Change ' + t.id + ': ' + p.playbook.title + ' for ' + t.target + ' (' + p.customer + '), window ' + t.window[0].replace('T', ' ') + ', risk ' + p.risk + ', ' + (p.downtime.minutes ? 'outage about ' + p.downtime.minutes + ' min' : 'no outage') + '. ';
    if (kind === 'customer') return head + 'Draft a short, factual customer notice (what, when, impact, contact). Fictional sample data.';
    if (kind === 'rollback') return head + 'Explain step by step what happens on a rollback and how to recognise that one is needed.';
    if (kind === 'n8n') {
      var x = t.params || {};
      return 'Submit change ' + t.id + ' to n8n. First call plan_infra_change (template ' + t.template + ', target ' + t.target + ', window_start ' + t.window[0] + ', window_end ' + t.window[1] + (x.newValue ? ', new_value ' + x.newValue : '') + (x.ttl && t.template === 'update-dns-record' ? ', ttl ' + x.ttl : '') + (x.targetRegion && t.template === 'move-vm' ? ', target_region ' + x.targetRegion : '') + ') and show me the result. Only after I confirm, call submit_infra_change with confirm true.';
    }
    return head + 'Explain the change for a change manager: purpose, flow, risks and what to check before approving.';
  }

  /* ---------- shell ---------- */
  var TABS = [['overview', 'Overview'], ['tasks', 'Tasks'], ['inventory', 'Inventory'], ['playbooks', 'Playbooks and orchestration']];
  function render() {
    $('#tabs').innerHTML = TABS.map(function (x) { return '<button role="tab" type="button" data-tab="' + x[0] + '" aria-selected="' + (S.tab === x[0]) + '">' + x[1] + '</button>'; }).join('');
    document.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { S.tab = b.dataset.tab; render(); }; });
    ({ overview: overview, tasks: tasksTab, inventory: inventory, playbooks: playbooksTab })[S.tab]();
    persist();
  }
  $('#who').innerHTML = D.people.map(function (p) { return '<option value="' + p.id + '"' + (p.id === S.who ? ' selected' : '') + '>' + esc(p.name + ' (' + p.role + ')') + '</option>'; }).join('');
  $('#who').onchange = function (e) { S.who = e.target.value; if (S.openTask && find(S.openTask)) openTask(S.openTask); };
  $('#reset').onclick = function () { reset(); closeDrawer(); render(); };
  $('#speed').onchange = function (e) { S.speed = e.target.value; persist(); };

  /* The host gives back what this page saved before it was left, and delivers hand-overs from other Spaces. */
  function resumeFlows() {
    S.tasks.forEach(function (t) {
      if (!t.flow) return;
      if (t.flow.phase === 'approval') scheduleApprovals(t);
      else if (t.flow.phase === 'window') scheduleWindow(t);
      else if (t.flow.phase === 'running' && t.state === 'in_window') { if (!S.runs[t.id]) startRun(t); else finish(t); }
      else if (t.flow.phase === 'closing') later(function () { finishFlow(t); }, 600 * K());
    });
  }
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== 'wb:restore') return;
    var m = e.data, st = m.state;
    if (st && Array.isArray(st.tasks)) {
      S.timers.forEach(clearTimeout); S.timers = [];
      S.tasks = st.tasks; S.logs = st.logs || {}; S.runs = st.runs || {}; S.tickets = Array.isArray(st.tickets) ? st.tickets : [];
      if (typeof st.who === 'string') S.who = st.who; S.auto = st.auto !== false; S.speed = st.speed === 'fast' ? 'fast' : 'normal'; if (st.tab) S.tab = st.tab;
      $('#who').value = S.who; $('#speed').value = S.speed;
    }
    var open = null;
    (Array.isArray(m.handoffs) ? m.handoffs : []).forEach(function (h) {
      var p = h && h.payload; if (!p) return;
      if (p.type === 'ticket') { onTicket(p); S.tab = 'overview'; }
      else if (p.type === 'check-result') { var t = find(String(p.taskId || '')); if (t) { onCheckResult(p); open = t.id; } }
    });
    resumeFlows(); render();
    var back = open || (st && st.openTask);
    if (back && find(back)) openTask(back);
  });
  reset(); render();
  window.__io = { S: S, openTask: openTask, openNew: openNew, render: render, startRun: startRun, promptFor: promptFor, find: find };
})();
</script>
</body>
</html>
