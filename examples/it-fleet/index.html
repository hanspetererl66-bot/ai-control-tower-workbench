<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT Fleet</title>
<style id="design-system">
/* Shared design system for the example Spaces (AI Control Tower, Sub4Me).
   Source of truth: examples/shared/design-system.css. Embedded into each Space by
   `npm run sync:design` (Spaces are single-file pages: no network, no external CSS).
   Light and dark follow prefers-color-scheme (or data-theme on <html>); colours only exist as tokens. */
:root{
  color-scheme:light dark;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:var(--font); /* one typeface everywhere; numbers use tabular figures */
  --canvas:#f7f6fb;--surface:#ffffff;--ink:#171322;--ink-2:#4a4560;--muted:#6c6784;--faint:#b4b0c4;--line:#ebe8f2;--line-2:#f4f2f9;--wash:#faf9fd;
  --purple:#A100FF;--purple-mid:#7B00C2;--purple-dim:rgba(161,0,255,.08);--purple-border:rgba(161,0,255,.2);--purple-light:#f3e6ff;
  --green:#00875A;--green-dim:rgba(0,135,90,.09);--green-border:rgba(0,135,90,.22);
  --amber:#a85c00;--amber-dim:rgba(176,94,0,.09);--amber-border:rgba(176,94,0,.24);
  --red:#c9190b;--red-dim:rgba(201,25,11,.08);--red-border:rgba(201,25,11,.22);
  --blue:#0041c2;--blue-dim:rgba(0,65,194,.08);--blue-border:rgba(0,65,194,.22);
  --teal:#006b75;--teal-dim:rgba(0,107,117,.09);
  --radius:16px;--radius-s:10px;--shadow:0 1px 2px rgba(23,19,34,.04);--shadow-lg:0 24px 60px rgba(23,19,34,.22);
  --space:8px;
  /* Control Tower token names */
  --black:var(--surface);--white:var(--surface);
  --g900:var(--ink);--g700:var(--ink-2);--g500:var(--muted);--g300:var(--faint);--g200:var(--line);--g100:var(--line-2);--g50:var(--wash);
  --sh:var(--shadow);--p-dim:var(--purple-dim);--r-dim:var(--red-dim);--r-bd:var(--red-border);--a-bd:var(--amber-border);--g-bd:var(--green-border);
  /* Sub4Me token names */
  --bg:var(--canvas);--panel:var(--surface);--mut:var(--muted);--brand:var(--purple);--brand-dim:var(--purple-dim);
  --ok:var(--green);--ok-dim:var(--green-dim);--warn:var(--amber);--warn-dim:var(--amber-dim);--bad:var(--red);--bad-dim:var(--red-dim);
}
/* Dark follows the system unless the host pins a theme with data-theme on <html> (the app does, so Spaces follow its Appearance setting). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0e0c14;--surface:#171320;--ink:#f2f0f8;--ink-2:#cfcbe0;--muted:#9a95b0;--faint:#5d5873;--line:#2b2638;--line-2:#211d2d;--wash:#1b1726;
  --purple:#c26bff;--purple-mid:#d9a3ff;--purple-dim:rgba(194,107,255,.14);--purple-border:rgba(194,107,255,.32);--purple-light:#2a1640;
  --green:#3ddc97;--green-dim:rgba(61,220,151,.13);--green-border:rgba(61,220,151,.3);
  --amber:#ffb454;--amber-dim:rgba(255,180,84,.13);--amber-border:rgba(255,180,84,.3);
  --red:#ff7a70;--red-dim:rgba(255,122,112,.13);--red-border:rgba(255,122,112,.3);
  --blue:#7aa7ff;--blue-dim:rgba(122,167,255,.13);--blue-border:rgba(122,167,255,.3);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0e0c14;--surface:#171320;--ink:#f2f0f8;--ink-2:#cfcbe0;--muted:#9a95b0;--faint:#5d5873;--line:#2b2638;--line-2:#211d2d;--wash:#1b1726;
  --purple:#c26bff;--purple-mid:#d9a3ff;--purple-dim:rgba(194,107,255,.14);--purple-border:rgba(194,107,255,.32);--purple-light:#2a1640;
  --green:#3ddc97;--green-dim:rgba(61,220,151,.13);--green-border:rgba(61,220,151,.3);
  --amber:#ffb454;--amber-dim:rgba(255,180,84,.13);--amber-border:rgba(255,180,84,.3);
  --red:#ff7a70;--red-dim:rgba(255,122,112,.13);--red-border:rgba(255,122,112,.3);
  --blue:#7aa7ff;--blue-dim:rgba(122,167,255,.13);--blue-border:rgba(122,167,255,.3);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.6);
}
:root[data-theme="light"]{color-scheme:light}

/* ---- Base ---- */
body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* Calmer labels: no all-caps micro headings, also where pages style them inline. */
[style*="text-transform:uppercase"]{text-transform:none!important;letter-spacing:0!important}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}
.tag,.mv,.bv,.kval,.dv,.tbl td,.num,.hdr-stat-val{font-variant-numeric:tabular-nums}

/* ---- Cards and tiles (both Spaces) ---- */
.mc,.card,.ns,.dtier,.pc,.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mc{padding:20px 22px}
.card,.ns{padding:24px;margin-bottom:16px}
.dtier,.pc,.cc{padding:18px}
.ns{border-top:1px solid var(--line)}
.ml,.k{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.mv,.v{font-family:var(--font);font-size:30px;font-weight:650;letter-spacing:-.025em;color:var(--ink);line-height:1.15}
.md,.s{font-size:12px}
.sh{font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);margin:36px 0 14px}
.chd{font-size:15px;font-weight:650;color:var(--ink)}

/* Status tags */
.tag{font-family:var(--font);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;border-width:1px}
.src{border-radius:99px;font-weight:600}

/* Tables */
.tbl th,table th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 14px}
.tbl td,table td{padding:14px;border-bottom:1px solid var(--line-2)}
.tbl{border-collapse:collapse}

/* Bars */
.bt{height:6px;border-radius:99px;background:var(--line-2)}
.bf{border-radius:99px}
.bar{background:var(--line-2)}

/* Alerts, notes and callouts */
.ab{border-radius:var(--radius);border-width:1px;border-left-width:1px;padding:18px 20px}
.ab-w{border-color:var(--amber-border)}.ab-i{border-color:var(--purple-border)}.ab-s{border-color:var(--blue-border)}.ab-ok{border-color:var(--green-border)}

/* Forms and buttons */
input,select,textarea{font-family:var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px var(--purple-dim)}
button.primary{background:var(--purple);color:#fff;border-radius:var(--radius-s);padding:10px 18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#1a0a2b}}
:root[data-theme="dark"] button.primary{color:#1a0a2b}

/* Overlay (agent list) */
.ag-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 30px}
.ag-ov{background:rgba(14,12,20,.55);backdrop-filter:blur(4px);z-index:200}
.ag-x,.ag-tools input,.ag-tools button{border-radius:var(--radius-s)}
.ag-x{background:var(--surface);color:var(--ink);border-color:var(--line)}
.ag-tools button{background:var(--purple-dim);color:var(--purple);border-color:var(--purple-border)}
.ag-tbl th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ag-tbl td{padding:10px 8px}

/* ---- Control Tower shell ---- */
.ct .hdr{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:60px;padding:0 32px}
.ct .hdr-title{color:var(--ink);font-size:15px;font-weight:650}
.ct .hdr-sub{font-family:var(--font);font-size:11px;letter-spacing:.01em;color:var(--muted)}
.ct .hdr-div{background:var(--line)}
.ct .acc-mark{color:var(--purple)}
.ct .hdr-stat-val{color:var(--ink);font-family:var(--font);font-weight:600}
.ct .hdr-stat-lbl{color:var(--muted);letter-spacing:.02em;text-transform:none;font-size:11px}
.ct .live{color:var(--muted);font-family:var(--font)}
.ct .tbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.ct .tb{padding:16px 14px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.ct .tb:hover:not(.on){color:var(--ink)}
.ct .tb.on{color:var(--purple);border-bottom:2px solid var(--purple);font-weight:600}
.ct .tnum{display:none}
.ct .pg{padding:40px 32px 64px;max-width:1320px;margin:0 auto}
.ct .mr{gap:16px;margin-bottom:32px}
.ct .g2,.ct .g3,.ct .g4{gap:20px}
.ct .br{margin-bottom:14px}
.ct .krow,.ct .srow,.ct .ci{padding:14px 0}
.ct .kdesc,.ct .sdesc,.ct .abod{line-height:1.65}
.ct .fn{border-radius:99px;font-family:var(--font)}
.ct .ns-fml{font-family:var(--font);border-radius:var(--radius-s)}
.ct .dm{font-family:var(--font);letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:500}

/* ---- Sub4Me shell ---- */
.s4m header{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 32px;min-height:60px;box-sizing:border-box}
.s4m .logo{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.5}
.s4m header .s{font-size:11px;letter-spacing:.01em;line-height:1.5;margin-top:1px;color:var(--muted)}
.s4m{font-size:13px}
.s4m .demo{padding:8px 32px}
.s4m nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.s4m nav button{padding:16px 14px 14px;font-size:13px;font-weight:500;line-height:normal;border-bottom:2px solid transparent}
.s4m nav button:hover:not([aria-selected=true]){color:var(--ink)}
.s4m nav button[aria-selected=true]{font-weight:600;border-bottom-color:var(--purple)}
.s4m main{padding:40px 32px 64px;max-width:1320px}
.s4m .grid{gap:16px;margin-bottom:28px}
.s4m h2{font-size:13px;font-weight:600;margin:36px 0 14px}
.s4m .row{gap:20px}
.s4m .months span{border-radius:8px 8px 0 0}
.s4m .bar{height:6px}
@media(max-width:640px){.ct .pg,.s4m main{padding:24px 16px 48px}.ct .hdr,.ct .tbar,.s4m header,.s4m nav{padding-left:16px;padding-right:16px}}
.s4m .months.stack div{cursor:default}
.s4m .months.stack .col{display:flex;flex-direction:column-reverse;width:100%;flex:1;justify-content:flex-start;gap:1px}
.s4m .months.stack .col i{display:block;width:100%;min-height:1px}
.s4m .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11px;color:var(--mut)}
.s4m .legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.s4m #products tbody tr{cursor:pointer}
.s4m #products tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #products tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m #contracts tbody tr,.s4m #offers tbody tr{cursor:pointer}
.s4m #contracts tbody tr[aria-selected="true"],.s4m #offers tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #contracts tbody tr:focus-visible,.s4m #offers tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .detail{margin-top:12px}
.s4m .detail .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
.s4m .detail .head .t{font-size:18px;font-weight:600}
.s4m .detail .hint{margin:0 0 4px}
.s4m .detail .secs{display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px}
.s4m .detail h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .detail dl{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:5px 12px;font-size:13px}
.s4m .detail dt{color:var(--muted)}
.s4m .detail dd{margin:0;overflow-wrap:anywhere}
.s4m .detail .lines{margin-top:16px;overflow-x:auto}
.s4m .detail .note{margin-top:14px;font-size:13px;color:var(--muted)}
.s4m #product-detail{margin-top:16px}
.s4m #product-detail .dgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0 18px}
.s4m #product-detail .dgrid .v{font-size:20px;font-weight:600}
.s4m #offers td:not(:nth-child(2)),.s4m #offers th,.s4m #contracts td:not(:nth-child(2)):not(:nth-child(3)){white-space:nowrap}

/* Skill Marketplace: impact, governance, gaps and the skill detail view */
.s4m .smx-kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:6px}
.s4m .smx-kpis .v{font-size:24px;font-weight:600}
.s4m tr[data-skill],.s4m article.sk[data-skill]{cursor:pointer}
.s4m tr[data-skill]:hover{background:var(--line-2)}
.s4m tr[data-skill]:focus-visible,.s4m article.sk[data-skill]:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .smx-spark{display:inline-flex;align-items:flex-end;gap:3px;height:28px;min-width:72px}
.s4m .smx-spark i{display:block;width:8px;border-radius:2px;background:var(--brand);opacity:.45}
.s4m .smx-spark i.cur{opacity:.2}
.s4m .smx-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.s4m .smx-title{font-size:20px;font-weight:600}
.s4m .smx-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.s4m .smx-grid h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .smx-dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:13px}
.s4m .smx-dl dt{color:var(--muted)}
.s4m .smx-dl dd{margin:0;overflow-wrap:anywhere}
.s4m .smx-list{margin:4px 0 0;padding-left:18px;font-size:13px}
.s4m .smx-list li{margin:3px 0}
.s4m #detail-back{margin-bottom:10px}
.s4m .smx-rate{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.s4m .smx-stars{display:inline-block;letter-spacing:1px;line-height:1;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--faint) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.s4m .smx-stars-sm{font-size:12px}
.s4m .smx-line{margin:2px 0 6px;font-size:13px}
.s4m .smx-big{font-size:32px;font-weight:600;line-height:1.1}
.s4m .smx-bars{display:grid;gap:5px;margin-top:10px;font-size:12px}
.s4m .smx-bar{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:8px;color:var(--muted)}
.s4m .smx-bar i{display:block;height:8px;border-radius:4px;background:var(--line)}
.s4m .smx-bar i b{display:block;height:100%;border-radius:4px;background:var(--amber)}
.s4m .smx-bar .num{text-align:right}
</style>
<style>
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:13px}
main{max-width:1240px;margin:0 auto;padding:20px 24px 48px}
.demo{margin:0 0 14px;padding:10px 14px;border:1px solid var(--amber-border);background:var(--amber-dim);color:var(--ink-2);border-radius:var(--radius-s);font-size:12px}
h2{font-size:15px;font-weight:650;margin:0 0 4px}h3{font-size:13px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin:0 0 12px}
.card{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi .v{font-size:22px;font-weight:600}.kpi .k{color:var(--muted);font-size:12px}.kpi .s{margin-top:2px;color:var(--muted);font-size:11px}
.kpi.red{border-color:var(--red-border)}.kpi.red .v{color:var(--red)}.kpi.amber{border-color:var(--amber-border)}.kpi.amber .v{color:var(--amber)}.kpi.green{border-color:var(--green-border)}.kpi.green .v{color:var(--green)}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:12px;font-weight:600;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--purple-dim);color:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--purple-dim);border-color:var(--purple-border);color:var(--purple)}
select,input[type=search]{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:5px 10px;background:var(--surface);color:var(--ink)}
label.chk{font-size:12px;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center}
.spacer{margin-left:auto}
button.primary,button.ghost,button.small{font:inherit;cursor:pointer}
button.primary{border:0;background:var(--purple);color:#fff;border-radius:99px;padding:7px 16px;font-weight:650}
button.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600}
button.small{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--purple-border);background:var(--surface);color:var(--purple);font-weight:650}
button:disabled{opacity:.5;cursor:default}
.tm{position:relative;width:100%;height:470px}
.tile{position:absolute;box-sizing:border-box;padding:6px 8px;border:2px solid var(--surface);border-radius:8px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;overflow:hidden}
.tile .n{font-weight:650;font-size:12px;line-height:1.25;overflow:hidden}.tile .c{font-size:11px;margin-top:2px;color:var(--ink-2)}
.tile.green{background:var(--green-dim);box-shadow:inset 0 0 0 1.5px var(--green-border)}.tile.yellow{background:var(--amber-dim);box-shadow:inset 0 0 0 1.5px var(--amber-border)}.tile.red{background:var(--red-dim);box-shadow:inset 0 0 0 1.5px var(--red)}
.tile:hover,.tile:focus-visible,.tile[aria-pressed=true]{outline:2px solid var(--purple);outline-offset:-1px;z-index:2}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700;border:1px solid}
.pill.green,.pill.done{background:var(--green-dim);border-color:var(--green-border);color:var(--green)}.pill.yellow,.pill.planned{background:var(--amber-dim);border-color:var(--amber-border);color:var(--amber)}.pill.red,.pill.urgent{background:var(--red-dim);border-color:var(--red-border);color:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;color:var(--ink-2);font-size:12px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid}
.legend .g{background:var(--green-dim);border-color:var(--green)}.legend .y{background:var(--amber-dim);border-color:var(--amber)}.legend .r{background:var(--red-dim);border-color:var(--red)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}td{padding:5px 8px;border-bottom:1px solid var(--line-2)}
.hm-wrap{max-height:560px;overflow:auto}
.hm td.c{text-align:center;font-weight:650;min-width:70px}.hm td.c.red{background:var(--red-dim);color:var(--red)}.hm td.c.yellow{background:var(--amber-dim);color:var(--amber)}
.hm tr[data-c]{cursor:pointer}.hm tr[data-c]:hover td,.hm tr[aria-selected=true] td{background:var(--purple-dim)}
.sys{display:block;font-size:10px;color:var(--red);font-weight:700}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:18px;vertical-align:middle}.spark i{display:block;width:4px;background:var(--red);opacity:.6;border-radius:1px;min-height:1px}
.inbox{display:grid;gap:12px}
.bundle{border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;background:var(--surface)}
.bundle.red{border-color:var(--red-border)}.bundle .t{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.bundle .t b{font-size:14px}
.bundle ol{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:12px}
.cust{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.cust button{border:1px solid var(--line);background:var(--surface);border-radius:99px;font:inherit;font-size:11px;padding:2px 9px;cursor:pointer;color:var(--ink)}.cust button.red{border-color:var(--red-border);color:var(--red)}
.flow{display:flex;gap:4px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap;align-items:center}.flow b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:10px}
.vm{text-align:left;font:inherit;color:var(--ink);border-radius:var(--radius-s);padding:7px 9px;border:1.5px solid var(--line);background:var(--surface);min-width:0;cursor:default}
.vm .n{font-weight:650;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vm .r{color:var(--muted);font-size:10px}
.vm.green{background:var(--green-dim);border-color:var(--green-border)}.vm.yellow{background:var(--amber-dim);border-color:var(--amber-border)}.vm.red{background:var(--red-dim);border-color:var(--red-border)}
.vm:hover,.vm:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
.drill{border-color:var(--purple-border)}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0;color:var(--ink-2);font-size:12px}.facts b{color:var(--ink)}
.tip{position:fixed;z-index:10;max-width:300px;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-s);box-shadow:var(--shadow-lg);padding:10px 12px;font-size:12px;line-height:1.45}.tip[hidden]{display:none}.tip ul{margin:4px 0 0;padding-left:16px}.tip .lim{color:var(--muted)}
.guide{border-color:var(--purple-border);background:var(--purple-dim)}.guide .stepno{font-size:11px;font-weight:700;color:var(--purple)}.guide p{margin:4px 0 0;color:var(--ink-2)}
.guide .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.dots{display:flex;gap:5px;margin-bottom:6px}.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--purple)}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
@media (max-width:760px){.tm{height:620px}}
</style>

<body>
<main>
  <p class="demo">Fictional customers and virtual machines, generated from a fixed seed, no live monitoring. A VM is green, yellow or red by the same fixed rules as in the IT Infrastructure Space; a customer is as red as its worst VM. Nothing is restarted or changed.</p>
  <div class="kpis" id="kpis"></div>
  <div class="card guide" id="guide" aria-live="polite"></div>
  <div class="card">
    <div class="bar">
      <div class="seg" role="group" aria-label="View"><button type="button" data-view="map" aria-pressed="true">Treemap</button><button type="button" data-view="heat" aria-pressed="false">Heatmap</button><button type="button" data-view="inbox" aria-pressed="false">Task inbox</button></div>
      <div class="chips" id="status-chips" role="group" aria-label="Filter by status"></div>
      <label class="chk"><input type="checkbox" id="prod" checked> Production only</label>
      <select id="region" aria-label="Region"></select>
      <input type="search" id="q" placeholder="Find customer" aria-label="Find customer">
      <button class="ghost spacer" id="reset" type="button">Reset demo</button>
    </div>
    <div id="view"></div>
  </div>
  <div class="card drill" id="drill" hidden></div>
</main>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script id="fleet-logic">
function assess(vm, rules) {
  const reasons = [];
  const add = (level, text, key) => reasons.push({ level, text, key });
  if (!vm.reachable) add('red', 'Not reachable: the VM does not answer monitoring checks', 'unreachable');
  else {
    const metric = (field, label, unit, key) => {
      const v = vm[field], r = rules[field];
      if (v === null || v === undefined) return;
      if (r.appliesTo && r.appliesTo !== vm.env) return;
      if (field === 'certExpiresInDays') {
        if (v <= r.red) add('red', `${label} ${v}${unit} (red up to ${r.red}${unit})`, key);
        else if (v <= r.yellow) add('yellow', `${label} ${v}${unit} (yellow up to ${r.yellow}${unit})`, key);
      } else if (v >= r.red) add('red', `${label} ${v}${unit} (red from ${r.red}${unit})`, key);
      else if (v >= r.yellow) add('yellow', `${label} ${v}${unit} (yellow from ${r.yellow}${unit})`, key);
    };
    metric('cpuPct', 'CPU', ' %', 'cpu'); metric('memPct', 'Memory', ' %', 'mem'); metric('diskPct', 'Disk', ' %', 'disk');
    metric('backupAgeHours', 'Last backup', ' h ago', 'backup'); metric('patchLagDays', 'Security patch missing for', ' days', 'patch');
    metric('certExpiresInDays', 'TLS certificate expires in', ' days', 'cert');
  }
  const status = reasons.some((r) => r.level === 'red') ? 'red' : reasons.length ? 'yellow' : 'green';
  reasons.sort((a, b) => (a.level === b.level ? 0 : a.level === 'red' ? -1 : 1));
  return { status, reasons };
}

  vms: c.vms.map(([name, env, cpu, mem, disk, backup, patch, cert, reach]) => ({ id: c.id + '/' + name, name, env, cpuPct: cpu, memPct: mem, diskPct: disk, backupAgeHours: backup, patchLagDays: patch, certExpiresInDays: cert, reachable: !!reach })) }));

const worstFirst = (a, b) => b.red - a.red || b.yellow - a.yellow || a.name.localeCompare(b.name);

function squarify(values, x, y, w, h) {

function renderInbox() {
  const list = bundles(), fin = Object.keys(state.done).filter((k) => !list.some((b) => b.key === k));
  $('#view').innerHTML = '<p class="sub">The same task on many VMs is one bundle: one approval, one rollout. Urgent bundles (at least one red VM) come first.</p><div class="inbox">' + list.map((b) => {
    const t = DATA.tasks[b.key], st = state.approved[b.key] ? 1 : 0, custs = [...b.customers.values()].sort((a, c) => c.red - a.red || a.c.name.localeCompare(c.c.name));
    return `<div class="bundle ${b.red ? 'red' : ''}"><div class="t"><b>${esc(t.title)}</b><span class="pill ${b.red ? 'urgent' : 'planned'}">${b.red ? 'urgent' : 'planned'}</span><span>${b.vms} VM${b.vms === 1 ? '' : 's'} at ${custs.length} customer${custs.length === 1 ? '' : 's'}${b.red ? ', ' + b.red + ' red' : ''}</span><span class="spacer"></span><span class="lim" style="color:var(--muted)">Approver: ${esc(t.approver)} · ${t.reboot ? 'maintenance window per customer (restart)' : 'rolling, during operations'}</span></div>` +
      `<ol>${t.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol><div class="cust">${custs.slice(0, 10).map((e) => `<button type="button" class="${e.red ? 'red' : ''}" data-c="${esc(e.c.id)}">${esc(e.c.name)}</button>`).join('')}${custs.length > 10 ? `<span style="color:var(--muted);font-size:11px;align-self:center">+ ${custs.length - 10} more</span>` : ''}</div>` +
      `<div class="flow">${FLOW.map((f, i) => (i === st ? `<b>${f}</b>` : f)).join(' › ')}</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">${st === 0 ? `<button class="small" data-act="approve" data-k="${b.key}">Approve bundle</button>` : `<button class="small" data-act="run" data-k="${b.key}">Run bundle (simulated)</button>`}<button class="small" data-act="ask" data-k="${b.key}">Ask Joule about the rollout</button></div></div>`;
  }).join('') + fin.map((k) => `<div class="bundle"><div class="t"><b>${esc(DATA.tasks[k].title)}</b><span class="pill done">done</span><span>Every affected VM was measured again (simulated).</span></div></div>`).join('') + '</div>' + (list.length || fin.length ? '' : '<p class="note">No open tasks for this filter.</p>');
  const box = $('#view');
  box.querySelectorAll('.cust button[data-c]').forEach((b) => (b.onclick = () => { state.sel = b.dataset.c; renderAll(); $('#drill').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }));
  box.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => {
    const k = b.dataset.k, bd = list.find((x) => x.key === k);
    if (b.dataset.act === 'approve') state.approved[k] = true;
    if (b.dataset.act === 'run') { state.done[k] = true; delete state.approved[k]; compute(); }
    if (b.dataset.act === 'ask') { send(`In our IT fleet the task "${DATA.tasks[k].title}" is open on ${bd.vms} VMs at ${bd.customers.size} customers (${bd.red} red). How would you roll it out in waves, and what could go wrong? Do not execute anything. Please answer in English.`); return; }
    renderAll();
  }));
}
function renderDrill() {
  const el = $('#drill'), c = model.find((x) => x.id === state.sel);
  if (!c) { el.hidden = true; return; }
  el.hidden = false;
  const tk = state.tickets[c.id];
  el.innerHTML = `<div class="head"><div style="flex:1 1 300px"><h2>${esc(c.name)} <span class="pill ${c.status}">${LABEL[c.status]}</span></h2><div class="facts"><span>SAP customer ID <b>${esc(c.sap)}</b></span><span>Region <b>${esc(c.region)}</b></span><span>Tier <b>${esc(c.tier)}</b></span><span>VMs <b>${c.vms.length}</b> (${c.red} red, ${c.yellow} yellow, ${c.green} green)</span></div></div>` +
    `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" id="ask" type="button">Ask Joule about ${esc(c.name)}</button>${c.status === 'green' ? '' : tk ? `<span class="pill planned">Ticket ${esc(tk)} with the operator</span>` : '<button class="ghost" id="ticket" type="button">Create ticket for operator</button>'}<button class="ghost" id="close" type="button">Close</button></div></div>` +
    `<p class="sub" style="margin-top:8px">Worst VMs first. Hover over a VM to see why it has its colour.</p><div class="grid">${[...c.vms].sort((a, b) => ({ red: 0, yellow: 1, green: 2 }[a.status] - { red: 0, yellow: 1, green: 2 }[b.status]) || a.name.localeCompare(b.name)).map((v, i) => `<button type="button" class="vm ${v.status}" data-i="${i}"><div class="n">${esc(v.name)}</div><div class="r">${esc(v.env)} · ${v.status === 'green' ? 'ok' : v.reasons.length + ' reason' + (v.reasons.length > 1 ? 's' : '')}</div></button>`).join('')}</div>`;
  const sorted = [...c.vms].sort((a, b) => ({ red: 0, yellow: 1, green: 2 }[a.status] - { red: 0, yellow: 1, green: 2 }[b.status]) || a.name.localeCompare(b.name));
  el.querySelectorAll('.vm').forEach((b) => hover(b, () => { const v = sorted[+b.dataset.i]; return `<h3>${esc(v.name)} <span class="pill ${v.status}">${LABEL[v.status]}</span></h3>` + (v.reasons.length ? `<ul>${v.reasons.map((r) => `<li>${esc(r.text)}</li>`).join('')}</ul>` : '<div class="lim">All checks within limits.</div>'); }));
  $('#close').onclick = () => { state.sel = null; renderAll(); };
  $('#ask').onclick = () => send(`Explain the IT status of the customer ${c.name} (SAP customer ID ${c.sap}, ${c.region}): ${c.status}, ${c.red} red and ${c.yellow} yellow of ${c.vms.length} VMs (${reasonsOf(c).join(', ') || 'no reasons'}). What should the operator do first? Please answer in English.`);
  if ($('#ticket')) $('#ticket').onclick = () => {
    const id = 'OP-' + (2042 + Object.keys(state.tickets).length); state.tickets[c.id] = id;
    send(`Open a service ticket for the IT operator with the tool create_ticket: customer muster, product "IT infrastructure", priority ${c.status === 'red' ? 'High' : 'Medium'}, title "${id} ${c.name} (SAP ${c.sap}): ${c.red} red, ${c.yellow} yellow VMs", description "${reasonsOf(c).join(', ')}". Please answer in English.`);
    renderAll();
  };
}
function renderKpis() {
  const all = model.filter((c) => c.vms.length), n = (s) => all.filter((c) => c.status === s).length, vmsAll = all.reduce((a, c) => a + c.vms.length, 0), b = bundles();
  const k = (cls, v, key, s) => `<div class="kpi ${cls}"><div class="v">${v}</div><div class="k">${key}</div><div class="s">${s}</div></div>`;
  $('#kpis').innerHTML = k('', all.length, 'Customers', vmsAll + ' VMs' + (state.prod ? ' (production)' : '')) + k('red', n('red'), 'Red customers', 'act now') + k('amber', n('yellow'), 'Yellow customers', 'plan an action') + k('green', n('green'), 'Green customers', 'all VMs within limits') +
    k('', b.length, 'Task bundles', b.reduce((a, x) => a + x.vms, 0) + ' tasks on VMs') + k('', Object.keys(state.tickets).length, 'Operator tickets', 'created in this demo');
}
function renderBar() {
  $('#status-chips').innerHTML = ['all', 'red', 'yellow', 'green'].map((s) => `<button type="button" data-s="${s}" aria-pressed="${state.status === s}">${s === 'all' ? 'All' : LABEL[s]} ${s === 'all' ? model.filter((c) => c.vms.length).length : model.filter((c) => c.vms.length && c.status === s).length}</button>`).join('');
  $('#status-chips').querySelectorAll('button').forEach((b) => (b.onclick = () => { state.status = b.dataset.s; renderAll(); }));
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
}
const STEPS = [
  { t: 'See all customers at once', x: 'Every tile is a customer, sized by its VMs and coloured by its worst VM. The red ones are where to look first.', on: () => { state.view = 'map'; state.status = 'all'; } },
  { t: 'Only the red ones', x: 'Filter on red and open a customer: its VM wall shows which VMs are red and why. Details stay one click away instead of 1,000 dots on one screen.', on: () => { state.view = 'map'; state.status = 'red'; const r = model.filter((c) => c.status === 'red').sort(worstFirst)[0]; state.sel = r ? r.id : null; } },
  { t: 'Find the shared cause', x: 'The heatmap shows which check is red or yellow across many customers. A column with many customers (here usually the certificate) is one cause, not many incidents.', on: () => { state.view = 'heat'; state.status = 'all'; state.sel = null; } },
  { t: 'One bundle instead of many tickets', x: 'The task inbox groups the same task across customers: one approval and one rollout for all affected VMs.', on: () => { state.view = 'inbox'; state.status = 'all'; } },
  { t: 'Approve, run, watch the colours change', x: 'We approve the certificate bundle and run it (simulated). Every affected VM is measured again, and customers turn from red or yellow towards green.', on: () => { state.view = 'inbox'; state.status = 'all'; state.done.cert = true; compute(); } },
];
function renderGuide() {
  const g = $('#guide');
  if (state.step < 0) { g.innerHTML = '<div class="head"><div style="flex:1 1 300px"><h2>Demo flow</h2><p class="sub" style="margin:0">Five steps from the whole fleet to a bundled fix: see everything, narrow down, find the shared cause, bundle, run.</p></div><button class="primary" id="g-start" type="button">Start demo</button></div>'; $('#g-start').onclick = () => go(0); return; }
  const s = STEPS[state.step];
  g.innerHTML = `<div class="dots">${STEPS.map((_, i) => `<i class="${i <= state.step ? 'on' : ''}"></i>`).join('')}</div><div class="stepno">Step ${state.step + 1} of ${STEPS.length}</div><h2>${esc(s.t)}</h2><p>${esc(s.x)}</p><div class="btns"><button class="ghost" id="g-back" type="button" ${state.step === 0 ? 'disabled' : ''}>Back</button><button class="primary" id="g-next" type="button">${state.step === STEPS.length - 1 ? 'Finish' : 'Next'}</button><button class="ghost" id="g-end" type="button">End demo</button></div>`;
  $('#g-back').onclick = () => go(state.step - 1); $('#g-next').onclick = () => (state.step === STEPS.length - 1 ? ((state.step = -1), renderAll()) : go(state.step + 1)); $('#g-end').onclick = () => { state.step = -1; renderAll(); };
}
function go(i) { state.step = i; Object.assign(state, { approved: {}, done: {}, sel: null, status: 'all' }); compute(); for (let k = 0; k <= i; k++) STEPS[k].on(); compute(); renderAll(); }
function renderAll() { renderKpis(); renderBar(); renderGuide(); ({ map: renderMap, heat: renderHeat, inbox: renderInbox })[state.view](); renderDrill(); }
document.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => { state.view = b.dataset.view; renderAll(); }));
$('#prod').onchange = (e) => { state.prod = e.target.checked; compute(); renderAll(); };
$('#region').innerHTML = '<option value="all">All regions</option>' + [...new Set(raw.map((c) => c.region))].map((r) => `<option>${esc(r)}</option>`).join('');
$('#region').onchange = (e) => { state.region = e.target.value; renderAll(); };
$('#q').oninput = (e) => { state.q = e.target.value; renderAll(); };
$('#reset').onclick = () => { Object.assign(state, { status: 'all', prod: true, region: 'all', q: '', sel: null, approved: {}, done: {}, tickets: {}, step: -1, view: 'map' }); $('#prod').checked = true; $('#region').value = 'all'; $('#q').value = ''; compute(); renderAll(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { hideTip(); state.sel = null; renderAll(); } });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => state.view === 'map' && renderMap(), 120); });
compute(); renderAll();
window.__fleet = () => model; window.__state = state; window.__go = go;
})();
</script>
