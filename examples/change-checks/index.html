<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Checks</title>
<style id="design-system">
/* Shared design system for the example Spaces (AI Control Tower, Sub4Me).
   Source of truth: examples/shared/design-system.css. Embedded into each Space by
   `npm run sync:design` (Spaces are single-file pages: no network, no external CSS).
   Light and dark follow prefers-color-scheme (or data-theme on <html>); colours only exist as tokens. */
:root{
  color-scheme:light dark;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:var(--font); /* one typeface everywhere; numbers use tabular figures */
  --canvas:#f6f1fc;--surface:#ffffff;--ink:#22093a;--ink-2:#4b3a66;--muted:#6f6388;--faint:#bcb0d2;--line:#e8def6;--line-2:#f2ebfa;--wash:#faf6ff;
  --purple:#A100FF;--purple-mid:#7500C0;--purple-deep:#460073;--purple-dim:rgba(161,0,255,.07);--purple-border:rgba(161,0,255,.22);--purple-light:#E6DCFF;
  --green:#00875A;--green-dim:rgba(0,135,90,.09);--green-border:rgba(0,135,90,.22);
  --amber:#a85c00;--amber-dim:rgba(176,94,0,.09);--amber-border:rgba(176,94,0,.24);
  --red:#c9190b;--red-dim:rgba(201,25,11,.08);--red-border:rgba(201,25,11,.22);
  --blue:#0041F0;--blue-dim:rgba(0,65,240,.08);--blue-border:rgba(0,65,240,.22);
  --teal:#006b75;--teal-dim:rgba(0,107,117,.09);
  --radius:20px;--radius-s:12px;--shadow:0 1px 2px rgba(70,0,115,.05),0 8px 24px rgba(70,0,115,.06);--shadow-lg:0 24px 60px rgba(70,0,115,.25);
  --space:8px;
  /* Control Tower token names */
  --black:var(--surface);--white:var(--surface);
  --g900:var(--ink);--g700:var(--ink-2);--g500:var(--muted);--g300:var(--faint);--g200:var(--line);--g100:var(--line-2);--g50:var(--wash);
  --sh:var(--shadow);--p-dim:var(--purple-dim);--r-dim:var(--red-dim);--r-bd:var(--red-border);--a-bd:var(--amber-border);--g-bd:var(--green-border);
  /* Sub4Me token names */
  --bg:var(--canvas);--panel:var(--surface);--mut:var(--muted);--brand:var(--purple);--brand-dim:var(--purple-dim);
  --ok:var(--green);--ok-dim:var(--green-dim);--warn:var(--amber);--warn-dim:var(--amber-dim);--bad:var(--red);--bad-dim:var(--red-dim);
}
/* Dark follows the system unless the host pins a theme with data-theme on <html> (the app does, so Spaces follow its Appearance setting). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#120820;--surface:#1c1030;--ink:#f5efff;--ink-2:#d6c9ec;--muted:#a597c2;--faint:#62517f;--line:#312247;--line-2:#25193a;--wash:#201437;
  --purple:#BE82FF;--purple-mid:#DCAFFF;--purple-deep:#E6DCFF;--purple-dim:rgba(190,130,255,.14);--purple-border:rgba(190,130,255,.34);--purple-light:#2e1650;
  --green:#3ddc97;--green-dim:rgba(61,220,151,.13);--green-border:rgba(61,220,151,.3);
  --amber:#ffb454;--amber-dim:rgba(255,180,84,.13);--amber-border:rgba(255,180,84,.3);
  --red:#ff7a70;--red-dim:rgba(255,122,112,.13);--red-border:rgba(255,122,112,.3);
  --blue:#7fa2ff;--blue-dim:rgba(127,162,255,.14);--blue-border:rgba(127,162,255,.32);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#120820;--surface:#1c1030;--ink:#f5efff;--ink-2:#d6c9ec;--muted:#a597c2;--faint:#62517f;--line:#312247;--line-2:#25193a;--wash:#201437;
  --purple:#BE82FF;--purple-mid:#DCAFFF;--purple-deep:#E6DCFF;--purple-dim:rgba(190,130,255,.14);--purple-border:rgba(190,130,255,.34);--purple-light:#2e1650;
  --green:#3ddc97;--green-dim:rgba(61,220,151,.13);--green-border:rgba(61,220,151,.3);
  --amber:#ffb454;--amber-dim:rgba(255,180,84,.13);--amber-border:rgba(255,180,84,.3);
  --red:#ff7a70;--red-dim:rgba(255,122,112,.13);--red-border:rgba(255,122,112,.3);
  --blue:#7fa2ff;--blue-dim:rgba(127,162,255,.14);--blue-border:rgba(127,162,255,.32);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}
:root[data-theme="light"]{color-scheme:light}

/* ---- Base ---- */
body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* Calmer labels: no all-caps micro headings, also where pages style them inline. */
[style*="text-transform:uppercase"]{text-transform:none!important;letter-spacing:0!important}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}
.tag,.mv,.bv,.kval,.dv,.tbl td,.num,.hdr-stat-val{font-variant-numeric:tabular-nums}

/* ---- Cards and tiles (both Spaces) ---- */
.mc,.card,.ns,.dtier,.pc,.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mc{padding:20px 22px}
.card,.ns{padding:24px;margin-bottom:16px}
.dtier,.pc,.cc{padding:18px}
.ns{border-top:1px solid var(--line)}
.ml,.k{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.mv,.v{font-family:var(--font);font-size:30px;font-weight:650;letter-spacing:-.025em;color:var(--ink);line-height:1.15}
.md,.s{font-size:12px}
.sh{font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);margin:36px 0 14px}
.chd{font-size:15px;font-weight:650;color:var(--ink)}

/* Status tags */
.tag{font-family:var(--font);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;border-width:1px}
.src{border-radius:99px;font-weight:600}

/* Tables */
.tbl th,table th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 14px}
.tbl td,table td{padding:14px;border-bottom:1px solid var(--line-2)}
.tbl{border-collapse:collapse}

/* Bars */
.bt{height:6px;border-radius:99px;background:var(--line-2)}
.bf{border-radius:99px}
.bar{background:var(--line-2)}

/* Alerts, notes and callouts */
.ab{border-radius:var(--radius);border-width:1px;border-left-width:1px;padding:18px 20px}
.ab-w{border-color:var(--amber-border)}.ab-i{border-color:var(--purple-border)}.ab-s{border-color:var(--blue-border)}.ab-ok{border-color:var(--green-border)}

/* Forms and buttons */
input,select,textarea{font-family:var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px var(--purple-dim)}
/* Calm Bento buttons: one family. Primary = Accenture purple on white text, secondary = soft tint, quiet = neutral. */
button.primary,button.ghost,button.small{font:inherit;font-size:13px;font-weight:550;line-height:1.2;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
button.primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 1px 2px rgba(70,0,115,.18)}
button.small{padding:5px 11px;font-size:12px;background:var(--purple-dim);border-color:var(--purple-border);color:var(--purple-mid)}
button.ghost:hover:not(:disabled),button.small:hover:not(:disabled){border-color:var(--purple-border);background:var(--purple-dim);color:var(--purple-mid)}
button.primary:hover:not(:disabled){background:var(--purple-mid);border-color:var(--purple-mid)}
button.primary:disabled,button.ghost:disabled,button.small:disabled{opacity:.5;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}:root:not([data-theme="light"]) button.small,:root:not([data-theme="light"]) button.ghost:hover:not(:disabled){color:var(--purple)}}
:root[data-theme="dark"] button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}
:root[data-theme="dark"] button.small,:root[data-theme="dark"] button.ghost:hover:not(:disabled){color:var(--purple)}

/* Bento: the first tile of a KPI row carries the accent wash. */
.mr>.mc:first-child,.s4m .grid>.card:first-child{background:linear-gradient(135deg,var(--purple-light),var(--surface) 78%)}

/* Overlay (agent list) */
.ag-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 30px}
.ag-ov{background:rgba(14,12,20,.55);backdrop-filter:blur(4px);z-index:200}
.ag-x,.ag-tools input,.ag-tools button{border-radius:var(--radius-s)}
.ag-x{background:var(--surface);color:var(--ink);border-color:var(--line)}
.ag-tools button{background:var(--purple-dim);color:var(--purple);border-color:var(--purple-border)}
.ag-tbl th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ag-tbl td{padding:10px 8px}

/* ---- Control Tower shell ---- */
.ct .hdr{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:60px;padding:0 32px}
.ct .hdr-title{color:var(--ink);font-size:15px;font-weight:650}
.ct .hdr-sub{font-family:var(--font);font-size:11px;letter-spacing:.01em;color:var(--muted)}
.ct .hdr-div{background:var(--line)}
.ct .acc-mark{color:var(--purple)}
.ct .hdr-stat-val{color:var(--ink);font-family:var(--font);font-weight:600}
.ct .hdr-stat-lbl{color:var(--muted);letter-spacing:.02em;text-transform:none;font-size:11px}
.ct .live{color:var(--muted);font-family:var(--font)}
.ct .tbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.ct .tb{padding:16px 14px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.ct .tb:hover:not(.on){color:var(--ink)}
.ct .tb.on{color:var(--purple);border-bottom:2px solid var(--purple);font-weight:600}
.ct .tnum{display:none}
.ct .pg{padding:40px 32px 64px;max-width:1320px;margin:0 auto}
.ct .mr{gap:16px;margin-bottom:32px}
.ct .g2,.ct .g3,.ct .g4{gap:20px}
.ct .br{margin-bottom:14px}
.ct .krow,.ct .srow,.ct .ci{padding:14px 0}
.ct .kdesc,.ct .sdesc,.ct .abod{line-height:1.65}
.ct .fn{border-radius:99px;font-family:var(--font)}
.ct .ns-fml{font-family:var(--font);border-radius:var(--radius-s)}
.ct .dm{font-family:var(--font);letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:500}

/* ---- Sub4Me shell ---- */
.s4m header{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 32px;min-height:60px;box-sizing:border-box}
.s4m .logo{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.5}
.s4m header .s{font-size:11px;letter-spacing:.01em;line-height:1.5;margin-top:1px;color:var(--muted)}
.s4m{font-size:13px}
.s4m .demo{padding:8px 32px}
.s4m nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.s4m nav button{padding:16px 14px 14px;font-size:13px;font-weight:500;line-height:normal;border-bottom:2px solid transparent}
.s4m nav button:hover:not([aria-selected=true]){color:var(--ink)}
.s4m nav button[aria-selected=true]{font-weight:600;border-bottom-color:var(--purple)}
.s4m main{padding:40px 32px 64px;max-width:1320px}
.s4m .grid{gap:16px;margin-bottom:28px}
.s4m h2{font-size:13px;font-weight:600;margin:36px 0 14px}
.s4m .row{gap:20px}
.s4m .months span{border-radius:8px 8px 0 0}
.s4m .bar{height:6px}
@media(max-width:640px){.ct .pg,.s4m main{padding:24px 16px 48px}.ct .hdr,.ct .tbar,.s4m header,.s4m nav{padding-left:16px;padding-right:16px}}
.s4m .months.stack div{cursor:default}
.s4m .months.stack .col{display:flex;flex-direction:column-reverse;width:100%;flex:1;justify-content:flex-start;gap:1px}
.s4m .months.stack .col i{display:block;width:100%;min-height:1px}
.s4m .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11px;color:var(--mut)}
.s4m .legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.s4m #products tbody tr{cursor:pointer}
.s4m #products tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #products tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m #contracts tbody tr,.s4m #offers tbody tr{cursor:pointer}
.s4m #contracts tbody tr[aria-selected="true"],.s4m #offers tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #contracts tbody tr:focus-visible,.s4m #offers tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .detail{margin-top:12px}
.s4m .detail .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
.s4m .detail .head .t{font-size:18px;font-weight:600}
.s4m .detail .hint{margin:0 0 4px}
.s4m .detail .secs{display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px}
.s4m .detail h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .detail dl{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:5px 12px;font-size:13px}
.s4m .detail dt{color:var(--muted)}
.s4m .detail dd{margin:0;overflow-wrap:anywhere}
.s4m .detail .lines{margin-top:16px;overflow-x:auto}
.s4m .detail .note{margin-top:14px;font-size:13px;color:var(--muted)}
.s4m #product-detail{margin-top:16px}
.s4m #product-detail .dgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0 18px}
.s4m #product-detail .dgrid .v{font-size:20px;font-weight:600}
.s4m #offers td:not(:nth-child(2)),.s4m #offers th,.s4m #contracts td:not(:nth-child(2)):not(:nth-child(3)){white-space:nowrap}

/* Skill Marketplace: impact, governance, gaps and the skill detail view */
.s4m .smx-kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:6px}
.s4m .smx-kpis .v{font-size:24px;font-weight:600}
.s4m tr[data-skill],.s4m article.sk[data-skill]{cursor:pointer}
.s4m tr[data-skill]:hover{background:var(--line-2)}
.s4m tr[data-skill]:focus-visible,.s4m article.sk[data-skill]:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .smx-spark{display:inline-flex;align-items:flex-end;gap:3px;height:28px;min-width:72px}
.s4m .smx-spark i{display:block;width:8px;border-radius:2px;background:var(--brand);opacity:.45}
.s4m .smx-spark i.cur{opacity:.2}
.s4m .smx-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.s4m .smx-title{font-size:20px;font-weight:600}
.s4m .smx-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.s4m .smx-grid h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .smx-dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:13px}
.s4m .smx-dl dt{color:var(--muted)}
.s4m .smx-dl dd{margin:0;overflow-wrap:anywhere}
.s4m .smx-list{margin:4px 0 0;padding-left:18px;font-size:13px}
.s4m .smx-list li{margin:3px 0}
.s4m #detail-back{margin-bottom:10px}
.s4m .smx-rate{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.s4m .smx-stars{display:inline-block;letter-spacing:1px;line-height:1;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--faint) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.s4m .smx-stars-sm{font-size:12px}
.s4m .smx-line{margin:2px 0 6px;font-size:13px}
.s4m .smx-big{font-size:32px;font-weight:600;line-height:1.1}
.s4m .smx-bars{display:grid;gap:5px;margin-top:10px;font-size:12px}
.s4m .smx-bar{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:8px;color:var(--muted)}
.s4m .smx-bar i{display:block;height:8px;border-radius:4px;background:var(--line)}
.s4m .smx-bar i b{display:block;height:100%;border-radius:4px;background:var(--amber)}
.s4m .smx-bar .num{text-align:right}
</style>
<style>
*{box-sizing:border-box}
body{margin:0;font-size:13px;line-height:1.5}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em}.logo b{color:var(--purple)}
.sub{color:var(--muted);font-size:12px}
.demo{padding:7px 22px;background:var(--amber-dim);color:var(--amber);border-bottom:1px solid var(--line);font-size:12px}
main{max-width:1320px;margin:0 auto;padding:20px 22px 60px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:var(--radius-s);font:inherit;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--purple)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--purple);border-color:var(--purple);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
h2{font-size:15px;margin:0 0 4px;letter-spacing:-.01em}h3{font-size:12px;margin:14px 0 6px;color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin:0 0 12px}
.cols{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;margin:0;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--ink-2);background:var(--line-2)}
.tag.red,.tag.high,.tag.fail{color:var(--red);background:var(--red-dim);border-color:var(--red-border)}
.tag.amber,.tag.medium,.tag.warn{color:var(--amber);background:var(--amber-dim);border-color:var(--amber-border)}
.tag.ok,.tag.low{color:var(--green);background:var(--green-dim);border-color:var(--green-border)}
.tag.tool{color:var(--purple);background:var(--purple-dim);border-color:var(--purple-border)}
.stages{list-style:none;margin:0;padding:0}
.stage{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);align-items:start}
.stage:last-child{border-bottom:0}.stage small{display:block;color:var(--muted)}
.ic{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.stage.run .ic{border-color:var(--purple);border-top-color:transparent;animation:spin .8s linear infinite}
.stage.ok .ic{background:var(--green);border-color:var(--green);color:var(--surface)}
.stage.warn .ic{background:var(--amber);border-color:var(--amber);color:var(--surface)}
.stage.fail .ic{background:var(--red);border-color:var(--red);color:var(--surface)}
.stage.wait{opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.stage.run .ic{animation:none;border-top-color:var(--purple)}}
.term{background:var(--wash);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;margin:10px 0 0;max-height:300px;overflow:auto;color:var(--ink)}
.term .p{color:var(--green)}.term .m{color:var(--red)}.term .c{color:var(--muted)}
.verdict{border-radius:var(--radius);padding:14px 16px;margin-top:14px;border:1px solid var(--line)}
.verdict.ok{background:var(--green-dim);border-color:var(--green-border)}.verdict.warn{background:var(--amber-dim);border-color:var(--amber-border)}.verdict.fail{background:var(--red-dim);border-color:var(--red-border)}
.verdict b{font-size:15px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0;align-items:center}
.hist{margin:0;padding:0;list-style:none}.hist li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}.hist li:last-child{border-bottom:0}
.hist small{color:var(--muted);margin-left:auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.speed{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.speed select{padding:5px 8px;width:auto}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
</style>

<script id="io-model">
const DAY_MS = 86400000;
const PLAYBOOKS = {
  'renew-certificate': { title: 'Renew and deploy a certificate', status: 'approved', kind: 'cert', base: 1 },
  'update-dns-record': { title: 'Change a DNS record', status: 'approved', kind: 'dns', base: 1 },
  'patch-vm': { title: 'Patch and restart a VM', status: 'approved', kind: 'vm', base: 2 },
  'move-vm': { title: 'Move a VM to another region', status: 'approved', kind: 'vm', base: 3 },
  'rotate-secret': { title: 'Rotate a secret', status: 'draft', kind: 'vm', base: 2 },
};
const STATES = ['planned', 'in_review', 'approved', 'in_window', 'done'];
const ORCHESTRATION = [
  { id: 'trigger', title: 'Trigger', tool: 'n8n', detail: 'Webhook or schedule (for example: certificate expires in 30 days)' },
  { id: 'ticket', title: 'Create task and ticket', tool: 'n8n', detail: 'Change ticket in the ITSM, task in the Space' },
  { id: 'check', title: 'Pre-check in check mode', tool: 'AWX', detail: 'Playbook with --check --diff, dependencies, conflicts' },
  { id: 'approve', title: 'Approval (four eyes)', tool: 'n8n', detail: 'Request to the approvers in Teams; the answer starts the next step' },
  { id: 'window', title: 'Wait for the downtime window', tool: 'n8n', detail: 'Start only inside the approved window' },
  { id: 'run', title: 'Run the playbook', tool: 'AWX', detail: 'Job template with checked parameters, snapshot first' },
  { id: 'verify', title: 'Verification', tool: 'AWX', detail: 'Health and certificate checks, rollback on failure' },
  { id: 'evidence', title: 'Evidence and notification', tool: 'n8n', detail: 'File the log, inform customer and team' },
];
/** How many orchestration steps are done in each task state. */
const STEPS_DONE = { planned: 2, in_review: 3, approved: 5, in_window: 6, done: 8 };

const toDay = (iso) => String(iso).slice(0, 10);
const daysBetween = (a, b) => Math.round((Date.parse(toDay(b)) - Date.parse(toDay(a))) / DAY_MS);
const hoursOf = (win) => (Date.parse(win[1] + ':00Z') - Date.parse(win[0] + ':00Z')) / 3600000;
const by = (list) => new Map(list.map((x) => [x.id, x]));

function certStatus(cert, asOf) {
  const left = daysBetween(asOf, cert.notAfter);
  const status = left < 0 ? 'expired' : left <= 7 ? 'critical' : left <= 30 ? 'soon' : left <= 90 ? 'watch' : 'ok';
  return { daysLeft: left, status };
}

/** Everything that runs on top of a VM (reverse dependencies, transitive). */
function dependents(data, vmId) {
  const out = [];
  const seen = new Set([vmId]);
  const queue = [vmId];
  while (queue.length) {
    const cur = queue.shift();
    for (const v of data.vms) if (v.dependsOn === cur && !seen.has(v.id)) { seen.add(v.id); out.push(v.id); queue.push(v.id); }
  }
  return out;
}

function findings(data) {
  const out = [];
  for (const c of data.certs) {
    const s = certStatus(c, data.asOf);
    if (s.status === 'expired') out.push({ severity: 'red', kind: 'cert', target: c.id, template: 'renew-certificate', title: `${c.name} has expired`, detail: `Invalid for ${-s.daysLeft} days (${c.notAfter}).` });
    else if (s.status === 'critical' || s.status === 'soon') out.push({ severity: s.status === 'critical' ? 'red' : 'amber', kind: 'cert', target: c.id, template: 'renew-certificate', title: `${c.name} expires in ${s.daysLeft} days`, detail: `Valid until ${c.notAfter}.` });
  }
  for (const v of data.vms) {
    if (v.criticalPatches > 0) out.push({ severity: 'red', kind: 'vm', target: v.id, template: 'patch-vm', title: `${v.id}: ${v.criticalPatches} critical patches open`, detail: `${v.pendingPatches} patches in total, last patch ${v.lastPatch}.` });
    if (daysBetween(v.lastBackup, data.asOf) >= 2) out.push({ severity: 'amber', kind: 'vm', target: v.id, template: null, title: `${v.id}: backup is ${daysBetween(v.lastBackup, data.asOf)} days old`, detail: 'Make sure there is a fresh backup before any change.' });
  }
  const rank = { red: 0, amber: 1 };
  return out.sort((a, b) => rank[a.severity] - rank[b.severity]);
}

function overlaps(a, b) { return a[0] < b[1] && b[0] < a[1]; }

/** Validate a change request and plan it. Returns { ok, errors, ... }. */
function planTask(data, req) {
  const errors = [];
  const pb = PLAYBOOKS[req.template];
  if (!pb) return { ok: false, errors: ['Unknown task template.'] };
  if (pb.status !== 'approved') errors.push(`The playbook "${req.template}" is a draft and not approved for production.`);
  const inventory = { cert: data.certs, dns: data.dns, vm: data.vms }[pb.kind];
  const target = by(inventory).get(req.target);
  if (!target) return { ok: false, errors: [...errors, `Target "${req.target}" is not in the inventory (only known targets are allowed).`] };
  const vmMap = by(data.vms);
  const customer = by(data.customers).get(target.customer);
  const win = req.window;
  if (!win || !win[0] || !win[1] || win[0] >= win[1]) errors.push('The downtime window is invalid.');
  else {
    if (toDay(win[0]) <= data.asOf && !['in_window', 'done'].includes(req.state)) errors.push('The window must be in the future.');
    if (hoursOf(win) > 8) errors.push('A downtime window may last 8 hours at most.');
    for (const f of data.freezes) {
      if ((f.customer === null || f.customer === target.customer) && toDay(win[0]) <= f.to && toDay(win[1]) >= f.from) errors.push(`The window falls into a freeze: ${f.reason} (${f.from} to ${f.to}).`);
    }
  }
  const affectedVmIds = pb.kind === 'cert' ? [...target.vmIds] : pb.kind === 'dns' ? (target.vmId ? [target.vmId] : []) : [target.id];
  const primaryVm = vmMap.get(affectedVmIds[0]);
  const env = primaryVm ? primaryVm.env : 'PRD';
  const checks = [];
  const diff = [];
  const downtime = { minutes: 0, note: '' };
  const extraSteps = [];
  let risk = pb.base + (env === 'PRD' ? 1 : 0) + (primaryVm && primaryVm.role === 'HANA database' ? 1 : 0);

  if (pb.kind === 'cert') {
    const s = certStatus(target, data.asOf);
    checks.push({ label: 'Remaining validity', status: s.status === 'ok' ? 'warn' : 'ok', detail: s.daysLeft < 0 ? `Expired ${-s.daysLeft} days ago.` : `${s.daysLeft} days left, renewal ${s.status === 'ok' ? 'not needed yet' : 'makes sense'}.` });
    checks.push({ label: 'Certificate chain', status: 'ok', detail: `Issuer ${target.issuer}, intermediate certificates complete.` });
    checks.push({ label: 'Key', status: 'ok', detail: `New key ${target.key}, fits the purpose.` });
    const names = data.dns.filter((d) => affectedVmIds.includes(d.vmId)).map((d) => d.name);
    checks.push({ label: 'Names in the certificate', status: 'ok', detail: names.length ? `Covers ${names.join(', ')}.` : 'No DNS names linked.' });
    diff.push({ sign: ' ', text: `certificate: ${target.name}` }, { sign: '-', text: `not_after: ${target.notAfter}` }, { sign: '+', text: `not_after: ${new Date(Date.parse(toDay(win && win[0] ? win[0] : data.asOf) + 'T00:00:00Z') + 365 * DAY_MS).toISOString().slice(0, 10)}` }, { sign: ' ', text: `deploy_to: ${affectedVmIds.join(', ')}` }, { sign: '+', text: 'reload: web dispatcher / application server (no restart)' });
    downtime.minutes = 0; downtime.note = 'No outage: the services reload the certificate.';
  } else if (pb.kind === 'dns') {
    const nv = req.newValue || (req.params && req.params.newValue) || '';
    const ttl = Number(req.ttl ?? (req.params && req.params.ttl) ?? target.ttl);
    if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(nv) && target.type === 'A') errors.push('The new value must be a valid IPv4 address.');
    if (!Number.isFinite(ttl) || ttl < 60 || ttl > 86400) errors.push('The TTL must be between 60 and 86400 seconds.');
    const users = data.dns.filter((d) => d.type === 'CNAME' && d.value === target.name);
    checks.push({ label: 'Users of the name', status: users.length ? 'warn' : 'ok', detail: users.length ? `${users.length} alias records point to ${target.name}: ${users.map((u) => u.name).join(', ')}.` : 'No alias records.' });
    checks.push({ label: 'TTL before the switch', status: target.ttl > 300 ? 'warn' : 'ok', detail: target.ttl > 300 ? `Current TTL ${target.ttl} s: lower it to 300 s first, otherwise the old address stays visible for up to ${Math.round(target.ttl / 60)} minutes.` : 'The TTL is already low.' });
    diff.push({ sign: ' ', text: `record: ${target.name} (${target.type})` }, { sign: '-', text: `value: ${target.value}   ttl: ${target.ttl}` }, { sign: '+', text: `value: ${nv || '(new)'}   ttl: ${ttl}` });
    downtime.minutes = 0; downtime.note = `Name resolution switches within up to ${Math.round(target.ttl / 60)} minutes (TTL).`;
    if (target.ttl > 300) extraSteps.push({ id: 'ttl', title: 'Lower the TTL to 300 s beforehand', when: 'at least one TTL before the window', playbook: 'update-dns-record' });
    risk += users.length ? 1 : 0;
  } else if (req.template === 'patch-vm') {
    const backupAge = daysBetween(target.lastBackup, data.asOf);
    checks.push({ label: 'Backup', status: backupAge >= 2 ? 'fail' : 'ok', detail: backupAge >= 2 ? `Last backup ${backupAge} days ago: take a new backup before patching.` : `Last backup ${target.lastBackup}.` });
    checks.push({ label: 'Open patches', status: target.criticalPatches ? 'warn' : 'ok', detail: `${target.pendingPatches} open, ${target.criticalPatches} of them critical.` });
    const dep = dependents(data, target.id);
    checks.push({ label: 'Dependent systems', status: dep.length ? 'warn' : 'ok', detail: dep.length ? `${dep.join(', ')} stop while this VM restarts.` : 'No dependent systems.' });
    diff.push({ sign: ' ', text: `vm: ${target.id} (${target.os})` }, { sign: '-', text: `patches_pending: ${target.pendingPatches}` }, { sign: '+', text: 'patches_pending: 0' }, { sign: '+', text: 'reboot: required' });
    downtime.minutes = target.role === 'HANA database' ? 25 : 10; downtime.note = `Restart, about ${downtime.minutes} minutes${dep.length ? ' (dependent systems affected)' : ''}.`;
    if (backupAge >= 2) errors.push('The backup is too old: the playbook only runs with a backup from the last 24 hours.');
  } else {
    const region = by(data.regions).get(req.targetRegion || (req.params && req.params.targetRegion));
    if (!region) errors.push('The target region is not allowed (only regions from the list).');
    else {
      const cross = region.hyperscaler !== target.hyperscaler;
      checks.push({ label: 'Capacity in the target region', status: region.freePct < 20 ? 'warn' : 'ok', detail: `${region.label}: ${region.freePct} % free${region.freePct < 20 ? ', tight' : ''}.` });
      checks.push({ label: 'Hyperscaler', status: cross ? 'fail' : 'ok', detail: cross ? 'Changing the hyperscaler is a migration project, not a standard playbook.' : 'Move within the same hyperscaler.' });
      if (cross) errors.push('Changing the hyperscaler is not allowed with this playbook.');
      if (region.id === target.region) errors.push('The target region is the same as the current region.');
      diff.push({ sign: ' ', text: `vm: ${target.id}` }, { sign: '-', text: `region: ${target.region}` }, { sign: '+', text: `region: ${region.id}` }, { sign: '+', text: 'snapshot: before the change' });
    }
    const backupAge = daysBetween(target.lastBackup, data.asOf);
    checks.push({ label: 'Backup', status: backupAge >= 2 ? 'fail' : 'ok', detail: backupAge >= 2 ? `Last backup ${backupAge} days ago.` : `Last backup ${target.lastBackup}.` });
    if (backupAge >= 2) errors.push('The backup is too old: the playbook only runs with a backup from the last 24 hours.');
    const dep = dependents(data, target.id);
    checks.push({ label: 'Dependent systems', status: dep.length ? 'warn' : 'ok', detail: dep.length ? `${dep.join(', ')} depend on this VM.` : 'No dependent systems.' });
    const recs = data.dns.filter((d) => d.vmId === target.id);
    checks.push({ label: 'DNS', status: recs.length ? 'warn' : 'ok', detail: recs.length ? `${recs.map((r) => r.name).join(', ')} must point to the new address after the move.` : 'No DNS records affected.' });
    downtime.minutes = 90; downtime.note = 'About 90 minutes (snapshot, move, start, verification).';
    for (const r of recs) {
      if (r.ttl > 300) extraSteps.push({ id: `ttl-${r.id}`, title: `Lower the TTL of ${r.name} to 300 s beforehand`, when: 'one day before the window', playbook: 'update-dns-record' });
      extraSteps.push({ id: `dns-${r.id}`, title: `Point ${r.name} to the new address after the move`, when: 'right after the move', playbook: 'update-dns-record' });
    }
  }

  // conflicts with other open tasks of the same customer
  const conflicts = win && win[0] && win[1] ? (data.tasks ?? []).filter((t) => t.id !== req.id && t.customer === target.customer && t.state !== 'done' && overlaps(win, t.window)) : [];
  checks.push({ label: 'Conflicts in the change calendar', status: conflicts.length ? 'warn' : 'ok', detail: conflicts.length ? `Overlaps with ${conflicts.map((c) => c.id).join(', ')}.` : 'No overlap with other tasks of this customer.' });

  const affectedVmsAll = [...new Set(affectedVmIds.flatMap((id) => [id, ...(pb.kind === 'cert' || pb.kind === 'dns' ? [] : dependents(data, id))]))];
  const affectedDns = data.dns.filter((d) => affectedVmsAll.includes(d.vmId)).map((d) => d.name);
  const riskLevel = risk >= 5 ? 'high' : risk >= 3 ? 'medium' : 'low';
  const approvalsNeeded = env === 'PRD' || riskLevel === 'high' ? 2 : 1;
  return {
    ok: errors.length === 0,
    errors,
    template: req.template,
    playbook: { id: req.template, title: pb.title },
    target: target.id,
    customer: customer ? customer.name : target.customer,
    env,
    risk: riskLevel,
    riskScore: risk,
    approvalsNeeded,
    approvalReason: approvalsNeeded === 2 ? (env === 'PRD' ? 'Production: two approvals (four eyes plus change manager).' : 'High risk: two approvals.') : 'One approval is enough (no production system, low risk).',
    checks,
    diff,
    downtime,
    blast: { vms: affectedVmsAll, dns: affectedDns, customers: [customer ? customer.name : target.customer] },
    conflicts: conflicts.map((c) => c.id),
    steps: [...extraSteps, ...ORCHESTRATION.map((s) => ({ id: s.id, title: s.title, tool: s.tool, detail: s.detail }))],
  };
}

/** What the next approval has to look like (two approvals: four eyes plus the change manager). */
function approvalHint(task, data) {
  const plan = planTask(data, { ...task, ...(task.params ?? {}) });
  const have = (task.approvals ?? []).map((id) => by(data.people).get(id)).filter(Boolean);
  if (!plan.ok) return '';
  if (have.length >= plan.approvalsNeeded) return 'All approvals are in.';
  if (plan.approvalsNeeded === 1) return 'One approval from anyone except the requester.';
  if (have.length === 0) return 'First approval: anyone except the requester. Two approvals need one change manager and one other person.';
  return have[0].role === 'Change Manager' ? 'Second approval: a person who is not a change manager, for example Security or Operations (the change manager has already approved).' : 'Second approval: a change manager (four eyes plus change manager).';
}

/** May this person approve? Technical enforcement of the four-eyes rule. */
function canApprove(task, personId, data) {
  const person = by(data.people).get(personId);
  if (!person) return { ok: false, reason: 'Unknown person.' };
  if (task.state !== 'in_review') return { ok: false, reason: 'Approval is only possible in the "In review" phase.' };
  if (task.requester === personId) return { ok: false, reason: 'The requester must not approve their own change.' };
  const plan = planTask(data, { ...task, ...(task.params ?? {}) });
  if ((task.approvals ?? []).includes(personId)) return { ok: false, reason: 'This person has already approved.' + (plan.ok ? ' ' + approvalHint(task, data) : '') };
  if (!plan.ok) return { ok: false, reason: `The plan has errors: ${plan.errors[0]}` };
  const have = (task.approvals ?? []).map((id) => by(data.people).get(id));
  if (plan.approvalsNeeded === 2 && have.length === 1) {
    const firstIsCm = have[0].role === 'Change Manager', isCm = person.role === 'Change Manager';
    if (!firstIsCm && !isCm) return { ok: false, reason: 'The second approval must come from a different role than the first: the change manager.' };
    if (firstIsCm && isCm) return { ok: false, reason: 'The second approval must come from a different role than the first: the change manager has already approved, so Security or Operations is needed.' };
  }
  return { ok: true, reason: '' };
}

/** A simulated playbook run: Ansible-style output and a recap. No system is touched. */
function simulateRun(plan) {
  const tasks = plan.diff.filter((d) => d.sign === '+').map((d) => d.text.replace(/\s{2,}/g, ' '));
  const lines = [`PLAY [${plan.playbook.title}] ${'*'.repeat(20)}`, 'TASK [Snapshot and health check before] ok'];
  tasks.forEach((t) => lines.push(`TASK [${t}] changed`));
  lines.push('TASK [Verification after the change] ok', '', `PLAY RECAP  ok=2  changed=${tasks.length}  failed=0  rolled_back=0`);
  return { lines, recap: { ok: 2, changed: tasks.length, failed: 0 } };
}

(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('io-data').textContent);
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var inHost = window.parent !== window;
  var S = { run: null, history: [], speed: 'normal' };
  var timers = [];
  var person = function (id) { return D.people.filter(function (p) { return p.id === id; })[0]; };

  /* ---------- state that survives a trip to another Space ---------- */
  function saveState() { if (inHost) window.parent.postMessage({ type: 'wb:state', state: { history: S.history.slice(0, 8), speed: S.speed } }, '*'); }

  /* ---------- the checks of a request ---------- */
  var PB_FILE = { 'renew-certificate': 'renew_certificate.yml', 'update-dns-record': 'update_dns_record.yml', 'patch-vm': 'patch_vm.yml', 'move-vm': 'move_vm.yml', 'rotate-secret': 'rotate_secret.yml' };

  /** Validate and shape a request that arrived from another Space. Anything unexpected is dropped. */
  function cleanRequest(p) {
    if (!p || typeof p !== 'object' || (p.mode !== 'pre' && p.mode !== 'post') || !p.task || typeof p.task !== 'object') return null;
    var t = p.task, str = function (v, n) { return typeof v === 'string' ? v.slice(0, n) : ''; };
    var win = Array.isArray(t.window) ? [str(t.window[0], 16), str(t.window[1], 16)] : null;
    var params = t.params && typeof t.params === 'object' ? { newValue: str(t.params.newValue, 40), ttl: Number(t.params.ttl) || undefined, targetRegion: str(t.params.targetRegion, 30) } : {};
    return { mode: p.mode, speed: p.speed === 'fast' ? 'fast' : 'normal', ticket: str(p.ticket, 20),
      task: { id: str(t.id, 20), template: str(t.template, 40), target: str(t.target, 40), customer: str(t.customer, 20), window: win, requester: str(t.requester, 10), state: 'planned', params: params } };
  }
  function planFor(task) { return planTask(D, Object.assign({}, task, task.params || {}, { id: task.id })); }

  /** The stages of a pre-check: one per check of the plan, then the playbook in check mode. */
  function preStages(task, plan) {
    var list = [{ label: 'Read the change request', status: 'ok', detail: task.id + ' · ' + (plan.playbook ? plan.playbook.title : task.template) + ' · target ' + task.target }];
    if (!plan.checks) { list.push({ label: 'Inventory', status: 'fail', detail: plan.errors[0] || 'The request is not valid.' }); return { stages: list, lines: ['Request rejected: ' + (plan.errors[0] || 'invalid')] }; }
    plan.checks.forEach(function (c) { list.push({ label: c.label, status: c.status === 'fail' ? 'fail' : c.status === 'warn' ? 'warn' : 'ok', detail: c.detail }); });
    var lines = [];
    var file = PB_FILE[task.template] || 'playbook.yml';
    lines.push('$ ansible-playbook ' + file + ' --check --diff -e target=' + task.target);
    lines.push('');
    lines.push('PLAY [' + plan.playbook.title + '] ' + '*'.repeat(20));
    lines.push('TASK [Gathering facts] ok: [' + task.target + ']');
    var adds = plan.diff.filter(function (d) { return d.sign === '+'; });
    adds.forEach(function (d) { lines.push('TASK [' + d.text.replace(/\s{2,}/g, ' ') + '] changed: [' + task.target + ']   (check mode, not applied)'); });
    lines.push('');
    plan.diff.forEach(function (d) { lines.push(d.sign + ' ' + d.text); });
    lines.push('');
    lines.push('PLAY RECAP  ok=2  changed=' + adds.length + '  failed=0  (check mode: nothing was changed)');
    list.push({ label: 'Playbook in check mode (AWX)', status: plan.ok ? 'ok' : 'fail', detail: plan.ok ? adds.length + ' changes would be made, none applied.' : 'Blocked: ' + plan.errors[0], playbook: true });
    return { stages: list, lines: lines };
  }

  /** The stages of a post-check: is the target healthy after the change? */
  function postStages(task, plan) {
    var pb = PLAYBOOKS[task.template] || { kind: 'vm' };
    var base = plan.blast ? plan.blast : { vms: [], dns: [] };
    var list = [{ label: 'Read the change request', status: 'ok', detail: task.id + ' · ' + (plan.playbook ? plan.playbook.title : task.template) + ' · target ' + task.target }];
    if (pb.kind === 'cert') {
      var until = new Date(Date.parse((task.window && task.window[0] ? task.window[0].slice(0, 10) : D.asOf) + 'T00:00:00Z') + 365 * 86400000).toISOString().slice(0, 10);
      list.push({ label: 'Service answers on TLS', status: 'ok', detail: 'Handshake with the new certificate succeeds on all ' + Math.max(1, base.vms.length) + ' affected system(s).' });
      list.push({ label: 'New certificate', status: 'ok', detail: 'Valid until ' + until + ' (365 days).' });
      list.push({ label: 'Certificate chain', status: 'ok', detail: 'Chain complete, issuer trusted.' });
    } else if (pb.kind === 'dns') {
      list.push({ label: 'Name resolution', status: 'ok', detail: 'The record resolves to the new value from three resolvers.' });
      list.push({ label: 'Alias records', status: 'ok', detail: 'Alias records still resolve.' });
    } else {
      list.push({ label: 'VM is running', status: 'ok', detail: 'Heartbeat and SAP health check are green.' });
      list.push({ label: 'Patch level', status: 'ok', detail: 'No open critical patches, reboot completed.' });
    }
    list.push({ label: 'Dependent systems', status: 'ok', detail: base.vms.length > 1 ? base.vms.slice(1).join(', ') + ' are running.' : 'No dependent systems.' });
    list.push({ label: 'Monitoring', status: 'ok', detail: 'The alert for this target is cleared.' });
    var file = (PB_FILE[task.template] || 'playbook.yml').replace('.yml', '_verify.yml');
    var lines = ['$ ansible-playbook ' + file + ' --check -e target=' + task.target, '', 'PLAY [Verify: ' + (plan.playbook ? plan.playbook.title : task.template) + '] ' + '*'.repeat(14), 'TASK [Gathering facts] ok: [' + task.target + ']'];
    list.slice(1).forEach(function (s) { lines.push('TASK [' + s.label + '] ok'); });
    lines.push('', 'PLAY RECAP  ok=' + list.length + '  changed=0  failed=0  (no drift against the plan)');
    list.push({ label: 'Verification playbook (AWX)', status: 'ok', detail: 'No drift against the plan.', playbook: true });
    return { stages: list, lines: lines };
  }

  /* ---------- running a check ---------- */
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function startRun(req, from) {
    clearTimers();
    var plan = planFor(req.task), built = req.mode === 'pre' ? preStages(req.task, plan) : postStages(req.task, plan);
    S.run = { req: req, from: from, plan: plan, stages: built.stages.map(function (s) { return Object.assign({ shown: 'wait' }, s); }), lines: built.lines, shownLines: 0, idx: -1, done: false, verdict: null, countdown: 0 };
    if (req.speed) S.speed = req.speed;
    $('#speed') && ($('#speed').value = S.speed);
    paint();
    var fast = S.speed === 'fast' || reducedMotion, step = fast ? 90 : 950, lineMs = fast ? 12 : 230;
    function nextStage() {
      var r = S.run; if (!r) return;
      r.idx++;
      if (r.idx >= r.stages.length) return finishRun();
      var st = r.stages[r.idx];
      st.shown = 'run'; paint();
      if (st.playbook) streamLines(function () { st.shown = st.status; paint(); timers.push(setTimeout(nextStage, step / 2)); });
      else timers.push(setTimeout(function () { st.shown = st.status; paint(); nextStage(); }, step));
    }
    function streamLines(done) {
      var r = S.run; if (!r) return;
      if (r.shownLines >= r.lines.length) return done();
      r.shownLines++; paintTerm();
      timers.push(setTimeout(function () { streamLines(done); }, lineMs));
    }
    timers.push(setTimeout(nextStage, step / 2));
  }
  function counts(r) { var c = { ok: 0, notes: 0, errors: 0 }; r.stages.forEach(function (s) { if (s.status === 'ok') c.ok++; else if (s.status === 'warn') c.notes++; else c.errors++; }); return c; }
  function finishRun() {
    var r = S.run; if (!r) return;
    var c = counts(r);
    r.done = true; r.verdict = c.errors ? 'fail' : c.notes ? 'warn' : 'ok';
    r.counts = c;
    S.history.unshift({ taskId: r.req.task.id, mode: r.req.mode, verdict: r.verdict, at: new Date().toISOString().slice(11, 16) });
    saveState(); paint();
    if (r.from && !reducedMotion) { r.countdown = S.speed === 'fast' ? 2 : 6; tick(); }
  }
  function tick() {
    var r = S.run; if (!r || !r.done || r.returned) return;
    paintVerdict();
    if (r.countdown <= 0) return giveBack();
    r.countdown--; timers.push(setTimeout(tick, 1000));
  }
  function giveBack() {
    var r = S.run; if (!r || r.returned || !r.from) return;
    r.returned = true; clearTimers();
    window.parent.postMessage({ type: 'wb:handoff', to: r.from, payload: {
      type: 'check-result', mode: r.req.mode, taskId: r.req.task.id, ticket: r.req.ticket, verdict: r.verdict, counts: r.counts,
      checks: r.stages.map(function (s) { return { label: s.label, status: s.status, detail: String(s.detail || '').slice(0, 200) }; }), lines: r.lines.slice(0, 60),
    } }, '*');
    paintVerdict();
  }

  /* ---------- painting ---------- */
  var MODE = { pre: 'Pre-check', post: 'Post-check' };
  function requestCard(r) {
    var t = r.req.task, p = r.plan, owner = person(t.requester);
    return '<div class="card"><h2>' + esc(t.id) + ' · ' + esc(MODE[r.req.mode]) + '</h2><p class="note">Change request from Infrastructure Operations</p><dl class="kv">' +
      '<dt>Playbook</dt><dd>' + esc(p.playbook ? p.playbook.title : t.template) + '</dd><dt>Target</dt><dd>' + esc(t.target) + '</dd><dt>Customer</dt><dd>' + esc(p.customer || '') + '</dd>' +
      '<dt>Window</dt><dd>' + esc(t.window ? t.window[0].replace('T', ' ') + ' to ' + t.window[1].replace('T', ' ') : '') + '</dd><dt>Requested by</dt><dd>' + esc(owner ? owner.name + ' (' + owner.role + ')' : t.requester) + '</dd>' +
      (r.req.ticket ? '<dt>Ticket</dt><dd>' + esc(r.req.ticket) + '</dd>' : '') +
      (p.risk ? '<dt>Risk</dt><dd><span class="tag ' + p.risk + '">' + esc(p.risk) + '</span> · ' + esc(p.approvalsNeeded) + ' approval(s)</dd>' : '') + '</dl></div>';
  }
  function termHtml(r) {
    return r.lines.slice(0, r.shownLines).map(function (l) { return '<span class="' + (l.charAt(0) === '+' ? 'p' : l.charAt(0) === '-' ? 'm' : l.charAt(0) === '$' ? 'c' : '') + '">' + esc(l) + '</span>'; }).join('\n');
  }
  function paintTerm() { var el = $('#term'); if (el) { el.innerHTML = termHtml(S.run); el.scrollTop = el.scrollHeight; } }
  function paintVerdict() {
    var r = S.run, el = $('#verdict'); if (!r || !el) return;
    if (!r.done) { el.innerHTML = ''; return; }
    var text = r.verdict === 'ok' ? 'All checks passed.' : r.verdict === 'warn' ? 'Passed with notes: ' + r.counts.notes + ' note(s) for the approver.' : 'Blocked: ' + r.counts.errors + ' check(s) failed. The change cannot go ahead as requested.';
    el.innerHTML = '<div class="verdict ' + r.verdict + '" role="status"><b>' + esc(MODE[r.req.mode]) + (r.verdict === 'fail' ? ' failed' : ' done') + '</b><div>' + esc(text) + '</div><div class="row">' +
      (r.from ? (r.returned ? '<span class="tag ok">Result sent back to the change request</span>' : '<button class="btn primary" id="back" type="button">Back to ' + esc(r.req.task.id) + (r.countdown > 0 ? ' (' + r.countdown + ' s)' : '') + '</button>' + (r.countdown > 0 ? '<button class="btn" id="stay" type="button">Stay here</button>' : '')) : '<span class="sub">Standalone run: there is no change request to return to.</span> <button class="btn" id="again" type="button">Run again</button>') + '</div></div>';
    var b;
    if ((b = $('#back'))) b.onclick = giveBack;
    if ((b = $('#stay'))) b.onclick = function () { r.countdown = 0; clearTimers(); paintVerdict(); };
    if ((b = $('#again'))) b.onclick = demoRun;
  }
  function paint() {
    var r = S.run, main = $('#main');
    if (!r) {
      main.innerHTML = '<div class="card"><h2>No change request waiting</h2><p class="note">Create a task in Infrastructure Operations: the pre-check runs here, then the result goes back to the change request. The post-check after the upgrade runs here too.</p>' +
        '<div class="row"><button class="btn primary" id="demo" type="button">Run a demo pre-check</button></div></div>' +
        '<div class="two"><div class="card"><h2>What the pre-check does</h2><p class="note">Nothing is changed.</p><ol style="margin:0;padding-left:18px"><li>Target, owner and freeze periods</li><li>Backup, dependencies, DNS and capacity</li><li>The playbook in check mode (<code>--check --diff</code>)</li><li>Verdict: passed, passed with notes, or blocked</li></ol></div>' +
        '<div class="card"><h2>What the post-check does</h2><p class="note">After the upgrade.</p><ol style="margin:0;padding-left:18px"><li>Service answers and the new certificate is in place</li><li>Dependent systems are running</li><li>Monitoring alert is cleared</li><li>No drift against the plan</li></ol></div></div>' +
        '<div class="card" style="margin-top:16px"><h2>Recent checks</h2>' + (S.history.length ? '<ul class="hist">' + S.history.map(function (h) { return '<li><span class="tag ' + h.verdict + '">' + (h.verdict === 'ok' ? 'passed' : h.verdict === 'warn' ? 'notes' : 'blocked') + '</span><b>' + esc(h.taskId) + '</b> ' + esc(MODE[h.mode]) + '<small>' + esc(h.at) + '</small></li>'; }).join('') + '</ul>' : '<p class="note" style="margin:0">None yet in this session.</p>') + '</div>';
      var d = $('#demo'); if (d) d.onclick = demoRun;
      return;
    }
    main.innerHTML = '<div class="cols"><div>' + requestCard(r) + '</div><div class="card"><h2>' + esc(MODE[r.req.mode]) + ' running</h2><p class="note">' + (r.req.mode === 'pre' ? 'The playbook runs in check mode: it shows what would change and changes nothing.' : 'The verification playbook compares the system with the plan.') + '</p>' +
      '<ul class="stages" aria-live="polite">' + r.stages.map(function (s) { return '<li class="stage ' + s.shown + '"><span class="ic" aria-hidden="true">' + (s.shown === 'ok' ? '✓' : s.shown === 'warn' ? '!' : s.shown === 'fail' ? '×' : '') + '</span><div>' + esc(s.label) + (s.shown === 'wait' || s.shown === 'run' ? '' : '<small>' + esc(s.detail) + '</small>') + '</div>' + (s.playbook ? '<span class="tag tool">AWX</span>' : '') + '</li>'; }).join('') + '</ul>' +
      '<div class="term" id="term" aria-label="Playbook output">' + termHtml(r) + '</div><div id="verdict"></div></div></div>';
    paintVerdict();
  }
  function demoRun() {
    var t = D.tasks.filter(function (x) { return x.state === 'planned' || x.state === 'in_review'; })[0] || D.tasks[0];
    startRun({ mode: 'pre', speed: S.speed, ticket: '', task: Object.assign({}, t, { state: 'planned' }) }, null);
  }

  /* ---------- host protocol ---------- */
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return;
    var m = e.data;
    if (!m || m.type !== 'wb:restore') return;
    if (m.state && Array.isArray(m.state.history)) { S.history = m.state.history.slice(0, 8); if (m.state.speed === 'fast') S.speed = 'fast'; }
    var hs = Array.isArray(m.handoffs) ? m.handoffs : [];
    for (var i = hs.length - 1; i >= 0; i--) {
      var p = hs[i] && hs[i].payload;
      if (p && p.type === 'check-request') { var req = cleanRequest(p); if (req && typeof hs[i].from === 'string') { startRun(req, hs[i].from); return; } }
    }
    paint();
  });
  $('#speed').onchange = function (e) { S.speed = e.target.value; saveState(); };
  paint();
  window.__cc = { S: S, startRun: startRun, cleanRequest: cleanRequest, planFor: planFor };
})();
</script>
</body>
</html>
