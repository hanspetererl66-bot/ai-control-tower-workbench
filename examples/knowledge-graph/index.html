<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Graph</title>
<style id="design-system">
/* Shared design system for the example Spaces (AI Control Tower, Sub4Me).
   Source of truth: examples/shared/design-system.css. Embedded into each Space by
   `npm run sync:design` (Spaces are single-file pages: no network, no external CSS).
   Light and dark follow prefers-color-scheme (or data-theme on <html>); colours only exist as tokens. */
:root{
  color-scheme:light dark;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:var(--font); /* one typeface everywhere; numbers use tabular figures */
  --canvas:#f7f6fb;--surface:#ffffff;--ink:#171322;--ink-2:#4a4560;--muted:#6c6784;--faint:#b4b0c4;--line:#ebe8f2;--line-2:#f4f2f9;--wash:#faf9fd;
  --purple:#A100FF;--purple-mid:#7B00C2;--purple-dim:rgba(161,0,255,.08);--purple-border:rgba(161,0,255,.2);--purple-light:#f3e6ff;
  --green:#00875A;--green-dim:rgba(0,135,90,.09);--green-border:rgba(0,135,90,.22);
  --amber:#a85c00;--amber-dim:rgba(176,94,0,.09);--amber-border:rgba(176,94,0,.24);
  --red:#c9190b;--red-dim:rgba(201,25,11,.08);--red-border:rgba(201,25,11,.22);
  --blue:#0041c2;--blue-dim:rgba(0,65,194,.08);--blue-border:rgba(0,65,194,.22);
  --teal:#006b75;--teal-dim:rgba(0,107,117,.09);
  --radius:16px;--radius-s:10px;--shadow:0 1px 2px rgba(23,19,34,.04);--shadow-lg:0 24px 60px rgba(23,19,34,.22);
  --space:8px;
  /* Control Tower token names */
  --black:var(--surface);--white:var(--surface);
  --g900:var(--ink);--g700:var(--ink-2);--g500:var(--muted);--g300:var(--faint);--g200:var(--line);--g100:var(--line-2);--g50:var(--wash);
  --sh:var(--shadow);--p-dim:var(--purple-dim);--r-dim:var(--red-dim);--r-bd:var(--red-border);--a-bd:var(--amber-border);--g-bd:var(--green-border);
  /* Sub4Me token names */
  --bg:var(--canvas);--panel:var(--surface);--mut:var(--muted);--brand:var(--purple);--brand-dim:var(--purple-dim);
  --ok:var(--green);--ok-dim:var(--green-dim);--warn:var(--amber);--warn-dim:var(--amber-dim);--bad:var(--red);--bad-dim:var(--red-dim);
}
/* Dark follows the system unless the host pins a theme with data-theme on <html> (the app does, so Spaces follow its Appearance setting). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0e0c14;--surface:#171320;--ink:#f2f0f8;--ink-2:#cfcbe0;--muted:#9a95b0;--faint:#5d5873;--line:#2b2638;--line-2:#211d2d;--wash:#1b1726;
  --purple:#c26bff;--purple-mid:#d9a3ff;--purple-dim:rgba(194,107,255,.14);--purple-border:rgba(194,107,255,.32);--purple-light:#2a1640;
  --green:#3ddc97;--green-dim:rgba(61,220,151,.13);--green-border:rgba(61,220,151,.3);
  --amber:#ffb454;--amber-dim:rgba(255,180,84,.13);--amber-border:rgba(255,180,84,.3);
  --red:#ff7a70;--red-dim:rgba(255,122,112,.13);--red-border:rgba(255,122,112,.3);
  --blue:#7aa7ff;--blue-dim:rgba(122,167,255,.13);--blue-border:rgba(122,167,255,.3);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0e0c14;--surface:#171320;--ink:#f2f0f8;--ink-2:#cfcbe0;--muted:#9a95b0;--faint:#5d5873;--line:#2b2638;--line-2:#211d2d;--wash:#1b1726;
  --purple:#c26bff;--purple-mid:#d9a3ff;--purple-dim:rgba(194,107,255,.14);--purple-border:rgba(194,107,255,.32);--purple-light:#2a1640;
  --green:#3ddc97;--green-dim:rgba(61,220,151,.13);--green-border:rgba(61,220,151,.3);
  --amber:#ffb454;--amber-dim:rgba(255,180,84,.13);--amber-border:rgba(255,180,84,.3);
  --red:#ff7a70;--red-dim:rgba(255,122,112,.13);--red-border:rgba(255,122,112,.3);
  --blue:#7aa7ff;--blue-dim:rgba(122,167,255,.13);--blue-border:rgba(122,167,255,.3);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.6);
}
:root[data-theme="light"]{color-scheme:light}

/* ---- Base ---- */
body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* Calmer labels: no all-caps micro headings, also where pages style them inline. */
[style*="text-transform:uppercase"]{text-transform:none!important;letter-spacing:0!important}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}
.tag,.mv,.bv,.kval,.dv,.tbl td,.num,.hdr-stat-val{font-variant-numeric:tabular-nums}

/* ---- Cards and tiles (both Spaces) ---- */
.mc,.card,.ns,.dtier,.pc,.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mc{padding:20px 22px}
.card,.ns{padding:24px;margin-bottom:16px}
.dtier,.pc,.cc{padding:18px}
.ns{border-top:1px solid var(--line)}
.ml,.k{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.mv,.v{font-family:var(--font);font-size:30px;font-weight:650;letter-spacing:-.025em;color:var(--ink);line-height:1.15}
.md,.s{font-size:12px}
.sh{font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);margin:36px 0 14px}
.chd{font-size:15px;font-weight:650;color:var(--ink)}

/* Status tags */
.tag{font-family:var(--font);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;border-width:1px}
.src{border-radius:99px;font-weight:600}

/* Tables */
.tbl th,table th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 14px}
.tbl td,table td{padding:14px;border-bottom:1px solid var(--line-2)}
.tbl{border-collapse:collapse}

/* Bars */
.bt{height:6px;border-radius:99px;background:var(--line-2)}
.bf{border-radius:99px}
.bar{background:var(--line-2)}

/* Alerts, notes and callouts */
.ab{border-radius:var(--radius);border-width:1px;border-left-width:1px;padding:18px 20px}
.ab-w{border-color:var(--amber-border)}.ab-i{border-color:var(--purple-border)}.ab-s{border-color:var(--blue-border)}.ab-ok{border-color:var(--green-border)}

/* Forms and buttons */
input,select,textarea{font-family:var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px var(--purple-dim)}
button.primary{background:var(--purple);color:#fff;border-radius:var(--radius-s);padding:10px 18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#1a0a2b}}
:root[data-theme="dark"] button.primary{color:#1a0a2b}

/* Overlay (agent list) */
.ag-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 30px}
.ag-ov{background:rgba(14,12,20,.55);backdrop-filter:blur(4px);z-index:200}
.ag-x,.ag-tools input,.ag-tools button{border-radius:var(--radius-s)}
.ag-x{background:var(--surface);color:var(--ink);border-color:var(--line)}
.ag-tools button{background:var(--purple-dim);color:var(--purple);border-color:var(--purple-border)}
.ag-tbl th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ag-tbl td{padding:10px 8px}

/* ---- Control Tower shell ---- */
.ct .hdr{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:60px;padding:0 32px}
.ct .hdr-title{color:var(--ink);font-size:15px;font-weight:650}
.ct .hdr-sub{font-family:var(--font);font-size:11px;letter-spacing:.01em;color:var(--muted)}
.ct .hdr-div{background:var(--line)}
.ct .acc-mark{color:var(--purple)}
.ct .hdr-stat-val{color:var(--ink);font-family:var(--font);font-weight:600}
.ct .hdr-stat-lbl{color:var(--muted);letter-spacing:.02em;text-transform:none;font-size:11px}
.ct .live{color:var(--muted);font-family:var(--font)}
.ct .tbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.ct .tb{padding:16px 14px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.ct .tb:hover:not(.on){color:var(--ink)}
.ct .tb.on{color:var(--purple);border-bottom:2px solid var(--purple);font-weight:600}
.ct .tnum{display:none}
.ct .pg{padding:40px 32px 64px;max-width:1320px;margin:0 auto}
.ct .mr{gap:16px;margin-bottom:32px}
.ct .g2,.ct .g3,.ct .g4{gap:20px}
.ct .br{margin-bottom:14px}
.ct .krow,.ct .srow,.ct .ci{padding:14px 0}
.ct .kdesc,.ct .sdesc,.ct .abod{line-height:1.65}
.ct .fn{border-radius:99px;font-family:var(--font)}
.ct .ns-fml{font-family:var(--font);border-radius:var(--radius-s)}
.ct .dm{font-family:var(--font);letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:500}

/* ---- Sub4Me shell ---- */
.s4m header{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 32px;min-height:60px;box-sizing:border-box}
.s4m .logo{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.5}
.s4m header .s{font-size:11px;letter-spacing:.01em;line-height:1.5;margin-top:1px;color:var(--muted)}
.s4m{font-size:13px}
.s4m .demo{padding:8px 32px}
.s4m nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.s4m nav button{padding:16px 14px 14px;font-size:13px;font-weight:500;line-height:normal;border-bottom:2px solid transparent}
.s4m nav button:hover:not([aria-selected=true]){color:var(--ink)}
.s4m nav button[aria-selected=true]{font-weight:600;border-bottom-color:var(--purple)}
.s4m main{padding:40px 32px 64px;max-width:1320px}
.s4m .grid{gap:16px;margin-bottom:28px}
.s4m h2{font-size:13px;font-weight:600;margin:36px 0 14px}
.s4m .row{gap:20px}
.s4m .months span{border-radius:8px 8px 0 0}
.s4m .bar{height:6px}
@media(max-width:640px){.ct .pg,.s4m main{padding:24px 16px 48px}.ct .hdr,.ct .tbar,.s4m header,.s4m nav{padding-left:16px;padding-right:16px}}
.s4m .months.stack div{cursor:default}
.s4m .months.stack .col{display:flex;flex-direction:column-reverse;width:100%;flex:1;justify-content:flex-start;gap:1px}
.s4m .months.stack .col i{display:block;width:100%;min-height:1px}
.s4m .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11px;color:var(--mut)}
.s4m .legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.s4m #products tbody tr{cursor:pointer}
.s4m #products tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #products tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m #contracts tbody tr,.s4m #offers tbody tr{cursor:pointer}
.s4m #contracts tbody tr[aria-selected="true"],.s4m #offers tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #contracts tbody tr:focus-visible,.s4m #offers tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .detail{margin-top:12px}
.s4m .detail .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
.s4m .detail .head .t{font-size:18px;font-weight:600}
.s4m .detail .hint{margin:0 0 4px}
.s4m .detail .secs{display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px}
.s4m .detail h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .detail dl{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:5px 12px;font-size:13px}
.s4m .detail dt{color:var(--muted)}
.s4m .detail dd{margin:0;overflow-wrap:anywhere}
.s4m .detail .lines{margin-top:16px;overflow-x:auto}
.s4m .detail .note{margin-top:14px;font-size:13px;color:var(--muted)}
.s4m #product-detail{margin-top:16px}
.s4m #product-detail .dgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0 18px}
.s4m #product-detail .dgrid .v{font-size:20px;font-weight:600}
.s4m #offers td:not(:nth-child(2)),.s4m #offers th,.s4m #contracts td:not(:nth-child(2)):not(:nth-child(3)){white-space:nowrap}

/* Skill Marketplace: impact, governance, gaps and the skill detail view */
.s4m .smx-kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:6px}
.s4m .smx-kpis .v{font-size:24px;font-weight:600}
.s4m tr[data-skill],.s4m article.sk[data-skill]{cursor:pointer}
.s4m tr[data-skill]:hover{background:var(--line-2)}
.s4m tr[data-skill]:focus-visible,.s4m article.sk[data-skill]:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .smx-spark{display:inline-flex;align-items:flex-end;gap:3px;height:28px;min-width:72px}
.s4m .smx-spark i{display:block;width:8px;border-radius:2px;background:var(--brand);opacity:.45}
.s4m .smx-spark i.cur{opacity:.2}
.s4m .smx-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.s4m .smx-title{font-size:20px;font-weight:600}
.s4m .smx-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.s4m .smx-grid h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .smx-dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:13px}
.s4m .smx-dl dt{color:var(--muted)}
.s4m .smx-dl dd{margin:0;overflow-wrap:anywhere}
.s4m .smx-list{margin:4px 0 0;padding-left:18px;font-size:13px}
.s4m .smx-list li{margin:3px 0}
.s4m #detail-back{margin-bottom:10px}
.s4m .smx-rate{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.s4m .smx-stars{display:inline-block;letter-spacing:1px;line-height:1;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--faint) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.s4m .smx-stars-sm{font-size:12px}
.s4m .smx-line{margin:2px 0 6px;font-size:13px}
.s4m .smx-big{font-size:32px;font-weight:600;line-height:1.1}
.s4m .smx-bars{display:grid;gap:5px;margin-top:10px;font-size:12px}
.s4m .smx-bar{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:8px;color:var(--muted)}
.s4m .smx-bar i{display:block;height:8px;border-radius:4px;background:var(--line)}
.s4m .smx-bar i b{display:block;height:100%;border-radius:4px;background:var(--amber)}
.s4m .smx-bar .num{text-align:right}
</style>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em}.logo b{color:var(--brand)}
.meta{margin-left:auto;text-align:right;font-size:12px;color:var(--mut)}.meta strong{display:block;color:var(--ink);font-size:13px}
.demo{background:var(--warn-dim);color:var(--warn);font-size:12px;padding:6px 18px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mut);padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand-dim);color:var(--brand)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--brand)}.btn[aria-pressed=true]{background:var(--brand-dim);color:var(--brand);border-color:var(--brand)}
button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--wash);color:var(--ink);font:inherit}
.results{position:absolute;z-index:5;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;box-shadow:0 8px 24px var(--backdrop)}
.results[hidden]{display:none}
.results button{width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:6px 8px;border-radius:6px;font:inherit;cursor:pointer;display:flex;gap:8px;align-items:center}
.results button:hover,.results button[aria-selected=true]{background:var(--brand-dim)}
.results small{color:var(--mut);margin-left:auto}
label.depth{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
label.depth select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;height:calc(100vh - 150px);min-height:520px}
.wrap{position:relative;min-width:0;background:var(--bg);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}#cv.hit{cursor:pointer}
.legend{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;opacity:.94;max-height:calc(100% - 24px);overflow:auto}
.legend button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);padding:3px 8px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer;text-align:left}
.legend button:hover{background:var(--brand-dim)}.legend button[aria-pressed=false]{opacity:.4;text-decoration:line-through}
.legend em{margin-left:auto;font-style:normal;color:var(--mut);padding-left:10px}
#mini{position:absolute;right:12px;bottom:12px;width:150px;height:100px;border:1px solid var(--line);border-radius:10px;background:var(--panel);opacity:.92;cursor:pointer}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{padding:4px 10px;width:34px}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px}
aside h2{margin:0 0 4px;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:12px 0;font-size:13px}.kv dt{color:var(--mut)}.kv dd{margin:0;overflow-wrap:anywhere}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:16px 0 6px}
.conn{display:flex;flex-direction:column;gap:2px}
.conn button{border:0;background:none;color:var(--ink);text-align:left;padding:5px 8px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column}
.conn button:hover{background:var(--brand-dim)}.conn small{color:var(--mut)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.card{border:1px solid var(--line);background:var(--wash);border-radius:12px;padding:12px;margin:10px 0}
.card p{margin:4px 0 0;color:var(--ink-2)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--brand-dim);color:var(--brand);font-size:12px;font-weight:700}
.steps{counter-reset:s;list-style:none;margin:6px 0;padding:0}.steps li{counter-increment:s;padding:4px 0 4px 26px;position:relative;font-size:13px}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:18px;height:18px;border-radius:50%;background:var(--brand-dim);color:var(--brand);font-size:11px;font-weight:700;text-align:center;line-height:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.ask{position:absolute;left:210px;right:64px;top:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.ask button{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;opacity:.96}
.ask button:hover{border-color:var(--brand)}.ask button[aria-pressed=true]{background:var(--brand-dim);color:var(--brand);border-color:var(--brand)}
.timebar{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:min(440px,calc(100% - 420px));min-width:300px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;opacity:.95}
.timebar input[type=range]{flex:1;min-width:80px;accent-color:var(--brand)}
.timebar .btn{padding:3px 10px}
.timebar .tl{display:flex;flex-direction:column;font-size:11px;color:var(--mut);line-height:1.3;min-width:150px}.timebar .tl b{color:var(--ink);font-size:12px}
.vleg{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--mut);opacity:.95;max-width:230px}
.vleg b{color:var(--ink);font-size:12px}.vleg .sw{display:flex;flex-wrap:wrap;gap:3px 10px}.vleg .sw span{display:inline-flex;align-items:center;gap:4px}
.vleg i{display:inline-block;width:10px;height:10px;border-radius:50%}
.ans small.note{display:block;color:var(--mut)}
.role{display:inline-block;border-radius:999px;padding:0 8px;font-size:11px;font-weight:700;color:#fff}
.role.Sponsor{background:var(--green)}.role.Decider{background:var(--purple)}.role.Blocker{background:var(--red)}.role.Influencer{background:var(--muted)}
.pips{letter-spacing:2px;color:var(--brand);font-size:11px}
.gap{margin:4px 0 0;color:var(--warn);font-size:12px}
@media (max-width:860px){.ask{left:12px;right:12px;top:auto;bottom:96px}.timebar{width:calc(100% - 24px);bottom:10px}.vleg{display:none}.stage{grid-template-columns:1fr;height:auto}.wrap{height:62vh;min-height:380px}aside{border-left:0;border-top:1px solid var(--line)}.legend{max-height:40%}#mini{display:none}.hint{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Knowledge <b>Graph</b></div>
  <div class="meta"><strong id="stats"></strong><span id="asof"></span></div>
</header>
<div class="demo">Fictional sample data. Sales view by default; skills, tools, risks, agents and automation are switchable as enablers.</div>
<div class="bar" role="toolbar" aria-label="Graph controls">
  <div class="search">
    <input id="q" type="search" placeholder="Search nodes: ariba, R2, renewal-radar…" aria-label="Search nodes" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="res">
    <ul class="results" id="res" role="listbox" hidden></ul>
  </div>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-explore" aria-pressed="true" title="Click a node to see its neighbours">Explore</button>
    <button id="m-impact" aria-pressed="false" title="Select a node to see what depends on it">Impact</button>
    <button id="m-path" aria-pressed="false" title="Pick two nodes to see how they connect">Path</button>
  </div>
  <label class="depth" id="depth-l" hidden>Depth <select id="depth"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
  <button class="btn" id="tour">▶ Guided tour</button>
  <button class="btn" id="labels" aria-pressed="false">Labels</button>
  <button class="btn" id="pause" aria-pressed="false">Pause</button>
  <button class="btn" id="reset">Reset</button>
  <span class="sep" aria-hidden="true"></span>
  <button class="btn" id="b-enabler" aria-pressed="false" title="Show skills, tools, agents, workflows, apps and risks as enablers">Enablers</button>
  <button class="btn" id="b-value" aria-pressed="true" title="Node size = ACV, line width = TCV, colour = win probability">Value</button>
  <button class="btn" id="b-stake" aria-pressed="false" title="Stakeholder map: contacts per customer with role and contact strength">Stakeholders</button>
</div>
<div class="stage">
  <div class="wrap" id="wrap">
    <canvas id="cv" tabindex="0" role="application" aria-label="Interactive knowledge graph. Use the search box or the lists in the side panel to navigate by keyboard. Plus and minus zoom, arrow keys pan, Escape clears the selection."></canvas>
    <div class="legend" id="legend" role="group" aria-label="Node types (toggle to show or hide)"></div>
    <div class="ask" id="ask" role="group" aria-label="Ask the graph"></div>
    <div class="timebar" id="timebar"><button class="btn" id="t-play" aria-label="Play the weeks" title="Let the graph grow week by week">▶</button><input id="t-range" type="range" min="0" max="6" step="1" value="6" aria-label="Week"><div class="tl"><b id="t-label"></b><span id="t-delta"></span></div></div>
    <div class="vleg" id="vleg" aria-label="Legend for size, line width and colour"></div>
    <div class="zoom"><button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">−</button><button class="btn" id="zfit" aria-label="Fit graph" title="Fit">⤢</button></div>
    <canvas id="mini" aria-hidden="true" width="300" height="200"></canvas>
    <div class="hint" id="hint">Drag to move · scroll to zoom · double-click a node to pin it</div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</div>

    (a.rows.length ? `<div class="conn">${a.rows.map((r) => `<button data-go="${esc(r.n.id)}">${esc(r.n.label)}<small>${esc(r.note)}</small></button>`).join('')}</div>` : '<p>Nothing matches at this point in time.</p>');
}
function stakeCard() {
  const by = new Map();
  for (const n of visNodes().filter((x) => x.stake)) { if (!by.has(n.stake.customer)) by.set(n.stake.customer, []); by.get(n.stake.customer).push(n); }
  let h = '<h2>Stakeholder map</h2><p style="color:var(--ink-2)">Contacts per customer. The role is derived from the job title; the contact strength counts calls and e-mails you share with the person.</p>';
  for (const [cust, list] of [...by].sort((a, b) => b[1].length - a[1].length)) {
    list.sort((a, b) => b.stake.touches - a.stake.touches);
    const acv = sumAcv(salesNodes().filter((n) => n.sales.stage !== 'contract' && n.sales.account === cust));
    h += `<div class="card"><h3 style="margin:0">${esc(cust)}</h3><small style="color:var(--mut)">${acv ? `Open ACV ${money(acv)}` : 'No open deal'}</small><div class="conn">` +
      list.map((n) => { const s = n.stake, k = STRENGTH[s.strength]; return `<button data-go="${esc(n.id)}"><span><b>${esc(n.label)}</b> <span class="role ${s.role}">${s.role}</span> <span class="pips" title="Contact strength: ${s.strength}">${'●'.repeat(k)}${'○'.repeat(3 - k)}</span></span><small>${esc(n.meta.Role || 'role unknown')} · ${s.calls} call${s.calls === 1 ? '' : 's'}, ${s.mails} e-mail${s.mails === 1 ? '' : 's'}${s.last ? ` · last ${s.last}` : ' · not met yet'}</small></button>`; }).join('') + '</div>';
    for (const need of ['Sponsor', 'Decider']) if (!list.some((n) => n.stake.role === need && n.stake.touches)) h += `<p class="gap">No ${need} met yet</p>`;
    const bl = list.filter((n) => n.stake.role === 'Blocker');
    if (bl.length) h += `<p class="gap">Blocker: ${bl.map((n) => esc(n.label)).join(', ')}. Involve early.</p>`;
    h += '</div>';
  }
  return h;
}
function syncBars() {
  const allEn = [...ENABLER].every((tp) => !hidden.has(tp) || !count[tp]);
  $('#b-enabler').setAttribute('aria-pressed', String(allEn));
  $('#b-value').setAttribute('aria-pressed', String(S.value));
  $('#b-stake').setAttribute('aria-pressed', String(S.stake));
  const sw = (c, l) => `<span><i style="background:var(--${c})"></i>${l}</span>`;
  $('#vleg').innerHTML = S.stake
    ? `<b>Stakeholders</b><div class="sw">${sw('green', 'Sponsor')}${sw('purple', 'Decider')}${sw('red', 'Blocker')}${sw('muted', 'Influencer')}</div><span>Size = contact strength</span>`
    : S.value
      ? `<b>Value view</b><span>Node size = ACV · line width = TCV</span><div class="sw">${sw('green', '70 % +')}${sw('amber', '50 to 69 %')}${sw('red', 'under 50 %')}${sw('blue', 'contract')}</div><span>Dashed ring = new in the last 7 days</span>`
      : '<b>Dashed ring</b><span>new in the last 7 days</span>';
  updateStats();
}
$('#b-enabler').onclick = () => {
  const on = $('#b-enabler').getAttribute('aria-pressed') === 'true';
  for (const tp of ENABLER) on ? hidden.add(tp) : hidden.delete(tp);
  if (S.sel && hidden.has(S.sel.type)) S.sel = null;
  renderLegend(); computeFocus(); renderPanel(); fit();
};
$('#b-value').onclick = () => { S.value = !S.value; syncBars(); };
$('#b-stake').onclick = () => {
  S.stake = !S.stake; S.ans = null; syncAsk();
  if (S.stake) { hidden.delete('person'); hidden.delete('customer'); S.sel = null; if (S.mode !== 'explore') setMode('explore'); }
  renderLegend(); computeFocus(); renderPanel(); panel.scrollTop = 0;
  if (S.stake) fit(visNodes().filter((n) => n.stake || n.type === 'customer'));
};

/* ---------- legend ---------- */
function svgShape(type) {
  const st = ST[type], r = 7, c = 10; let inner;
  if (st.s === 'circle') inner = `<circle cx="${c}" cy="${c}" r="${r}"/>`;
  else if (st.s === 'round') inner = `<rect x="${c - r}" y="${c - r}" width="${r * 2}" height="${r * 2}" rx="3"/>`;
  else if (st.s === 'square') inner = `<rect x="${c - r + 1}" y="${c - r + 1}" width="${r * 2 - 2}" height="${r * 2 - 2}"/>`;
  else {
    const pts = st.s === 'hex' ? 6 : st.s === 'diamond' ? 4 : st.s === 'tri' ? 3 : 10, rot = st.s === 'hex' ? 0 : -Math.PI / 2, a = [];
    for (let i = 0; i < pts; i++) { const rr = st.s === 'star' ? (i % 2 ? r * 0.55 : r * 1.15) : r; const an = rot + (i / pts) * Math.PI * 2; a.push((c + Math.cos(an) * rr).toFixed(1) + ',' + (c + Math.sin(an) * rr).toFixed(1)); }
    inner = `<polygon points="${a.join(' ')}"/>`;
  }
  return `<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" style="fill:var(--${st.c === 'ink2' ? 'ink-2' : st.c})">${inner}</svg>`;
}
function renderLegend() {
  const el = $('#legend');
  el.innerHTML = Object.keys(D.nodeTypes).filter((t) => count[t]).map((t) => `<button data-t="${t}" aria-pressed="${!hidden.has(t)}">${svgShape(t)}${esc(D.nodeTypes[t])}<em>${count[t]}</em></button>`).join('');
  el.querySelectorAll('button').forEach((b) => (b.onclick = () => {
    const t = b.dataset.t; hidden.has(t) ? hidden.delete(t) : hidden.add(t);
    if (S.sel && hidden.has(S.sel.type)) S.sel = null;
    b.setAttribute('aria-pressed', String(!hidden.has(t))); computeFocus(); renderPanel(); syncBars();
  }));
  syncBars();
}

/* ---------- side panel ---------- */
const panel = $('#panel');
const chipOf = (n) => `<span class="chip">${svgShape(n.type)}${esc(D.nodeTypes[n.type])}</span>`;
function connList(n) {
  const groups = {};
  for (const s of n.nb) (groups[s.n.type] ||= []).push(s);
  return Object.keys(D.nodeTypes).filter((t) => groups[t]).map((t) => `<h3>${esc(D.nodeTypes[t])} (${groups[t].length})</h3><div class="conn">${groups[t].map((s) => `<button data-go="${esc(s.n.id)}">${esc(s.n.label)}<small>${esc(sentence(n, s))}</small></button>`).join('')}</div>`).join('');
}
function renderPanel() {
  const n = S.sel;
  let h = '';
  if (S.tour >= 0) {
    const st = S.tourSet.steps[S.tour];
    h += `<div class="card"><span class="pill">${esc(S.tourSet.title)} · step ${S.tour + 1} of ${S.tourSet.steps.length}</span><h2 style="margin-top:8px">${esc(st.title)}</h2><p>${esc(st.text)}</p><div class="row"><button class="btn" id="t-prev"${S.tour === 0 ? ' disabled' : ''}>◀ Back</button><button class="btn" id="t-next">${S.tour === S.tourSet.steps.length - 1 ? 'Finish' : 'Next ▶'}</button><button class="btn" id="t-end">End tour</button></div></div>`;
  }
  if (S.mode === 'path') {
    h += `<h2>Path</h2><p style="color:var(--mut);margin:4px 0 8px">${!S.pathA ? 'Click a start node.' : !S.steps ? `Start: <b>${esc(S.pathA.label)}</b>. Now click the target node.` : ''}</p>`;
    if (S.steps && S.steps.length) {
      h += `<span class="pill">${S.steps.length} step${S.steps.length > 1 ? 's' : ''}</span><ol class="steps">${S.steps.map((st) => `<li>${esc(sentence(st.from, st.s))}</li>`).join('')}</ol>`;
    } else if (S.steps) h += '<p>No connection without going through a system or connector hub.</p>';
  }
  if (n && S.mode !== 'path') {
    h += `${chipOf(n)}<h2>${esc(n.label)}</h2>`;
    const meta = Object.entries(n.meta || {});
    if (meta.length) h += `<dl class="kv">${meta.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
    if (S.mode === 'impact' && S.dist) {
      const byHop = {}; for (const [id, d] of S.dist) if (d > 0) (byHop[d] ||= []).push(byId.get(id));
      const total = Object.values(byHop).reduce((a, l) => a + l.length, 0);
      h += `<div class="card"><span class="pill">${total} affected within ${S.depth} step${S.depth > 1 ? 's' : ''}</span>`;
      for (const d of Object.keys(byHop)) {
        const types = {}; byHop[d].forEach((x) => (types[x.type] = (types[x.type] || 0) + 1));
        h += `<p><b>Step ${d}:</b> ${Object.entries(types).map(([t, c]) => `${c} ${esc(D.nodeTypes[t].toLowerCase())}`).join(', ')}</p><div class="conn">${byHop[d].map((x) => `<button data-go="${esc(x.id)}">${esc(x.label)}<small>${esc(D.nodeTypes[x.type])}</small></button>`).join('')}</div>`;
      }
      h += '</div>';
    } else h += `<div class="row"><button class="btn" id="a-impact">Show impact</button><button class="btn" id="a-path">Path from here</button>${n.pin ? '<button class="btn" id="a-unpin">Unpin</button>' : ''}</div>` + connList(n);
    if (n.view) h += `<p style="color:var(--mut);font-size:12px;margin-top:14px">Details live in the “${esc(n.view.space)}” Space.</p>`;
  } else if (S.mode === 'path' && S.pathA && !S.steps) {
    h += `<div class="conn"><button data-go="${esc(S.pathA.id)}">${esc(S.pathA.label)}<small>start</small></button></div>`;
  }
  if (!n && S.mode !== 'path' && S.tour < 0 && S.ans) h += ansCard();
  else if (!n && S.mode !== 'path' && S.tour < 0 && S.stake) h += stakeCard();
  else if (!n && S.mode !== 'path' && S.tour < 0) {
    h += `<h2>What is in here</h2><p style="color:var(--ink-2)">The Sales view: customers, deals, offers, contracts, calls and e-mails. Node size is the ACV, line width the TCV, colour the win probability; try the questions at the top or the week slider. Switch on <b>Enablers</b> for skills, tools, risks, agents and automation. Click a node to see its neighbours, switch to <b>Impact</b> to follow dependencies, or to <b>Path</b> to see how two things connect.</p>${tourButtons()}`;
    const top = [...nodes].sort((a, b) => b.deg - a.deg).filter((x) => !HUB.has(x.type)).slice(0, 8);
    h += `<h3>Best connected</h3><div class="conn">${top.map((x) => `<button data-go="${esc(x.id)}">${esc(x.label)}<small>${esc(D.nodeTypes[x.type])} · ${x.deg} relations</small></button>`).join('')}</div>`;
  }
  panel.innerHTML = h;
  panel.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => { const x = byId.get(b.dataset.go); if (x) { if (S.mode === 'path') { flyTo(x); } else setSel(x, { fromPanel: true }); } }));
  const on = (id, fn) => { const e = panel.querySelector(id); if (e) e.onclick = fn; };
  on('#a-impact', () => { const keep = S.sel; setMode('impact'); setSel(keep); });
  on('#a-path', () => { const keep = S.sel; setMode('path'); S.pathA = keep; S.sel = keep; computeFocus(); renderPanel(); });
  on('#a-unpin', () => { n.pin = false; renderPanel(); });
  on('#ans-clear', () => clearAnswer());
  panel.querySelectorAll('[data-tour]').forEach((b) => (b.onclick = () => startTour(Number(b.dataset.tour))));
  on('#t-prev', () => tourGo(S.tour - 1)); on('#t-next', () => tourGo(S.tour + 1)); on('#t-end', endTour);
}
function tourButtons() {
  return `<div class="conn">${D.tours.map((t, i) => `<button data-tour="${i}">▶ ${esc(t.title)}<small>${esc(t.summary)}</small></button>`).join('')}</div>`;
}
function showHover(n) { if (n && !S.sel) $('#hint').textContent = `${D.nodeTypes[n.type]}: ${n.label} · ${n.deg} relations`; else if (!n) $('#hint').textContent = S.mode === 'path' ? 'Path mode: click a start node, then a target node' : S.mode === 'impact' ? 'Impact mode: click a node to see everything that hangs on it' : 'Drag to move · scroll to zoom · double-click a node to pin it'; }

/* ---------- search ---------- */
const q = $('#q'), res = $('#res'); let hits = [], hi = -1;
function search() {
  const t = q.value.trim().toLowerCase();
  hits = t.length < 2 ? [] : nodes.filter((n) => n.label.toLowerCase().includes(t) || n.id.toLowerCase().includes(t) || Object.values(n.meta || {}).some((v) => String(v).toLowerCase().includes(t)))
    .sort((a, b) => (b.label.toLowerCase().startsWith(t) ? 1 : 0) - (a.label.toLowerCase().startsWith(t) ? 1 : 0) || b.deg - a.deg).slice(0, 9);
  hi = hits.length ? 0 : -1;
  res.hidden = !hits.length; q.setAttribute('aria-expanded', String(!!hits.length));
  res.innerHTML = hits.map((n, i) => `<li><button type="button" role="option" data-i="${i}" aria-selected="${i === hi}">${svgShape(n.type)}${esc(n.label)}<small>${esc(D.nodeTypes[n.type])}</small></button></li>`).join('');
  res.querySelectorAll('button').forEach((b) => (b.onclick = () => pick(hits[Number(b.dataset.i)])));
}
function pick(n) { if (!n) return; ensureShown(n); res.hidden = true; q.value = ''; setSel(n); }
q.addEventListener('input', search);
q.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!hits.length) return; hi = (hi + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length; res.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-selected', String(i === hi))); }
  else if (e.key === 'Enter') pick(hits[Math.max(0, hi)]);
  else if (e.key === 'Escape') { res.hidden = true; }
});
document.addEventListener('click', (e) => { if (!e.target.closest('.search')) res.hidden = true; });

/* ---------- guided tour ---------- */
function startTour(ti = 0) { if (!D.tours[ti]) return; setMode('explore'); S.tourSet = D.tours[ti]; tourGo(0); }
function tourGo(i) {
  if (i < 0) return; if (i >= S.tourSet.steps.length) return endTour();
  const st = S.tourSet.steps[i], n = byId.get(st.node); if (!n) return endTour();
  S.mode = st.impact ? 'impact' : 'explore';
  for (const k of ['explore', 'impact', 'path']) $('#m-' + k).setAttribute('aria-pressed', String(k === S.mode));
  $('#depth-l').hidden = S.mode !== 'impact';
  ensureShown(n);
  S.tour = i; S.sel = n; S.t0 = performance.now(); computeFocus();
  flyTo(n, 1.25); renderPanel();
}
function endTour() { S.tour = -1; S.sel = null; setMode('explore'); fit(); }
$('#tour').onclick = () => {
  if (S.tour >= 0) return endTour();
  if (D.tours.length === 1) return startTour(0);
  setMode('explore'); S.sel = null; computeFocus(); renderPanel(); panel.scrollTop = 0;
};

/* ---------- theme + boot ---------- */
readColors();
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'style', 'class'] });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
renderLegend(); renderPanel(); resize(); updateTime(); fit(visNodes(), true);
requestAnimationFrame(frame);
// test hook (read-only inspection, no network)
window.__kg = { nodes, edges, S, T, setSel, byId, setMode, startTour, tourGo, cam, setCutIdx, askQuestion, QUESTIONS, hidden };
})();
</script>
