<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infra Ops Control</title>
<style id="design-system">
/* Shared design system for the example Spaces (AI Control Tower, Sub4Me).
   Source of truth: examples/shared/design-system.css. Embedded into each Space by
   `npm run sync:design` (Spaces are single-file pages: no network, no external CSS).
   Light and dark follow prefers-color-scheme (or data-theme on <html>); colours only exist as tokens. */
:root{
  color-scheme:light dark;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:var(--font); /* one typeface everywhere; numbers use tabular figures */
  --canvas:#f6f5f8;--surface:#ffffff;--ink:#1b1a22;--ink-2:#46444f;--muted:#6c6a78;--faint:#c3c1cd;--hint:var(--muted);--red-ink:var(--red);--green-ink:#27755a;--purple-ink:#665b92;--amber-ink:#7a5f2f;--blue-ink:#476690;--line:#e6e4ec;--line-2:#f1f0f5;--wash:#faf9fc;
  --purple:#7B6FA6;--purple-mid:#62578A;--purple-deep:#3F3860;--purple-dim:rgba(123,111,166,.07);--purple-border:rgba(123,111,166,.20);--purple-light:#eeecf5;
  --green:#2F8A6B;--green-dim:rgba(47,138,107,.08);--green-border:rgba(47,138,107,.20);
  --amber:#8A6D3B;--amber-dim:rgba(138,109,59,.07);--amber-border:rgba(138,109,59,.20);
  --red:#B5483F;--red-dim:rgba(181,72,63,.07);--red-border:rgba(181,72,63,.20);
  --blue:#5B79A3;--blue-dim:rgba(91,121,163,.08);--blue-border:rgba(91,121,163,.22);
  --teal:#006b75;--teal-dim:rgba(0,107,117,.09);
  --radius:20px;--radius-s:12px;--shadow:0 1px 2px rgba(20,18,30,.04),0 6px 20px rgba(20,18,30,.05);--shadow-lg:0 24px 60px rgba(20,18,30,.22);
  --space:8px;
  /* Control Tower token names */
  --black:var(--surface);--white:var(--surface);
  --g900:var(--ink);--g700:var(--ink-2);--g500:var(--muted);--g300:var(--faint);--g200:var(--line);--g100:var(--line-2);--g50:var(--wash);
  --sh:var(--shadow);--p-dim:var(--purple-dim);--r-dim:var(--red-dim);--r-bd:var(--red-border);--a-bd:var(--amber-border);--g-bd:var(--green-border);
  /* Sub4Me token names */
  --bg:var(--canvas);--panel:var(--surface);--mut:var(--muted);--brand:var(--purple);--brand-dim:var(--purple-dim);
  --ok:var(--green);--ok-dim:var(--green-dim);--warn:var(--amber);--warn-dim:var(--amber-dim);--bad:var(--red);--bad-dim:var(--red-dim);
}
/* Dark follows the system unless the host pins a theme with data-theme on <html> (the app does, so Spaces follow its Appearance setting). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0f0e13;--surface:#18171d;--ink:#f4f3f8;--ink-2:#d3d1dc;--muted:#9e9cab;--faint:#5b5967;--hint:#8a8897;--red-ink:var(--red);--green-ink:var(--green);--purple-ink:var(--purple);--amber-ink:var(--amber);--blue-ink:var(--blue);--line:#2b2a33;--line-2:#222129;--wash:#1d1c24;
  --purple:#A599C8;--purple-mid:#BDB3DA;--purple-deep:#DAD4EC;--purple-dim:rgba(165,153,200,.10);--purple-border:rgba(165,153,200,.26);--purple-light:#26232f;
  --green:#6FBF9F;--green-dim:rgba(111,191,159,.10);--green-border:rgba(111,191,159,.24);
  --amber:#C9AE7C;--amber-dim:rgba(201,174,124,.09);--amber-border:rgba(201,174,124,.24);
  --red:#D98A82;--red-dim:rgba(217,138,130,.10);--red-border:rgba(217,138,130,.24);
  --blue:#93A9CB;--blue-dim:rgba(147,169,203,.10);--blue-border:rgba(147,169,203,.26);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0f0e13;--surface:#18171d;--ink:#f4f3f8;--ink-2:#d3d1dc;--muted:#9e9cab;--faint:#5b5967;--hint:#8a8897;--red-ink:var(--red);--green-ink:var(--green);--purple-ink:var(--purple);--amber-ink:var(--amber);--blue-ink:var(--blue);--line:#2b2a33;--line-2:#222129;--wash:#1d1c24;
  --purple:#A599C8;--purple-mid:#BDB3DA;--purple-deep:#DAD4EC;--purple-dim:rgba(165,153,200,.10);--purple-border:rgba(165,153,200,.26);--purple-light:#26232f;
  --green:#6FBF9F;--green-dim:rgba(111,191,159,.10);--green-border:rgba(111,191,159,.24);
  --amber:#C9AE7C;--amber-dim:rgba(201,174,124,.09);--amber-border:rgba(201,174,124,.24);
  --red:#D98A82;--red-dim:rgba(217,138,130,.10);--red-border:rgba(217,138,130,.24);
  --blue:#93A9CB;--blue-dim:rgba(147,169,203,.10);--blue-border:rgba(147,169,203,.26);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}
:root[data-theme="light"]{color-scheme:light}

/* ---- Base ---- */
body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* Calmer labels: no all-caps micro headings, also where pages style them inline. */
[style*="text-transform:uppercase"]{text-transform:none!important;letter-spacing:0!important}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}
.tag,.mv,.bv,.kval,.dv,.tbl td,.num,.hdr-stat-val{font-variant-numeric:tabular-nums}

/* ---- Cards and tiles (both Spaces) ---- */
.mc,.card,.ns,.dtier,.pc,.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mc{padding:20px 22px}
.card,.ns{padding:24px;margin-bottom:16px}
.dtier,.pc,.cc{padding:18px}
.ns{border-top:1px solid var(--line)}
.ml,.k{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.mv,.v{font-family:var(--font);font-size:30px;font-weight:650;letter-spacing:-.025em;color:var(--ink);line-height:1.15}
.md,.s{font-size:12px}
.sh{font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);margin:36px 0 14px}
.chd{font-size:15px;font-weight:650;color:var(--ink)}

/* Status tags */
.tag{font-family:var(--font);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;border-width:1px}
.src{border-radius:99px;font-weight:600}

/* Tables */
.tbl th,table th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 14px}
.tbl td,table td{padding:14px;border-bottom:1px solid var(--line-2)}
.tbl{border-collapse:collapse}

/* Bars */
.bt{height:6px;border-radius:99px;background:var(--line-2)}
.bf{border-radius:99px}
.bar{background:var(--line-2)}

/* Alerts, notes and callouts */
.ab{border-radius:var(--radius);border-width:1px;border-left-width:1px;padding:18px 20px}
.ab-w{border-color:var(--amber-border)}.ab-i{border-color:var(--purple-border)}.ab-s{border-color:var(--blue-border)}.ab-ok{border-color:var(--green-border)}

/* Forms and buttons */
input,select,textarea{font-family:var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px var(--purple-dim)}
/* Calm Bento buttons: one family. Primary = Accenture purple on white text, secondary = soft tint, quiet = neutral. */
button.primary,button.ghost,button.small{font:inherit;font-size:13px;font-weight:550;line-height:1.2;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
button.primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 1px 2px rgba(70,0,115,.18)}
button.small{padding:5px 11px;font-size:12px;background:var(--purple-dim);border-color:var(--purple-border);color:var(--purple-ink)}
button.ghost:hover:not(:disabled),button.small:hover:not(:disabled){border-color:var(--purple-border);background:var(--purple-dim);color:var(--purple-ink)}
button.primary:hover:not(:disabled){background:var(--purple-mid);border-color:var(--purple-mid)}
button.primary:disabled,button.ghost:disabled,button.small:disabled{opacity:.5;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}:root:not([data-theme="light"]) button.small,:root:not([data-theme="light"]) button.ghost:hover:not(:disabled){color:var(--purple-ink)}}
:root[data-theme="dark"] button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}
:root[data-theme="dark"] button.small,:root[data-theme="dark"] button.ghost:hover:not(:disabled){color:var(--purple-ink)}

/* Bento: the first tile of a KPI row carries the accent wash. */

/* Overlay (agent list) */
.ag-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 30px}
.ag-ov{background:rgba(14,12,20,.55);backdrop-filter:blur(4px);z-index:200}
.ag-x,.ag-tools input,.ag-tools button{border-radius:var(--radius-s)}
.ag-x{background:var(--surface);color:var(--ink);border-color:var(--line)}
.ag-tools button{background:var(--purple-dim);color:var(--purple-ink);border-color:var(--purple-border)}
.ag-tbl th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ag-tbl td{padding:10px 8px}

/* ---- Control Tower shell ---- */
.ct .hdr{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:60px;padding:0 32px}
.ct .hdr-title{color:var(--ink);font-size:15px;font-weight:650}
.ct .hdr-sub{font-family:var(--font);font-size:11px;letter-spacing:.01em;color:var(--muted)}
.ct .hdr-div{background:var(--line)}
.ct .acc-mark{color:var(--purple-ink)}
.ct .hdr-stat-val{color:var(--ink);font-family:var(--font);font-weight:600}
.ct .hdr-stat-lbl{color:var(--muted);letter-spacing:.02em;text-transform:none;font-size:11px}
.ct .live{color:var(--muted);font-family:var(--font)}
.ct .tbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.ct .tb{padding:16px 14px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.ct .tb:hover:not(.on){color:var(--ink)}
.ct .tb.on{color:var(--purple-ink);border-bottom:2px solid var(--purple);font-weight:600}
.ct .tnum{display:none}
.ct .pg{padding:40px 32px 64px;max-width:1320px;margin:0 auto}
.ct .mr{gap:16px;margin-bottom:32px}
.ct .g2,.ct .g3,.ct .g4{gap:20px}
.ct .br{margin-bottom:14px}
.ct .krow,.ct .srow,.ct .ci{padding:14px 0}
.ct .kdesc,.ct .sdesc,.ct .abod{line-height:1.65}
.ct .fn{border-radius:99px;font-family:var(--font)}
.ct .ns-fml{font-family:var(--font);border-radius:var(--radius-s)}
.ct .dm{font-family:var(--font);letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:500}

/* ---- Sub4Me shell ---- */
.s4m header{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 32px;min-height:60px;box-sizing:border-box}
.s4m .logo{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.5}
.s4m header .s{font-size:11px;letter-spacing:.01em;line-height:1.5;margin-top:1px;color:var(--muted)}
.s4m{font-size:13px}
.s4m .demo{padding:8px 32px}
.s4m nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.s4m nav button{padding:16px 14px 14px;font-size:13px;font-weight:500;line-height:normal;border-bottom:2px solid transparent}
.s4m nav button:hover:not([aria-selected=true]){color:var(--ink)}
.s4m nav button[aria-selected=true]{font-weight:600;border-bottom-color:var(--purple)}
.s4m main{padding:40px 32px 64px;max-width:1320px}
.s4m .grid{gap:16px;margin-bottom:28px}
.s4m h2{font-size:13px;font-weight:600;margin:36px 0 14px}
.s4m .row{gap:20px}
.s4m .months span{border-radius:8px 8px 0 0}
.s4m .bar{height:6px}
@media(max-width:640px){.ct .pg,.s4m main{padding:24px 16px 48px}.ct .hdr,.ct .tbar,.s4m header,.s4m nav{padding-left:16px;padding-right:16px}}
.s4m .months.stack div{cursor:default}
.s4m .months.stack .col{display:flex;flex-direction:column-reverse;width:100%;flex:1;justify-content:flex-start;gap:1px}
.s4m .months.stack .col i{display:block;width:100%;min-height:1px}
.s4m .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11px;color:var(--mut)}
.s4m .legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.s4m #products tbody tr{cursor:pointer}
.s4m #products tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #products tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m #contracts tbody tr,.s4m #offers tbody tr{cursor:pointer}
.s4m #contracts tbody tr[aria-selected="true"],.s4m #offers tbody tr[aria-selected="true"]{background:var(--line-2)}
.s4m #contracts tbody tr:focus-visible,.s4m #offers tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .detail{margin-top:12px}
.s4m .detail .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
.s4m .detail .head .t{font-size:18px;font-weight:600}
.s4m .detail .hint{margin:0 0 4px}
.s4m .detail .secs{display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px}
.s4m .detail h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .detail dl{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:5px 12px;font-size:13px}
.s4m .detail dt{color:var(--muted)}
.s4m .detail dd{margin:0;overflow-wrap:anywhere}
.s4m .detail .lines{margin-top:16px;overflow-x:auto}
.s4m .detail .note{margin-top:14px;font-size:13px;color:var(--muted)}
.s4m #product-detail{margin-top:16px}
.s4m #product-detail .dgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0 18px}
.s4m #product-detail .dgrid .v{font-size:20px;font-weight:600}
.s4m #offers td:not(:nth-child(2)),.s4m #offers th,.s4m #contracts td:not(:nth-child(2)):not(:nth-child(3)){white-space:nowrap}

/* Skill Marketplace: impact, governance, gaps and the skill detail view */
.s4m .smx-kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:6px}
.s4m .smx-kpis .v{font-size:24px;font-weight:600}
.s4m tr[data-skill],.s4m article.sk[data-skill]{cursor:pointer}
.s4m tr[data-skill]:hover{background:var(--line-2)}
.s4m tr[data-skill]:focus-visible,.s4m article.sk[data-skill]:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.s4m .smx-spark{display:inline-flex;align-items:flex-end;gap:3px;height:28px;min-width:72px}
.s4m .smx-spark i{display:block;width:8px;border-radius:2px;background:var(--brand);opacity:.45}
.s4m .smx-spark i.cur{opacity:.2}
.s4m .smx-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.s4m .smx-title{font-size:20px;font-weight:600}
.s4m .smx-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.s4m .smx-grid h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.s4m .smx-dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:13px}
.s4m .smx-dl dt{color:var(--muted)}
.s4m .smx-dl dd{margin:0;overflow-wrap:anywhere}
.s4m .smx-list{margin:4px 0 0;padding-left:18px;font-size:13px}
.s4m .smx-list li{margin:3px 0}
.s4m #detail-back{margin-bottom:10px}
.s4m .smx-rate{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.s4m .smx-stars{display:inline-block;letter-spacing:1px;line-height:1;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--faint) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.s4m .smx-stars-sm{font-size:12px}
.s4m .smx-line{margin:2px 0 6px;font-size:13px}
.s4m .smx-big{font-size:32px;font-weight:600;line-height:1.1}
.s4m .smx-bars{display:grid;gap:5px;margin-top:10px;font-size:12px}
.s4m .smx-bar{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:8px;color:var(--muted)}
.s4m .smx-bar i{display:block;height:8px;border-radius:4px;background:var(--line)}
.s4m .smx-bar i b{display:block;height:100%;border-radius:4px;background:var(--amber)}
.s4m .smx-bar .num{text-align:right}
/* Collapsible "What is this page?" card (details element) */
details.intro>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
details.intro>summary::-webkit-details-marker{display:none}
details.intro>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
details.intro[open]>summary::before{transform:rotate(45deg)}
details.intro>summary h2{margin:0!important}
details.intro>summary .hint{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
details.intro>summary:focus-visible{outline:2px solid var(--purple);outline-offset:4px;border-radius:6px}
details.intro .body{margin-top:8px}
@media (prefers-reduced-motion:reduce){details.intro>summary::before{transition:none}}
</style>
<style>
body{margin:0}
main{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
.demo{font-size:12px;color:var(--muted);margin:0 0 14px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;margin:0 0 16px}
.crumbs button{font:inherit;background:none;border:0;padding:2px 4px;color:var(--purple-deep);cursor:pointer;border-radius:6px}
.crumbs button:hover{background:var(--purple-dim)}
.crumbs .here{font-weight:650;color:var(--ink)}
.crumbs .sep{color:var(--faint)}
h1{font-size:20px;margin:0 0 4px;font-weight:650}
h2{font-size:15px;margin:0 0 8px;font-weight:650}
.sub{font-size:12px;color:var(--muted);margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px}
.kpi b{display:block;font-size:26px;font-weight:650;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.red b{color:var(--red)}.kpi.yellow b{color:var(--amber)}.kpi.green b{color:var(--green)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:var(--radius-s);padding:14px 16px}
.tile:hover{box-shadow:var(--shadow);border-color:var(--purple-border)}
.tile.red{border-left-color:var(--red)}.tile.yellow{border-left-color:var(--amber)}.tile.green{border-left-color:var(--green)}
.tile .t{font-weight:650;font-size:14px}
.tile .m{font-size:12px;color:var(--muted);margin-top:2px}
.tile .why{font-size:12px;margin-top:8px;color:var(--ink-2)}
.seg{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line-2);margin-top:10px}
.seg i{display:block;height:100%}.seg .r{background:var(--red)}.seg .y{background:var(--amber)}.seg .g{background:var(--green)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid}
.pill.red{color:var(--red-ink);background:var(--red-dim);border-color:var(--red-border)}
.pill.yellow{color:var(--amber-ink);background:var(--amber-dim);border-color:var(--amber-border)}
.pill.green{color:var(--green-ink);background:var(--green-dim);border-color:var(--green-border)}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.filters{display:flex;gap:6px}
.filters button{font:inherit;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--purple-dim);border-color:var(--purple);color:var(--purple-deep);font-weight:650}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border:1px solid;border-radius:var(--radius-s);padding:12px 14px;margin-bottom:16px}
.banner.red{background:var(--red-dim);border-color:var(--red-border)}.banner.yellow{background:var(--amber-dim);border-color:var(--amber-border)}.banner.green{background:var(--green-dim);border-color:var(--green-border)}
.banner b{font-size:15px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.metric{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:12px;padding:6px 0}
.metric .bar{position:relative;height:8px;border-radius:99px;background:var(--line-2)}
.metric .bar i.f{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.metric .bar i.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--faint)}
.metric .val{text-align:right;font-weight:600}
.metric.red .f{background:var(--red)}.metric.yellow .f{background:var(--amber)}.metric.green .f{background:var(--green)}
.metric.na{color:var(--muted)}
ul.why{margin:0;padding-left:18px;font-size:13px}
ul.why li{margin:4px 0}
.task{border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:8px;font-size:12px}
.task b{font-size:13px}
.task ol{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.note{font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px;margin:0}
.facts dt{color:var(--muted)}.facts dd{margin:0}
#fix-slot{margin-top:14px}
.runbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.runbar li{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 5px}
.runbar li i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-style:normal;font-size:11px;font-weight:650;background:var(--line-2);color:var(--ink-2)}
.runbar li.done{color:var(--green-ink);border-color:var(--green-border);background:var(--green-dim)}
.runbar li.done i{background:var(--green);color:var(--surface)}
.runbar li.now{color:var(--purple-deep);border-color:var(--purple);background:var(--purple-dim);font-weight:650}
.runbar li.now i{background:var(--purple);color:var(--surface)}
.runlog{margin:0;padding:0;list-style:none;font-size:13px}
.runlog li{padding:3px 0;color:var(--ink-2)}
.runlog li.sb{padding-left:22px;color:var(--muted);font-size:12px}
.runlog li.last{color:var(--ink);font-weight:600}
.runlog .st{display:inline-block;min-width:1.4em;color:var(--purple)}
button.primary{font:inherit;font-size:13px;font-weight:650;color:var(--surface);background:var(--purple-mid);border:1px solid var(--purple-mid);border-radius:99px;padding:8px 18px;cursor:pointer}
button.primary:hover{background:var(--purple-deep)}
button.primary[disabled]{opacity:.5;cursor:default}
button.ghost{font:inherit;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer}
.fixcard{border:1px solid var(--red-border);background:var(--red-dim);border-radius:var(--radius);padding:18px 22px}
.fixcard p{margin:6px 0 12px;font-size:13px;color:var(--ink-2)}
.mail{border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;background:var(--canvas);font-size:12px}
.mail dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 8px}
.mail dt{color:var(--muted)}.mail dd{margin:0}
.mail pre{margin:0;white-space:pre-wrap;font:inherit;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px}

table.ev th,table.ev td{text-align:left;padding:4px 10px 4px 0;border-bottom:1px solid var(--line-2)}

.tools .crumbs{margin:0}
.speed{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.speed select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);padding:3px 8px}
@media (max-width:640px){.metric{grid-template-columns:110px 1fr 70px}}
.gate p{margin:8px 0;font-size:13px;line-height:1.5}

<style>

</style>
<nav id="story" aria-label="Autonomous Operations story"></nav>
<script>
(function () {
  var CUR = 'infra-ops-control';
  var STEPS = [
    { slug: 'infra-wiki', t: 'SOP', x: 'Start with the procedure: the Infra Wiki says step by step how a certificate is renewed and a VM is patched. Joule reads the pages; the same steps run later as the automated flow.' },
    { slug: 'it-fleet', t: 'Fleet', x: 'Where does it burn? 42 customers and about 1,200 VMs at a glance. Muster Industrie AG is red: a certificate on one of its hosts expires in days.' },
    { slug: 'it-infrastructure', t: 'Customer VMs', x: 'One customer up close: the status wall of Muster Industrie AG. Hover over proxy-edge-01 to see why it is red; every reason becomes a recommended task.' },
    { slug: 'it-operations', t: 'Alerts', x: 'What does monitoring say? Seven alerts, each with a transparent priority. A-506 is the certificate of proxy-edge-01; A-507 carries an injected instruction and is withheld.' },
    { slug: 'infra-rca', t: 'RCA', x: 'Why did it happen, and has it happened before? An RCA agent (simulated) looks into former cases and the documentation, names the most likely root cause with evidence and confidence, and proposes the next best action. A person decides.' },
    { slug: 'infra-ops', t: 'Service request', x: 'From finding to fix: the ticket for Muster Industrie AG becomes a service request for a certificate renewal. Pre-check, two approvals from different roles, simulated execution, audit evidence.' },
    { slug: 'infra-hotline', t: 'Hotline', x: 'Long downtime windows are agreed with the customer first: the customer calls the central hotline and an AI voice agent (simulated) offers windows inside the nights the customer allows. The policy says per task and customer from which length it asks; a person confirms.' },
    { slug: 'infra-ops-control', t: 'Auto-fix', x: 'The same path without the manual work: all customers, one customer, one red VM. One click opens a ticket, corrects the VM by the SOP steps, checks it, writes the customer an e-mail (preview) and closes the ticket.' },
    { slug: 'infra-orchestrator', t: 'Orchestrator', x: 'Proactive instead of reactive: the orchestrator agent (simulated) looks ahead at certificates, patches, disks and DNS, plans the work with the same building blocks and, with human in the loop switched off, runs the low-risk part by itself. High risk, production above low risk, customer agreement and freezes stay with people.' }
  ];
  var TICKET = { type: 'ticket', id: 'OP-2090', customerId: 'musind', customerName: 'Muster Industrie AG', vm: 'musind-int04', kind: 'cert', priority: 'High', reasons: ['TLS certificate expires in days'], createdBy: 'Story: alert triage' };
  /* No address in the page (Spaces have no network): the chat gets the host and path and reads the page itself. The prompt stays under the 600 characters the host allows. */
  var SOP_PROMPT = 'Start of the Autonomous Operations story. With the tool read_wiki_page read the two SOP pages renew-tls-certificate and patch-vm of the Infra Wiki. For each: who does what in which step, where the approval is and what happens if a step fails. Then say which steps n8n and AWX automate. Answer in English.';
  var inHost = window.parent !== window;
  var cur = STEPS.findIndex(function (s) { return s.slug === CUR; });
  var nav = document.getElementById('story');
  function go(i) {
    var s = STEPS[i]; if (!s || !inHost) return;
    window.parent.postMessage({ type: 'wb:handoff', to: s.slug, payload: s.slug === 'infra-ops' ? TICKET : { type: 'story', step: i + 1 }, open: true, notice: 'Story step ' + (i + 1) + ' of ' + STEPS.length + ': ' + s.t }, '*');
  }
  var h = '<span class="st-label">Autonomous Operations</span><span class="st-steps">';
  STEPS.forEach(function (s, i) { h += '<button type="button" data-i="' + i + '"' + (i === cur ? ' aria-current="step"' : '') + (inHost ? '' : ' disabled') + '>' + (i + 1) + ' ' + s.t + '</button>'; });
  h += '</span>' + (inHost ? '<button type="button" class="st-sop" title="Joule reads the two SOP pages of the Infra Wiki">Read the SOP (wiki)</button>' : '') + '<span class="st-text">' + STEPS[cur].x + '</span>';
  if (inHost && cur < STEPS.length - 1) h += '<button type="button" class="st-next" data-i="' + (cur + 1) + '">Next: ' + STEPS[cur + 1].t + ' →</button>';
  nav.innerHTML = h;
  nav.addEventListener('click', function (e) { if (e.target.closest('.st-sop')) { window.parent.postMessage({ type: 'wb:ask', prompt: SOP_PROMPT }, '*'); return; } var b = e.target.closest('button[data-i]'); if (b) go(+b.dataset.i); });
})();
</script>
<!--story:end-->

<script id="ctl-logic">
/* Status rules, the same as in the Infra VM landscape Space (a test keeps both equal). */
function assess(vm, rules) {
  const reasons = [];
  const add = (level, text, key) => reasons.push({ level, text, key });
  if (!vm.reachable) add('red', 'Not reachable: the VM does not answer monitoring checks', 'unreachable');
  else {
    const metric = (field, label, unit, key) => {
      const v = vm[field], r = rules[field];
      if (v === null || v === undefined) return;
      if (r.appliesTo && r.appliesTo !== vm.env) return;
      if (field === 'certExpiresInDays') {
        if (v <= r.red) add('red', `${label} ${v}${unit} (red up to ${r.red}${unit})`, key);
        else if (v <= r.yellow) add('yellow', `${label} ${v}${unit} (yellow up to ${r.yellow}${unit})`, key);
      } else if (v >= r.red) add('red', `${label} ${v}${unit} (red from ${r.red}${unit})`, key);
      else if (v >= r.yellow) add('yellow', `${label} ${v}${unit} (yellow from ${r.yellow}${unit})`, key);
    };
    metric('cpuPct', 'CPU', ' %', 'cpu'); metric('memPct', 'Memory', ' %', 'mem'); metric('diskPct', 'Disk', ' %', 'disk');
    metric('backupAgeHours', 'Last backup', ' h ago', 'backup'); metric('patchLagDays', 'Security patch missing for', ' days', 'patch');
    metric('certExpiresInDays', 'TLS certificate expires in', ' days', 'cert');
  }
  const status = reasons.some((r) => r.level === 'red') ? 'red' : reasons.length ? 'yellow' : 'green';
  reasons.sort((a, b) => (a.level === b.level ? 0 : a.level === 'red' ? -1 : 1));
  return { status, reasons };
}
const ORDER = { red: 0, yellow: 1, green: 2 };
/** A customer is as red as its worst VM. */
function customerStatus(statuses) {
  return statuses.includes('red') ? 'red' : statuses.includes('yellow') ? 'yellow' : 'green';
}

/** The shared rule text says "expires in -2 days" for an expired certificate; say it plainly. */
function say(t) { return t.replace(/TLS certificate expires in -(\d+) days \(red up to (\d+) days\)/, 'TLS certificate expired $1 days ago (red up to $2 days)'); }
const FIELD = { cert: 'certExpiresInDays', patch: 'patchLagDays', disk: 'diskPct', backup: 'backupAgeHours', cpu: 'cpuPct', mem: 'memPct', unreachable: 'reachable' };
/** The VM after the automatic correction: every reason gets the end state its task defines. */
function applyFixes(vm, reasons, defs) {
  const after = { ...vm };
  for (const r of reasons) Object.assign(after, defs[r.key].fix);
  return after;
}
const FIELD_LABEL = { certExpiresInDays: 'TLS certificate, days left', patchLagDays: 'Missing patch, days', diskPct: 'Disk, %', backupAgeHours: 'Last backup, hours ago', cpuPct: 'CPU, %', memPct: 'Memory, %', reachable: 'Monitoring check' };
/** What changed, field by field, for the closing evidence. */
function evidence(before, after, reasons) {
  const show = (key, v) => (key === 'unreachable' ? (v ? 'reachable' : 'not reachable') : v);
  return reasons.map((r) => ({ key: r.key, field: FIELD[r.key], before: show(r.key, before[FIELD[r.key]]), after: show(r.key, after[FIELD[r.key]]) }));
}
/** The e-mail to the customer once the VM is green. Only a preview: nothing is sent. */
function composeMail(customer, vm, reasons, defs, ticketId, win) {
  const found = reasons.map((r) => '- ' + say(r.text)).join('\n');
  const did = reasons.map((r) => '- ' + defs[r.key].title + (defs[r.key].reboot ? (win ? ` (with a restart in the maintenance window ${slotOf(win)})` : ' (with a restart in a maintenance window)') : '')).join('\n');
  return {
    to: customer.contact,
    subject: `[${ticketId}] ${vm.name} is back to normal`,
    body: `Dear ${customer.name} IT team,\n\nOur monitoring found a problem on ${vm.name} (${vm.role}):\n${found}\n\nWe corrected it automatically:\n${did}\n\nAfterwards the VM was checked again and all checks are within their limits. No action is needed from your side.\n\nTicket ${ticketId} is closed. If you notice anything unusual, reply to this e-mail and we will reopen it.\n\nYour Infrastructure Operations team`,
  };
}

/* The window rules, the same as in the Customer Hotline and the Orchestrator (a test keeps the three equal). */
const DAY_MS = 86400000, MIN_MS = 60000;
const pad2 = (n) => String(n).padStart(2, '0');
const fmtMs = (ms) => { const d = new Date(ms); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`; };
const dayMs = (iso) => Date.parse(iso.slice(0, 10) + 'T00:00:00Z');
/** How long may the window be before the customer has to agree? A customer rule beats the default; null means never ask. */
function thresholdFor(policy, customer, task) {
  const o = policy.overrides.find((x) => x.customer === customer && x.task === task);
  if (o) return { hours: o.hours, source: 'customer' };
  const d = policy.defaults[task];
  return { hours: d === undefined ? 0 : d, source: 'default' };
}
/** The first allowed night of the customer from the given day on that does not touch a freeze. */
function nextWindow(data, customer, hours, fromMs) {
  const n = customer.nights, [fh, fm] = n.from.split(':').map(Number), [uh, um] = n.until.split(':').map(Number);
  const nightMin = ((uh * 60 + um) - (fh * 60 + fm) + 1440) % 1440 || 1440;
  let moved = null;
  for (let i = 0; i < 120; i++) {
    const day = fromMs + i * DAY_MS;
    if (!n.days.includes(new Date(day).getUTCDay())) continue;
    const start = day + (fh * 60 + fm) * MIN_MS, end = start + hours * 60 * MIN_MS;
    const first = fmtMs(start).slice(0, 10), last = fmtMs(end - MIN_MS).slice(0, 10);
    const fr = data.window.freezes.find((f) => (f.customer === null || f.customer === customer.id) && first <= f.to && last >= f.from);
    if (fr) { moved = moved || fr.reason; continue; }
    return { start: fmtMs(start), end: fmtMs(end), fits: hours * 60 <= nightMin, moved };
  }
  return null;
}
const slotOf = (w) => { const [d, a] = w.start.split('T'), [e, b] = w.end.split('T'); return `${d} ${a}–${b}${e !== d ? ' (next day)' : ''}`; };
/** A repair that restarts the VM needs a window. Does the customer have to agree it? null when nothing is restarted. */
function windowPlan(data, customer, reasons) {
  const task = reasons.map((r) => ({ key: r.key, def: data.tasks[r.key] })).filter((x) => x.def.reboot).sort((a, b) => b.def.hours - a.def.hours)[0];
  if (!task) return null;
  const hours = task.def.hours, t = thresholdFor(data.window.policy, customer.id, task.key);
  const window = nextWindow(data, customer, hours, dayMs(data.asOf) + data.window.leadDays * DAY_MS);
  const needed = t.hours !== null && (hours > t.hours || !window || !window.fits);
  const rule = `${t.source} rule`;
  const text = t.hours === null ? 'The customer rule lets the provider choose the window: no call.'
    : hours > t.hours ? (t.hours === 0 ? `Every window needs the customer's agreement (${rule}).` : `The window of ${hours} h is longer than ${t.hours} h (${rule}): the customer has to agree.`)
    : window && !window.fits ? 'The work is longer than the nights the customer allows: the customer has to agree.'
    : `The window of ${hours} h is within ${t.hours} h (${rule}): standard window, no call.`;
  return { task: task.key, title: task.def.title, hours, needed, threshold: t, text, window };
}

const ASK_MAX = 600; /* what the host accepts for Ask Joule */
function clip(t, n) { return t.length <= n ? t : t.slice(0, Math.max(0, n - 1)).trimEnd() + '…'; }
/** The request that asks Joule to do the repair's ticket, mail draft and closing for real (Sub4Me and Gmail tools). No address inside: the draft goes to the person who asks. */
function buildAsk(customer, vm, reasons, defs, ev) {
  const head = `Do for real what Infra Ops Control simulated. 1) create_ticket: customer muster, product "IT infrastructure", priority High, title "${customer.name}: ${vm.name} repaired", description "`;
  const tail = `". 2) Gmail create_draft to my own address (ask if unknown), subject "[ticket] ${vm.name} is back to normal", short plain customer text, do not send. 3) close_ticket, same ticket, note = description. English.`;
  const found = reasons.map((r) => say(r.text).replace(/\s*\((red|yellow) [^)]*\)\s*$/, '')).join('; ');
  const short = { certExpiresInDays: 'cert days left', patchLagDays: 'patch lag days', diskPct: 'disk %', backupAgeHours: 'backup age h', cpuPct: 'CPU %', memPct: 'memory %', reachable: 'reachable' };
  const changed = ev.map((e) => `${short[e.field] || e.field} ${e.before} -> ${e.after}`).join('; ');
  return head + clip(`Found: ${found}. Fixed: ${changed}.`, ASK_MAX - head.length - tail.length) + tail;
}

<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('ctl-data').textContent);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const LABEL = { green: 'Green', yellow: 'Yellow', red: 'Red' }, ICON = { green: '✓', yellow: '!', red: '✕' };
const state = { cust: null, vm: null, filter: 'all', speed: 'normal', over: {}, records: {}, run: null, gate: null, nextTicket: DATA.ticketStart };
const DELAY = { normal: 750, fast: 12 };
const RUN_STEPS = ['Ticket opened', 'Diagnosis and pre-check', 'Approval (auto, policy)', 'Correction', 'Verification', 'Customer e-mail', 'Ticket closed'];
let vms = [], customers = [];

function recompute() {
  vms = DATA.vms.map((v) => { const base = state.over[v.id] || v; return { ...base, ...assess(base, DATA.rules) }; });
  customers = DATA.customers.map((c) => {
    const own = vms.filter((v) => v.customer === c.id).sort((a, b) => ORDER[a.status] - ORDER[b.status] || a.name.localeCompare(b.name));
    const n = (s) => own.filter((v) => v.status === s).length;
    return { ...c, vms: own, red: n('red'), yellow: n('yellow'), green: n('green'), status: customerStatus(own.map((v) => v.status)) };
  }).sort((a, b) => ORDER[a.status] - ORDER[b.status] || b.red - a.red || a.name.localeCompare(b.name));
}
const pill = (s, text) => `<span class="pill ${s}">${ICON[s]} ${text || LABEL[s]}</span>`;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function crumbs() {
  const c = state.cust && customers.find((x) => x.id === state.cust), v = state.vm && vms.find((x) => x.id === state.vm);
  const parts = [];
  parts.push(c ? '<button type="button" data-go="all">All customers</button>' : '<span class="here">All customers</span>');
  if (c) parts.push(v ? `<button type="button" data-go="cust">${esc(c.name)}</button>` : `<span class="here">${esc(c.name)}</span>`);
  if (v) parts.push(`<span class="here">${esc(v.name)}</span>`);
  $('#crumbs').innerHTML = parts.join('<span class="sep" aria-hidden="true">›</span>');
}

function viewCustomers() {
  const n = (s) => customers.filter((c) => c.status === s).length;
  const red = vms.filter((v) => v.status === 'red').length;
  return `<h1>Infrastructure Operations</h1><p class="sub">${plural(customers.length, 'customer')}, ${plural(vms.length, 'VM')}. One tile per customer, sorted by the worst VM. Click a customer to see its VMs.</p>
  <div class="kpis"><div class="kpi red"><b>${n('red')}</b><span>customers red</span></div><div class="kpi yellow"><b>${n('yellow')}</b><span>customers yellow</span></div><div class="kpi green"><b>${n('green')}</b><span>customers green</span></div><div class="kpi"><b>${red}</b><span>red VMs to fix</span></div></div>
  <div class="cgrid">${customers.map((c) => {
    const worst = c.vms[0], why = worst && worst.status !== 'green' ? `${esc(worst.name)}: ${esc(say(worst.reasons[0].text))}` : 'All VMs within limits';
    const pc = (k) => (100 * c[k] / c.vms.length).toFixed(1);
    return `<button type="button" class="tile ${c.status}" data-cust="${c.id}"><div class="t">${esc(c.name)} ${pill(c.status)}</div><div class="m">${esc(c.industry)} · ${esc(c.region)} · SAP ${esc(c.sapCustomerId)}</div><div class="m">${plural(c.vms.length, 'VM')}: ${c.red} red, ${c.yellow} yellow, ${c.green} green</div><div class="seg" aria-hidden="true"><i class="r" style="width:${pc('red')}%"></i><i class="y" style="width:${pc('yellow')}%"></i><i class="g" style="width:${pc('green')}%"></i></div><div class="why">${why}</div></button>`;
  }).join('')}</div>${ticketsCard()}`;
}

function viewCustomer() {
  const c = customers.find((x) => x.id === state.cust);
  const list = c.vms.filter((v) => state.filter === 'all' || v.status === state.filter);
  return `<div class="head"><div><h1>${esc(c.name)} ${pill(c.status)}</h1><p class="sub" style="margin:0">${esc(c.industry)} · ${esc(c.region)} · SAP customer ID ${esc(c.sapCustomerId)} · ${plural(c.vms.length, 'VM')}. Click a VM to see its state.</p></div>
  <div class="filters" role="group" aria-label="Filter by status">${['all', 'red', 'yellow', 'green'].map((f) => `<button type="button" data-f="${f}" aria-pressed="${state.filter === f}">${f === 'all' ? 'All' : LABEL[f] + ' ' + c[f]}</button>`).join('')}</div></div>
  <div class="cgrid">${list.map((v) => `<button type="button" class="tile ${v.status}" data-vm="${v.id}"><div class="t">${esc(v.name)} ${pill(v.status)}</div><div class="m">${esc(v.role)}</div><div class="m">${v.env === 'prod' ? 'Production' : 'Test'} · ${esc(v.site)} · ${esc(v.os)}</div><div class="why">${v.reasons.length ? esc(say(v.reasons[0].text)) : 'All checks within limits'}</div></button>`).join('') || '<p class="note">No VMs with this status.</p>'}</div>`;
}

/* 0..100 on a "risk" scale so that every bar reads the same way: further right is worse. */
function scale(field, v) {
  const r = DATA.rules[field];
  if (field === 'certExpiresInDays') return Math.max(0, Math.min(100, 100 * (1 - v / (r.yellow * 2))));
  if (field === 'cpuPct' || field === 'memPct' || field === 'diskPct') return Math.max(0, Math.min(100, v));
  return Math.max(0, Math.min(100, 100 * v / (r.red * 1.5)));
}
function metricRow(vm, field, label, fmt) {
  const r = DATA.rules[field], v = vm[field];
  if (!vm.reachable || v === null || v === undefined || (r.appliesTo && r.appliesTo !== vm.env)) return `<div class="metric na"><span>${label}</span><span class="bar"></span><span class="val">${vm.reachable ? 'not checked' : 'no data'}</span></div>`;
  const cert = field === 'certExpiresInDays';
  const lvl = cert ? (v <= r.red ? 'red' : v <= r.yellow ? 'yellow' : 'green') : (v >= r.red ? 'red' : v >= r.yellow ? 'yellow' : 'green');
  return `<div class="metric ${lvl}"><span>${label}</span><span class="bar"><i class="f" style="width:${scale(field, v).toFixed(0)}%"></i><i class="tick" style="left:${scale(field, r.yellow).toFixed(0)}%"></i><i class="tick" style="left:${scale(field, r.red).toFixed(0)}%"></i></span><span class="val">${fmt(v)}</span></div>`;
}

function viewVm() {
  const v = vms.find((x) => x.id === state.vm), c = customers.find((x) => x.id === v.customer);
  const tasks = v.reasons.map((r) => ({ r, d: DATA.tasks[r.key] }));
  return `<div class="banner ${v.status}"><b>${esc(v.name)}</b>${pill(v.status)}<span>${v.status === 'green' ? 'All checks are within their limits.' : v.status === 'red' ? 'Red because of the worst check: ' + esc(say(v.reasons[0].text)) : 'Yellow because: ' + esc(say(v.reasons[0].text))}</span></div>
  <div class="cols">
   <div class="card"><h2>Measurements</h2><p class="note" style="margin-top:0">The two marks on each bar are the yellow and the red limit.</p>
    ${metricRow(v, 'cpuPct', 'CPU', (x) => x + ' %')}${metricRow(v, 'memPct', 'Memory', (x) => x + ' %')}${metricRow(v, 'diskPct', 'Disk', (x) => x + ' %')}${metricRow(v, 'backupAgeHours', 'Last backup', (x) => x + ' h ago')}${metricRow(v, 'patchLagDays', 'Missing security patch', (x) => x + ' days')}${metricRow(v, 'certExpiresInDays', 'TLS certificate', (x) => x < 0 ? 'expired ' + (-x) + ' d ago' : 'in ' + x + ' days')}
    <p class="note">An unreachable VM is always red. Backup age counts for production VMs only.</p></div>
   <div class="card"><h2>About this VM</h2><dl class="facts"><dt>Customer</dt><dd>${esc(c.name)} (SAP ${esc(c.sapCustomerId)})</dd><dt>Role</dt><dd>${esc(v.role)}</dd><dt>Environment</dt><dd>${v.env === 'prod' ? 'Production' : 'Test'}</dd><dt>Site</dt><dd>${esc(v.site)}</dd><dt>System</dt><dd>${esc(v.os)}, ${v.vcpu} vCPU, ${v.ramGb} GB RAM</dd><dt>Uptime</dt><dd>${v.uptimeDays} days</dd></dl></div>
  </div>
  <div class="card"><h2>Why this colour</h2>${v.reasons.length ? `<ul class="why">${v.reasons.map((r) => `<li>${pill(r.level)} ${esc(say(r.text))}</li>`).join('')}</ul>` : '<p class="note" style="margin:0">No reason: every check is within its limit.</p>'}</div>
  ${tasks.length ? `<div class="card"><h2>Recommended tasks</h2><p class="note" style="margin-top:0">Every reason becomes a task, urgent ones first.</p>${tasks.map(({ r, d }) => `<div class="task"><b>${esc(d.title)}</b> ${pill(r.level)}<div class="note">Approver: ${esc(d.approver)}${d.reboot ? ' · needs a restart' : ''}</div><ol>${d.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></div>`).join('')}</div>` : ''}
  <div id="fix-slot">${fixPanel(v)}</div>`;
}

/* ---------- automatic repair: the run bar ---------- */
const pad = (n) => String(n).padStart(2, '0');
function ticketsCard() {
  const recs = Object.values(state.records);
  if (!recs.length) return '';
  return `<div class="card" style="margin-top:16px"><div class="head" style="margin-bottom:8px"><h2 style="margin:0">Tickets from automatic repairs</h2><button type="button" class="ghost" data-reset="1">Reset demo</button></div>
  <table class="ev"><thead><tr><th>Ticket</th><th>Customer</th><th>VM</th><th>Status</th><th>E-mail to customer</th></tr></thead><tbody>${recs.map((r) => `<tr><td>${esc(r.ticket)}</td><td>${esc(r.customerName)}</td><td><button type="button" class="ghost" data-open="${r.vmId}">${esc(r.vmName)}</button></td><td>${pill('green', 'Closed')}</td><td>${esc(r.mail.to)}</td></tr>`).join('')}</tbody></table></div>`;
}
function runBar(done, now) {
  return `<ol class="runbar" aria-label="Automatic repair, steps">${RUN_STEPS.map((t, i) => `<li class="${i < done ? 'done' : i === now ? 'now' : ''}"${i === now ? ' aria-current="step"' : ''}><i>${i < done ? '✓' : i + 1}</i>${esc(t)}</li>`).join('')}</ol>`;
}
function logList(lines, live) {
  return `<ul class="runlog" ${live ? 'aria-live="polite"' : ''}>${lines.map((l, i) => `<li class="${l.sub ? 'sb' : ''}${live && i === lines.length - 1 ? ' last' : ''}"><span class="st">${l.sub ? '·' : '›'}</span>${esc(l.text)}</li>`).join('')}</ul>`;
}
function mailBox(m) {
  return `<div class="mail"><dl><dt>To</dt><dd>${esc(m.to)}</dd><dt>Subject</dt><dd>${esc(m.subject)}</dd></dl><pre>${esc(m.body)}</pre></div>`;
}
function fixPanel(v) {
  const run = state.run, rec = state.records[v.id];
  if (run && run.vmId === v.id) return runPanel(run);
  if (state.gate && state.gate.vmId === v.id) return gatePanel(state.gate);
  if (rec) return recordPanel(rec) + realPanel(rec);
  if (v.status !== 'red') return '';
  const n = v.reasons.length;
  return `<div class="fixcard"><h2>Fix automatically</h2><p>One click runs the whole repair: open a ticket, correct ${n === 1 ? 'the reason' : 'all ' + n + ' reasons'} by the SOP steps, check the VM again, send the customer an e-mail (preview) and close the ticket. Simulated: nothing is changed on a real VM and no e-mail leaves this page.</p><button type="button" class="primary" data-fix="${v.id}"${run || state.gate ? ' disabled' : ''}>Fix automatically</button>${run ? '<span class="note"> Another repair is running.</span>' : state.gate ? '<span class="note"> Another repair waits for the customer.</span>' : ''}</div>`;
}
/* the gate text is as small as the other card text */
function gatePanel(g) {
  const c = DATA.customers.find((x) => x.id === DATA.vms.find((v) => v.id === g.vmId).customer), w = g.plan.window;
  const hot = inHost() && c.hotlineId;
  return `<div class="card gate"><h2>Waiting for the customer ${pill('yellow', 'Ticket ' + esc(g.ticket))}</h2>
  <p>${esc(g.plan.title)} restarts the VM, so it needs a window. ${esc(g.plan.text)}</p>
  <p><b>Proposed window:</b> ${w ? esc(slotOf(w)) : 'none found'}${w && w.moved ? ` <span class="note">(moved because of: ${esc(w.moved)})</span>` : ''}<br><span class="note">Auto-fix never sets a window the customer has to agree. The repair starts when the window is agreed.</span></p>
  ${g.note ? `<p class="note">${esc(g.note)}</p>` : ''}
  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">${hot ? `<button type="button" class="primary" data-agree="hotline">Agree the window with the customer (hotline)</button>` : `<button type="button" class="primary" data-agree="sim">Simulate: the customer agrees</button>`}<button type="button" class="ghost" data-agree="cancel">Cancel the repair</button></div>
  ${!hot && inHost() ? '<p class="note">This customer has no profile in the Customer Hotline Space, so the agreement is simulated here.</p>' : ''}</div>`;
}
/** Hand the window to the Customer Hotline; the answer comes back as a hand-over (see the restore handler below). */
function toHotline() {
  const g = state.gate; if (!g) return;
  const raw = DATA.vms.find((x) => x.id === g.vmId), c = DATA.customers.find((x) => x.id === raw.customer), w = g.plan.window;
  if (!inHost() || !c.hotlineId || !w) return;
  save();
  window.parent.postMessage({ type: 'wb:handoff', to: 'infra-hotline', payload: { type: 'window-request', hours: g.plan.hours, task: { id: g.ticket, template: 'patch-vm', target: raw.name, customer: c.hotlineId, window: [w.start, w.end], requester: 'auto-fix', params: {} } }, open: true, notice: 'Window for ' + g.ticket }, '*');
}
function agreeWindow(win) { const g = state.gate; if (!g) return; startFix(g.vmId, { ticket: g.ticket, window: win || g.plan.window }); }
function cancelGate() { state.gate = null; render(); }
const TIME_RE = /^\d{4}-\d\d-\d\dT\d\d:\d\d$/;
/** What survives a trip to another Space: the host keeps it and gives it back. A running repair is not kept. */
function save() {
  if (!inHost()) return;
  window.parent.postMessage({ type: 'wb:state', state: { cust: state.cust, vm: state.vm, filter: state.filter, speed: state.speed, over: state.over, records: state.records, gate: state.gate, nextTicket: state.nextTicket } }, '*');
}
function runPanel(r) {
  const cur = r.shown ? r.events[r.shown - 1].step : 0;
  return `<div class="card"><h2>Automatic repair of ${esc(r.vmName)} <span class="pill yellow">Running</span></h2>${runBar(cur, cur)}${logList(r.events.slice(0, r.shown).map((e) => e), true)}</div>`;
}
function recordPanel(rec) {
  return `<div class="card"><h2>Repaired automatically ${pill('green', 'Ticket ' + esc(rec.ticket) + ' closed')}</h2>${runBar(RUN_STEPS.length, -1)}
  <div class="cols"><div><h2>What changed</h2><table class="ev"><thead><tr><th>Check</th><th>Before</th><th>After</th></tr></thead><tbody>${rec.evidence.map((e) => `<tr><td>${esc(FIELD_LABEL[e.field] || e.field)}</td><td>${esc(e.before)}</td><td>${esc(e.after)}</td></tr>`).join('')}</tbody></table><h2 style="margin-top:16px">Run log</h2>${logList(rec.events, false)}</div>
  <div><h2>E-mail to the customer (preview, not sent)</h2>${mailBox(rec.mail)}</div></div></div>`;
}
/** The host is the Werkbank around this page; outside it there is no chat to ask. */
const inHost = () => window.parent !== window;
function realPanel(rec) {
  return `<div class="card"><h2>Do it for real</h2><p class="note" style="margin-top:0">The run above is a simulation. With Joule and the connectors Sub4Me and Gmail the same steps can be done for real: a ticket in Sub4Me, a mail draft in Gmail (a draft only, nothing is sent) and closing that ticket. This page does not see the result: the real ticket number and the draft appear in the chat.</p>
  ${inHost() ? `<button type="button" class="primary" data-real="${rec.vmId}"${rec.asked ? ' disabled' : ''}>Create ticket and mail draft with Joule</button>${rec.asked ? '<span class="note"> Asked Joule, see the chat.</span>' : ''}` : '<p class="note" style="margin-bottom:0">Open this Space in the Werkbank to do it for real.</p>'}</div>`;
}
function paint() {
  const r = state.run;
  if (r && state.vm === r.vmId && $('#fix-slot')) $('#fix-slot').innerHTML = runPanel(r);
}
function startFix(vmId, resume) {
  if (state.run || (state.gate && !resume)) return;
  const v = vms.find((x) => x.id === vmId);
  if (!v || v.status !== 'red') return;
  const c = customers.find((x) => x.id === v.customer), raw = DATA.vms.find((x) => x.id === vmId), reasons = v.reasons;
  const plan = windowPlan(DATA, c, reasons);
  const ticket = resume ? resume.ticket : 'OP-' + state.nextTicket++;
  let win = plan && plan.window;
  if (resume) win = resume.window;
  else if (plan && plan.needed) { state.gate = { vmId, ticket, plan, note: '' }; render(); save(); const slot = $('#fix-slot'); if (slot && slot.scrollIntoView) slot.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  state.gate = null;
  const after = applyFixes(raw, reasons, DATA.tasks);
  const mail = composeMail(c, raw, reasons, DATA.tasks, ticket, plan && win);
  const approvers = [...new Set(reasons.map((r) => DATA.tasks[r.key].approver))].join(', ');
  const ev = evidence(raw, after, reasons);
  const E = [];
  E.push({ step: 0, text: `Ticket ${ticket} opened for ${c.name}, VM ${raw.name}, priority High: ${say(reasons[0].text)}.` });
  E.push({ step: 1, text: `Diagnosis: ${reasons.map((r) => DATA.tasks[r.key].title + ' (' + r.level + ')').join('; ')}.` });
  E.push({ step: 1, sub: true, text: raw.env === 'prod' ? `Pre-check: production VM, last backup ${raw.backupAgeHours} h ago, dependencies and owner checked (simulated).` : 'Pre-check: test VM, no backup needed, owner checked (simulated).' });
  E.push({ step: 2, text: `Approved automatically by policy for: ${approvers}. In production this change would normally need two approvals; the policy covers it and records it in the ticket.` });
  if (plan && win) E.push({ step: 2, sub: true, text: resume ? `Window ${slotOf(win)} agreed with the customer through the hotline.` : `Window ${slotOf(win)} set from the nights of the customer${plan.window && plan.window.moved ? ', moved because of: ' + plan.window.moved : ''}. ${plan.text}` });
  if (plan && win) E.push({ step: 3, sub: true, text: 'The restart waits for the window (simulated: the time is skipped).' });
  reasons.forEach((r) => {
    const d = DATA.tasks[r.key];
    E.push({ step: 3, text: `${d.title}${d.reboot ? ' (restart in a maintenance window)' : ''}` });
    d.steps.forEach((t) => E.push({ step: 3, sub: true, text: t }));
  });
  E.push({ step: 4, text: `Checked again: all checks of ${raw.name} are within their limits (green).`, act: () => { state.over[vmId] = after; recompute(); } });
  E.push({ step: 5, text: `E-mail to ${mail.to} prepared: "${mail.subject}" (preview, nothing is sent).` });
  E.push({ step: 6, text: `Ticket ${ticket} closed with the evidence of what changed.` });
  state.run = { waitedMin: resume ? DATA.window.customerMin : 0, reasons: reasons.map((r) => r.key), vmId, vmName: raw.name, customerName: c.name, ticket, mail, evidence: ev, events: E, shown: 0, ask: buildAsk(c, raw, reasons, DATA.tasks, ev) };
  tick();
}
/** What Auto-fix reports to the Orchestrator's Outcomes tab when a repair is closed. The minutes are simulated: the minutes of the tasks plus the wait for the customer. */
const OUTCOME_TEMPLATE = { cert: 'renew-certificate', patch: 'patch-vm', unreachable: 'patch-vm' };
function reportOutcome(r) {
  if (!inHost()) return;
  const first = r.reasons[0], def = DATA.tasks[first], raw = DATA.vms.find((v) => v.id === r.vmId);
  const minutes = r.reasons.reduce((n, k) => n + DATA.tasks[k].minutes, 0);
  const outcome = { source: 'auto-fix', id: r.ticket, template: OUTCOME_TEMPLATE[first] || first, label: def.title, customer: r.customerName, host: r.vmName, by: 'agent', result: 'done', durationMin: minutes + r.waitedMin, waitedMin: r.waitedMin, attempts: 1, floors: [] };
  window.parent.postMessage({ type: 'wb:handoff', to: 'infra-orchestrator', payload: { type: 'outcome', outcome }, open: false }, '*');
}
function tick() {
  const r = state.run;
  if (!r) return;
  if (r.shown < r.events.length) {
    const e = r.events[r.shown++];
    if (e.act) e.act();
    paint();
    r.timer = setTimeout(tick, DELAY[state.speed]);
  } else {
    state.records[r.vmId] = { vmId: r.vmId, vmName: r.vmName, customerName: r.customerName, ticket: r.ticket, mail: r.mail, evidence: r.evidence, events: r.events, ask: r.ask, asked: false };
    reportOutcome(r);
    state.run = null;
    render();
  }
}
function resetDemo() {
  if (state.run) clearTimeout(state.run.timer);
  state.run = null; state.gate = null; state.records = {}; state.over = {}; state.nextTicket = DATA.ticketStart;
  state.cust = null; state.vm = null; state.filter = 'all';
  render();
}

function render() {
  recompute(); crumbs();
  $('#view').innerHTML = state.vm ? viewVm() : state.cust ? viewCustomer() : viewCustomers();
  save();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-cust],[data-vm],[data-go],[data-f],[data-fix],[data-reset],[data-open],[data-real],[data-agree]');
  if (!t) return;
  if (t.dataset.agree) { if (t.dataset.agree === 'hotline') toHotline(); else if (t.dataset.agree === 'sim') agreeWindow(); else cancelGate(); return; }
  if (t.dataset.fix) { startFix(t.dataset.fix); return; }
  if (t.dataset.reset) { resetDemo(); return; }
  if (t.dataset.real) {
    const rec = state.records[t.dataset.real];
    if (rec && !rec.asked && inHost()) { window.parent.postMessage({ type: 'wb:ask', prompt: rec.ask }, '*'); rec.asked = true; render(); }
    return;
  }
  if (t.dataset.open) { const o = vms.find((x) => x.id === t.dataset.open); state.cust = o.customer; state.vm = o.id; state.filter = 'all'; }
  else if (t.dataset.cust) { state.cust = t.dataset.cust; state.vm = null; state.filter = 'all'; }
  else if (t.dataset.vm) state.vm = t.dataset.vm;
  else if (t.dataset.f) state.filter = t.dataset.f;
  else if (t.dataset.go === 'all') { state.cust = null; state.vm = null; }
  else if (t.dataset.go === 'cust') state.vm = null;
  render();
  window.scrollTo(0, 0);
});
$('#speed').addEventListener('change', (e) => { state.speed = e.target.value; });
window.addEventListener('message', (e) => {
  if (e.source !== window.parent || !e.data || e.data.type !== 'wb:restore') return;
  const m = e.data, st = m.state;
  if (st && st.records && st.over) { state.cust = st.cust || null; state.vm = st.vm || null; state.filter = st.filter || 'all'; state.speed = st.speed === 'fast' ? 'fast' : 'normal'; state.over = st.over; state.records = st.records; state.gate = st.gate || null; state.nextTicket = st.nextTicket || state.nextTicket; $('#speed').value = state.speed; }
  render();
  (Array.isArray(m.handoffs) ? m.handoffs : []).forEach((h) => {
    const p = h && h.payload, g = state.gate;
    if (!p || p.type !== 'window-result' || !g || p.taskId !== g.ticket) return;
    const w = Array.isArray(p.window) && p.window.length === 2 && TIME_RE.test(p.window[0]) && TIME_RE.test(p.window[1]) ? { start: p.window[0], end: p.window[1], fits: true, moved: null } : null;
    if (p.status === 'confirmed' && w) agreeWindow(w);
    else { g.note = 'The customer has not agreed yet (hotline status: ' + String(p.status || 'open').slice(0, 20) + ').'; render(); }
  });
  save();
});
render();
})();
</script>
