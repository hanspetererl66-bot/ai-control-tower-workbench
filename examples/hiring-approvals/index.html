<style id="design-system">
/* Shared design system for the example Spaces (AI Control Tower, Sub4Me).
   Source of truth: examples/shared/design-system.css. Embedded into each Space by
   `npm run sync:design` (Spaces are single-file pages: no network, no external CSS).
   Light and dark follow prefers-color-scheme (or data-theme on <html>); colours only exist as tokens. */
:root{
  color-scheme:light dark;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:var(--font); /* one typeface everywhere; numbers use tabular figures */
  --canvas:#f6f5f8;--surface:#ffffff;--ink:#1b1a22;--ink-2:#46444f;--muted:#6c6a78;--faint:#c3c1cd;--line:#e6e4ec;--line-2:#f1f0f5;--wash:#faf9fc;
  --purple:#8056B8;--purple-mid:#633F96;--purple-deep:#3B2660;--purple-dim:rgba(128,86,184,.07);--purple-border:rgba(128,86,184,.22);--purple-light:#efeaf7;
  --green:#00875A;--green-dim:rgba(0,135,90,.09);--green-border:rgba(0,135,90,.22);
  --amber:#a85c00;--amber-dim:rgba(176,94,0,.09);--amber-border:rgba(176,94,0,.24);
  --red:#c9190b;--red-dim:rgba(201,25,11,.08);--red-border:rgba(201,25,11,.22);
  --blue:#4A6FA5;--blue-dim:rgba(74,111,165,.09);--blue-border:rgba(74,111,165,.24);
  --teal:#006b75;--teal-dim:rgba(0,107,117,.09);
  --radius:20px;--radius-s:12px;--shadow:0 1px 2px rgba(20,18,30,.04),0 6px 20px rgba(20,18,30,.05);--shadow-lg:0 24px 60px rgba(20,18,30,.22);
  --space:8px;
  /* Control Tower token names */
  --black:var(--surface);--white:var(--surface);
  --g900:var(--ink);--g700:var(--ink-2);--g500:var(--muted);--g300:var(--faint);--g200:var(--line);--g100:var(--line-2);--g50:var(--wash);
  --sh:var(--shadow);--p-dim:var(--purple-dim);--r-dim:var(--red-dim);--r-bd:var(--red-border);--a-bd:var(--amber-border);--g-bd:var(--green-border);
  /* Sub4Me token names */
  --bg:var(--canvas);--panel:var(--surface);--mut:var(--muted);--brand:var(--purple);--brand-dim:var(--purple-dim);
  --ok:var(--green);--ok-dim:var(--green-dim);--warn:var(--amber);--warn-dim:var(--amber-dim);--bad:var(--red);--bad-dim:var(--red-dim);
}
/* Dark follows the system unless the host pins a theme with data-theme on <html> (the app does, so Spaces follow its Appearance setting). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0f0e13;--surface:#18171d;--ink:#f4f3f8;--ink-2:#d3d1dc;--muted:#9e9cab;--faint:#5b5967;--line:#2b2a33;--line-2:#222129;--wash:#1d1c24;
  --purple:#B79CE0;--purple-mid:#D0BDF0;--purple-deep:#E6DCF8;--purple-dim:rgba(183,156,224,.13);--purple-border:rgba(183,156,224,.32);--purple-light:#272037;
  --green:#3ddc97;--green-dim:rgba(61,220,151,.13);--green-border:rgba(61,220,151,.3);
  --amber:#ffb454;--amber-dim:rgba(255,180,84,.13);--amber-border:rgba(255,180,84,.3);
  --red:#ff7a70;--red-dim:rgba(255,122,112,.13);--red-border:rgba(255,122,112,.3);
  --blue:#8AAAD8;--blue-dim:rgba(138,170,216,.14);--blue-border:rgba(138,170,216,.32);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0f0e13;--surface:#18171d;--ink:#f4f3f8;--ink-2:#d3d1dc;--muted:#9e9cab;--faint:#5b5967;--line:#2b2a33;--line-2:#222129;--wash:#1d1c24;
  --purple:#B79CE0;--purple-mid:#D0BDF0;--purple-deep:#E6DCF8;--purple-dim:rgba(183,156,224,.13);--purple-border:rgba(183,156,224,.32);--purple-light:#272037;
  --green:#3ddc97;--green-dim:rgba(61,220,151,.13);--green-border:rgba(61,220,151,.3);
  --amber:#ffb454;--amber-dim:rgba(255,180,84,.13);--amber-border:rgba(255,180,84,.3);
  --red:#ff7a70;--red-dim:rgba(255,122,112,.13);--red-border:rgba(255,122,112,.3);
  --blue:#8AAAD8;--blue-dim:rgba(138,170,216,.14);--blue-border:rgba(138,170,216,.32);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,.13);
  --shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.65);
}
:root[data-theme="light"]{color-scheme:light}

/* ---- Base ---- */
body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* Calmer labels: no all-caps micro headings, also where pages style them inline. */
[style*="text-transform:uppercase"]{text-transform:none!important;letter-spacing:0!important}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}
.tag,.mv,.bv,.kval,.dv,.tbl td,.num,.hdr-stat-val{font-variant-numeric:tabular-nums}

/* ---- Cards and tiles (both Spaces) ---- */
.mc,.card,.ns,.dtier,.pc,.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mc{padding:20px 22px}
.card,.ns{padding:24px;margin-bottom:16px}
.dtier,.pc,.cc{padding:18px}
.ns{border-top:1px solid var(--line)}
.ml,.k{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.mv,.v{font-family:var(--font);font-size:30px;font-weight:650;letter-spacing:-.025em;color:var(--ink);line-height:1.15}
.md,.s{font-size:12px}
.sh{font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);margin:36px 0 14px}
.chd{font-size:15px;font-weight:650;color:var(--ink)}

/* Status tags */
.tag{font-family:var(--font);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;border-width:1px}
.src{border-radius:99px;font-weight:600}

/* Tables */
.tbl th,table th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 14px}
.tbl td,table td{padding:14px;border-bottom:1px solid var(--line-2)}
.tbl{border-collapse:collapse}

/* Bars */
.bt{height:6px;border-radius:99px;background:var(--line-2)}
.bf{border-radius:99px}
.bar{background:var(--line-2)}

/* Alerts, notes and callouts */
.ab{border-radius:var(--radius);border-width:1px;border-left-width:1px;padding:18px 20px}
.ab-w{border-color:var(--amber-border)}.ab-i{border-color:var(--purple-border)}.ab-s{border-color:var(--blue-border)}.ab-ok{border-color:var(--green-border)}

/* Forms and buttons */
input,select,textarea{font-family:var(--font);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px var(--purple-dim)}
/* Calm Bento buttons: one family. Primary = Accenture purple on white text, secondary = soft tint, quiet = neutral. */
button.primary,button.ghost,button.small{font:inherit;font-size:13px;font-weight:550;line-height:1.2;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
button.primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 1px 2px rgba(70,0,115,.18)}
button.small{padding:5px 11px;font-size:12px;background:var(--purple-dim);border-color:var(--purple-border);color:var(--purple-mid)}
button.ghost:hover:not(:disabled),button.small:hover:not(:disabled){border-color:var(--purple-border);background:var(--purple-dim);color:var(--purple-mid)}
button.primary:hover:not(:disabled){background:var(--purple-mid);border-color:var(--purple-mid)}
button.primary:disabled,button.ghost:disabled,button.small:disabled{opacity:.5;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}:root:not([data-theme="light"]) button.small,:root:not([data-theme="light"]) button.ghost:hover:not(:disabled){color:var(--purple)}}
:root[data-theme="dark"] button.primary{background:var(--purple);border-color:var(--purple);color:#1a0a2b}
:root[data-theme="dark"] button.small,:root[data-theme="dark"] button.ghost:hover:not(:disabled){color:var(--purple)}

/* Bento: the first tile of a KPI row carries the accent wash. */

/* Overlay (agent list) */
.ag-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 30px}
.ag-ov{background:rgba(14,12,20,.55);backdrop-filter:blur(4px);z-index:200}
.ag-x,.ag-tools input,.ag-tools button{border-radius:var(--radius-s)}
.ag-x{background:var(--surface);color:var(--ink);border-color:var(--line)}
.ag-tools button{background:var(--purple-dim);color:var(--purple);border-color:var(--purple-border)}
.ag-tbl th{font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ag-tbl td{padding:10px 8px}

/* ---- Control Tower shell ---- */
.ct .hdr{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:60px;padding:0 32px}
.ct .hdr-title{color:var(--ink);font-size:15px;font-weight:650}
.ct .hdr-sub{font-family:var(--font);font-size:11px;letter-spacing:.01em;color:var(--muted)}
.ct .hdr-div{background:var(--line)}
.ct .acc-mark{color:var(--purple)}
.ct .hdr-stat-val{color:var(--ink);font-family:var(--font);font-weight:600}
.ct .hdr-stat-lbl{color:var(--muted);letter-spacing:.02em;text-transform:none;font-size:11px}
.ct .live{color:var(--muted);font-family:var(--font)}
.ct .tbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px;gap:4px}
.ct .tb{padding:16px 14px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.ct .tb:hover:not(.on){color:var(--ink)}
.ct .tb.on{color:var(--purple);border-bottom:2px solid var(--purple);font-weight:600}
.ct .tnum{display:none}
.ct .pg{padding:40px 32px 64px;max-width:1320px;margin:0 auto}
.ct .mr{gap:16px;margin-bottom:32px}
.ct .g2,.ct .g3,.ct .g4{gap:20px}
.ct .br{margin-bottom:14px}
.ct .krow,.ct .srow,.ct .ci{padding:14px 0}
.ct .kdesc,.ct .sdesc,.ct .abod{line-height:1.65}
.ct .fn{border-radius:99px;font-family:var(--font)}
.ct .ns-fml{font-family:var(--font);border-radius:var(--radius-s)}
.ct .dm{font-family:var(--font);letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:500}

/* ---- Sub4Me shell ---- */
.s4m header{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 32px;min-height:60px;box-sizing:border-box}
.s4m .logo{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.5}
.s4m header .s{font-size:11px;letter-spacing:.01em;line-height:1.5;margin-top:1px;color:var(--muted)}
.s4m{font-size:13px}

    if (c.status === 'released') { out.push({ label: 'Sending', state: 'now', at: '' }); return out; }
    out.push({ label: 'Sent', state: 'approved', at: c.sentAt });
    if (c.status === 'sent') out.push({ label: 'Waiting for the candidate', state: 'now', at: '' });
    else if (c.status === 'signed') out.push({ label: 'Signed', state: 'approved', at: c.signedAt || c.decidedAt });
    else out.push({ label: c.status === 'declined' ? 'Declined by the candidate' : 'Expired unsigned', state: 'declined', at: c.decidedAt });
    return out;
  }
  function contractLine(c) {
    if (!c) return 'contract follows';
    var m = { prepared: 'contract written, waiting for HR to release it', released: 'contract released by HR, sending', sent: 'contract sent, waiting for the candidate', signed: 'contract signed', declined: 'contract declined by the candidate', expired: 'contract expired unsigned' };
    return m[c.status] || 'contract ' + c.status;
  }
  function progress(r) {
    var n = r.steps.length;
    if (r.status === 'approved') return 'Approved by all ' + n + ' steps · ' + contractLine(r.contract);
    if (r.status === 'returned') return 'Returned at step ' + r.currentStep + ' of ' + n;
    if (r.status === 'declined') return 'Declined at step ' + r.currentStep + ' of ' + n;
    var s = stepNow(r);
    return 'Step ' + r.currentStep + ' of ' + n + (s ? ' · waiting for ' + (ROLE[s.role] || s.role) : '');
  }
  // Sample mode only: the same rule as the database function.
  function releaseLocal(r, email, now) {
    if (!contractMine(r, email)) return { ok: false, error: 'only the HR approver of this request can release the contract' };
    var q = clone(r); q.contract.status = 'released'; q.contract.releasedAt = now; q.contract.releasedBy = email;
    q.events.push({ event: 'contract_released', role: 'hr', actor: email, at: now, note: '' });
    return { ok: true, request: q };
  }
  // The same rules as the database function, so the sample mode shows what the real one would do.
  function decideLocal(r, email, decision, note, now) {
    if (DECISIONS.indexOf(decision) < 0) return { ok: false, error: 'Unknown decision.' };
    if (r.status !== 'pending') return { ok: false, error: 'This request is already decided.' };
    if (!isMine(r, email)) return { ok: false, error: 'It is not your turn.' };
    var why = String(note || '').replace(/\s+/g, ' ').trim().slice(0, 300);
    if (decision !== 'approve' && !why) return { ok: false, error: 'A reason is needed to return or decline.' };
    var out = clone(r);
    var step = stepNow(out);
    var status = decision === 'approve' ? 'approved' : decision === 'return' ? 'returned' : 'declined';
    step.status = status; step.decidedAt = now; step.note = why;
    out.events.push({ event: status, role: step.role, actor: email, at: now, note: why });
    if (decision !== 'approve') { out.status = status; out.decidedAt = now; }
    else if (out.currentStep >= out.steps.length) { out.status = 'approved'; out.decidedAt = now; }
    else out.currentStep += 1;
    return { ok: true, request: out, final: out.status !== 'pending' };
  }
  // @logic-end

  var S = { tab: 'mine', sel: null, live: false, list: [], viewer: D.defaultViewer, msg: '', busy: false, err: '', note: '', ask: null };
  var pending = {}; var seq = 0;
  var TABS = [['mine', 'Waiting for me'], ['progress', 'In progress'], ['decided', 'Decided'], ['how', 'How it works']];
  var STATUS = { pending: ['In progress', 'blue'], approved: ['Approved', 'ok'], returned: ['Returned', 'amber'], declined: ['Declined', 'bad'], waiting: ['Waiting', ''] };

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function tag(st) { var m = STATUS[st] || [st, '']; return '<span class="tag ' + m[1] + '">' + esc(m[0]) + '</span>'; }
  function ask(text) { if (window.parent !== window) window.parent.postMessage({ type: 'wb:ask', prompt: String(text).slice(0, 600) }, '*'); }
  function when(t) { return t ? String(t).replace('T', ' ').slice(0, 16) : ''; }
  function me() { return S.viewer; }
  function selected() { return S.list.filter(function (r) { return r.id === S.sel; })[0] || null; }
  function inTab(r) { return bucket(r, me()) === S.tab; }

  // ---------- bridge (desktop app only) ----------
  function request(msg) {
    return new Promise(function (resolve) {
      var id = 'h' + (++seq);
      pending[id] = resolve; msg.requestId = id;
      window.parent.postMessage(msg, '*');
      setTimeout(function () { if (pending[id]) { delete pending[id]; resolve({ type: 'ct:error', message: 'No answer from the app.' }); } }, 10000);
    });
  }
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (e.source !== window.parent || !m || typeof m !== 'object' || !pending[m.requestId]) return;
    var done = pending[m.requestId]; delete pending[m.requestId]; done(m);
  });

  function loadSample(why) {
    S.live = false; S.list = D.requests.map(function (r) { return JSON.parse(JSON.stringify(r)); }); S.viewer = D.defaultViewer;
    S.msg = why;
    if (!selected()) S.sel = null;
    finish();
  }
  function loadLive() {
    var statuses = ['pending', 'approved', 'returned', 'declined'];
    return statuses.reduce(function (chain, st) {
      return chain.then(function (acc) {
        if (acc.error) return acc;
        return request({ type: 'ha:list-request', status: st }).then(function (m) {
          if (m.type !== 'ha:list') return { error: m.message || 'Could not read the requests.' };
          return { rows: acc.rows.concat(m.requests || []) };
        });
      });
    }, Promise.resolve({ rows: [] })).then(function (res) {
      if (res.error) { loadSample('Could not reach the shared database (' + res.error + '). Showing sample data; nothing you do here is saved.'); return; }
      S.live = true; S.list = res.rows; S.msg = '';
      finish();
    });
  }
  function finish() {
    var first = S.list.filter(inTab)[0];
    if (!selected() || !inTab(selected())) S.sel = first ? first.id : null;
    render();
  }
  function reload() { if (S.live) loadLive(); else render(); }

  // ---------- views ----------
  function vList(tab) {
    var rows = S.list.filter(function (r) { return bucket(r, me()) === tab; });
    var empty = { mine: 'Nothing is waiting for you.', progress: 'No request is on its way.', decided: 'No decided request yet.' }[tab];
    var left = rows.length ? '<div class="list">' + rows.map(function (r) {
      return '<button type="button" class="item" data-sel="' + r.id + '" aria-pressed="' + (r.id === S.sel) + '"><div class="top"><b>' + esc(r.candidate) + '</b><span>' + esc(r.title) + '</span>' + tag(r.status) + '</div>' +
        '<div class="meta">' + esc(r.requisition) + ' · ' + esc(r.dept) + ' · ' + esc(progress(r)) + '</div></button>';
    }).join('') + '</div>' : '<div class="empty">' + empty + '</div>';
    var r = selected();
    return '<div class="two"><div>' + left + '</div><div>' + (r && bucket(r, me()) === tab ? vDetail(r) : '<div class="empty">Select a request to see the candidate, the terms and the approval chain.</div>') + '</div></div>';
  }
  function vContract(r) {
    if (r.status !== 'approved') return '';
    var c = r.contract;
    if (!c) return '<h3>Contract</h3><div class="note">After the last approval the database writes the contract from the approved terms; HR releases it, then a workflow sends it for signature.</div>';
    var steps = contractSteps(c).map(function (x) { return '<div class="step ' + esc(x.state) + '"><b>' + esc(x.label) + '</b>' + (x.at ? '<div>' + esc(when(x.at)) + '</div>' : '') + '</div>'; }).join('');
    var facts = [];
    if (c.provider) facts.push('Service: ' + esc(c.provider));
    if (c.status === 'sent' && c.expiresAt) facts.push('Valid until ' + esc(when(c.expiresAt)));
    if (c.bodySha256) facts.push('Text fingerprint ' + esc(String(c.bodySha256).slice(0, 12)) + '…');
    if (c.status === 'signed') facts.push('Signed document stored in the database' + (c.signedSha256 ? ' · fingerprint ' + esc(String(c.signedSha256).slice(0, 12)) + '…' : ''));
    var rel = '';
    if (c.status === 'prepared') {
      rel = contractMine(r, me())
        ? '<div class="act"><b>Release the contract</b><div class="note">Nothing goes to the candidate before you release it. After the release the contract is sent for signature by itself; you cannot change the text here, it was written from the approved terms.</div><div class="row"><button type="button" class="btn primary" data-release="1"' + (S.busy ? ' disabled' : '') + '>Release the contract</button></div>' + (S.err ? '<div class="err" role="alert">' + esc(S.err) + '</div>' : '') + '</div>'
        : '<div class="note">Waiting for HR to release the contract. Nothing is sent to the candidate before that.</div>';
    }
    var sim = c.method === 'simulation' ? '<div class="note">Simulation: no e-signature service was connected. This is not a legal signature.</div>' : '';
    return '<h3>Contract · ' + esc(contractLine(c)) + '</h3><div class="chain">' + steps + '</div>' + (facts.length ? '<div class="sub">' + facts.join(' · ') + '</div>' : '') + rel + sim;
  }
  function vDetail(r) {
    var t = r.terms || {};
    var mine = isMine(r, me());
    var chain = r.steps.map(function (s) {
      var now = r.status === 'pending' && s.ord === r.currentStep;
      var cls = s.status === 'waiting' && now ? 'now' : s.status;
      var label = s.status === 'waiting' ? (now ? 'Its turn' : 'Waiting') : (STATUS[s.status] ? STATUS[s.status][0] : s.status);
      return '<div class="step ' + esc(cls) + '"><b>' + s.ord + '. ' + esc(ROLE[s.role] || s.role) + '</b><small>' + esc(s.approver) + '</small><div>' + esc(label) + (s.decidedAt ? ' · ' + esc(when(s.decidedAt)) : '') + '</div>' + (s.note ? '<small>“' + esc(s.note) + '”</small>' : '') + '</div>';
    }).join('');
    var act = '';
    if (r.status === 'pending' && mine) {
      act = '<div class="act"><b>Your decision</b><div class="note">Approve passes the request on. Return and Decline need a reason and end this request; a changed request is a new request.</div>' +
        '<label for="why" class="sub">Reason (required for Return and Decline)</label><textarea id="why" maxlength="300">' + esc(S.note) + '</textarea>' +
        '<div class="row"><button type="button" class="btn primary" data-do="approve"' + (S.busy ? ' disabled' : '') + '>Approve</button>' +
        '<button type="button" class="btn" data-do="return"' + (S.busy ? ' disabled' : '') + '>Return for changes</button>' +
        '<button type="button" class="btn danger" data-do="decline"' + (S.busy ? ' disabled' : '') + '>Decline</button></div>' +
        (S.err ? '<div class="err" role="alert">' + esc(S.err) + '</div>' : '') + '</div>';
    } else if (r.status === 'pending') {
      var s = stepNow(r);
      act = '<div class="note">Waiting for ' + esc(s ? s.approver : 'the next approver') + '. You cannot decide this step.</div>';
    }
    if (S.ask && S.ask.id === r.id) act = '<div class="done" role="status">' + esc(S.ask.text) + '</div>' + act;
    return '<div class="panel"><div class="head"><h2>' + esc(r.candidate) + ' · ' + esc(r.title) + '</h2>' + tag(r.status) + '</div>' +
      '<div class="sub">' + esc(r.requisition) + ' · ' + esc(r.dept) + ' · requested by ' + esc(r.createdBy) + ' · ' + esc(when(r.at)) + '</div>' +
      '<div class="terms"><div><span>Level</span><b>' + esc(t.level) + '</b></div><div><span>Pay band</span><b>' + esc(t.band) + '</b></div><div><span>Start</span><b>' + esc(t.start_on) + '</b></div><div><span>Contract</span><b>' + esc(t.contract) + '</b></div></div>' +
      (t.note ? '<div class="note">Note: ' + esc(t.note) + '</div>' : '') +
      '<h3>Evidence from the recruiting process</h3><div class="evidence">' + esc(r.evidence) + '</div>' +
      '<h3>Approval chain · ' + esc(progress(r).split(' · ')[0]) + '</h3><div class="chain">' + chain + '</div>' + act + vContract(r) +
      '<h3>Log</h3><ul class="log">' + r.events.map(function (e) { return '<li><time>' + esc(when(e.at)) + '</time><span><b>' + esc(eventLabel(e.event)) + '</b>' + (e.role ? ' · ' + esc(ROLE[e.role] || e.role) : '') + ' · ' + esc(e.actor) + (e.note ? ' — “' + esc(e.note) + '”' : '') + '</span></li>'; }).join('') + '</ul></div>';
  }
  function vHow() {
    return '<div class="cols">' +
      '<div class="card"><h2>What a request is</h2><p>The hiring manager asks to hire <b>one candidate who is in the stage Offer</b>, after the recruiting process. The request carries level, pay band (a name, never an amount), start date, contract and the evidence line from the shortlist. Joule can prepare it in chat: “Prepare a hiring request for C-4204.”</p><div class="row"><button type="button" class="btn" data-prompt="Prepare a hiring request for the candidate in the stage Offer of my requisition. Ask me for level, pay band, start date, contract, and the e-mail addresses of the HR and finance approvers. Show me everything before you write it.">Ask Joule to prepare one</button></div></div>' +
      '<div class="card"><h2>Who decides, in which order</h2><ol class="steps2"><li>Hiring manager</li><li>HR</li><li>Finance</li><li>Department head (only if named)</li></ol><p>Only the person whose turn it is can decide. Nobody can hold two steps. Joule has no tool to approve, return or decline.</p></div>' +
      '<div class="card"><h2>What a decision does</h2><p><b>Approve</b> passes the request on; the last approval makes it final. <b>Return</b> and <b>Decline</b> need a reason and end the request. A changed request is a new request. The log only grows.</p></div>' +
      '<div class="card"><h2>Messages and reminders</h2><p>An <b>n8n workflow</b> (<span class="mono">11-hiring-approval-notices</span>) runs every 15 minutes and asks the database what is due: the first notice to the approver whose turn it is, a reminder after 2 days, an escalation to the requester after 5 days, and the result when a request ended. It sends the messages and records them in the log below. It cannot approve, return or decline, and it cannot message anyone the chain does not name.</p></div>' +
      '<div class="card"><h2>Contract and signature</h2><p>After the <b>last approval</b> the database writes the text from the approved terms (a fixed template; the legal department replaces its wording before real use). <b>HR releases the contract</b> with one click; only the HR approver of that request can, and nothing goes to the candidate before. After the release a second <b>n8n workflow</b> (<span class="mono">12-hiring-contract-signature</span>) sends it to the e-signature service, takes the candidate\'s answer (signed, declined or expired) and writes it back. A signed document is <b>stored in the database</b> with its fingerprint; the database refuses an answer for another envelope or with a hash that does not match. Without a connected service the workflow runs a labelled <b>simulation</b>.</p></div>' +
      '<div class="card"><h2>What it does not do</h2><ul class="steps2"><li>It does not hold salary amounts or personal data.</li><li>It does not write anything to a recruiting system (no SmartRecruiters or SuccessFactors connection).</li><li>It does not check who a person really is: identity is the e-mail set in the Werkbank. Production needs single sign-on.</li><li>Recruiting is high-risk under the EU AI Act; involve the works council and data protection before real use.</li></ul>' + (S.live ? '<div class="row"><button type="button" class="btn" data-tools="1">Open proposals and criteria</button></div>' : '') + '</div></div>';
  }

  function render() {
    var c = counts(S.list, me());
    $('#mode').className = 'mode' + (S.live ? ' live' : '');
    $('#mode').textContent = S.live ? 'Live: the requests of the signed-in e-mail from the shared database. Decisions are saved and logged.' : (S.msg || 'Mockup with fictional data (sample mode). Decisions here are simulated in this page and are not saved. In the desktop app with the shared database the same screen shows your real requests.');
    $('#modetag').className = 'tag ' + (S.live ? 'ok' : 'amber'); $('#modetag').textContent = S.live ? 'live' : 'sample data';
    $('#who').innerHTML = S.live ? '' : 'View as <select id="viewer" aria-label="View as">' + D.viewers.map(function (v) { return '<option value="' + esc(v.email) + '"' + (v.email === S.viewer ? ' selected' : '') + '>' + esc(v.label) + '</option>'; }).join('') + '</select>';
    $('#tabs').innerHTML = TABS.map(function (t) {
      var n = c[t[0]]; var badge = t[0] === 'how' ? '' : '<span class="n' + (t[0] === 'mine' && n ? ' hot' : '') + '">' + n + '</span>';
      return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + badge + '</button>';
    }).join('');
    $('#main').innerHTML = S.tab === 'how' ? vHow() : vList(S.tab);
  }

  function decide(decision) {
    var r = selected(); if (!r) return;
    var why = ($('#why') ? $('#why').value : S.note).trim(); S.note = why; S.err = '';
    if (decision !== 'approve' && !why) { S.err = 'A reason is needed to return or decline.'; render(); return; }
    if (!S.live) {
      var out = decideLocal(r, me(), decision, why, new Date().toISOString().slice(0, 16));
      if (!out.ok) { S.err = out.error; render(); return; }
      S.list = S.list.map(function (x) { return x.id === r.id ? out.request : x; });
      S.ask = { id: r.id, text: out.final ? 'Done (simulated): the request is now ' + out.request.status + '.' : 'Done (simulated): passed on to the next approver.' };
      S.note = ''; S.tab = bucket(out.request, me()); S.sel = r.id; render(); return;
    }
    S.busy = true; render();
    request({ type: 'ha:decide-request', id: r.id, decision: decision, note: why }).then(function (m) {
      S.busy = false;
      if (m.type !== 'ha:decided') { S.err = m.message || 'The decision was not saved.'; render(); return; }
      S.note = ''; S.ask = { id: r.id, text: m.result.final ? 'Saved: the request is now ' + m.result.status + '.' : 'Saved: passed on to the next approver.' };
      var id = r.id;
      loadLive().then(function () { var n = S.list.filter(function (x) { return x.id === id; })[0]; if (n) { S.tab = bucket(n, me()); S.sel = id; } render(); });
    });
  }

  function release() {
    var r = selected(); if (!r) return;
    S.err = '';
    if (!S.live) {
      var out = releaseLocal(r, me(), new Date().toISOString().slice(0, 16));
      if (!out.ok) { S.err = out.error; render(); return; }
      S.list = S.list.map(function (x) { return x.id === r.id ? out.request : x; });
      S.ask = { id: r.id, text: 'Done (simulated): the contract is released and goes out for signature.' };
      S.tab = bucket(out.request, me()); S.sel = r.id; render(); return;
    }
    S.busy = true; render();
    request({ type: 'ha:release-request', id: r.id }).then(function (m) {
      S.busy = false;
      if (m.type !== 'ha:released') { S.err = m.message || 'The release was not saved.'; render(); return; }
      S.ask = { id: r.id, text: 'Saved: the contract is released and goes out for signature.' };
      var id = r.id;
      loadLive().then(function () { var n = S.list.filter(function (x) { return x.id === id; })[0]; if (n) { S.tab = bucket(n, me()); S.sel = id; } render(); });
    });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-tab],[data-sel],[data-do],[data-release],[data-prompt],[data-tools]');
    if (!el) return;
    var d = el.dataset;
    if (d.tab) { S.tab = d.tab; S.err = ''; S.ask = null; finish(); }
    else if (d.sel) { S.sel = Number(d.sel); S.err = ''; S.ask = null; S.note = ''; render(); }
    else if (d.do) decide(d.do);
    else if (d.release) release();
    else if (d.prompt) ask(d.prompt);
    else if (d.tools) window.parent.postMessage({ type: 'ha:open-tools' }, '*');
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'viewer') { S.viewer = e.target.value; S.err = ''; S.ask = null; S.tab = 'mine'; finish(); }
  });

  if (window.parent !== window) loadLive(); else loadSample('');
})();
</script>
</body>
</html>
