# CodeRabbit review settings. Install the CodeRabbit GitHub app for this repository to activate.
language: de-DE
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!package-lock.json"
    - "!dist/**"
  path_instructions:
    - path: "examples/**/index.html"
      instructions: |
        Spaces are single-file HTML pages that run in a sandboxed iframe (allow-scripts, null origin).
        Flag remote loads (CDN scripts, fonts, images), literal white backgrounds, missing dark mode
        (prefers-color-scheme), missing class "card", and unescaped data written into innerHTML.
        Embedded data and the design system are generated by the scripts/sync-*.mjs files; do not ask for
        manual edits inside the embedded blocks, ask to rerun the sync script instead.
    - path: "connectors/control-tower/**"
      instructions: |
        MCP connector over stdio without dependencies. Tools must be read-only unless clearly named otherwise,
        validate their input, never echo secrets, and be listed in manifest.json (tests pin the list).
    - path: "scripts/sync-*.mjs"
      instructions: "Sync scripts need a --check mode and must be deterministic."
    - path: "src/**"
      instructions: "React/TypeScript renderer. Keep UI text German, keep pure logic in small testable modules under src/."
  tools:
    gitleaks:
      enabled: true
    markdownlint:
      enabled: false
chat:
  auto_reply: true
